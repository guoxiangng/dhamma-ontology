on were over, he sat down to one side and said to Upavāṇa:", "pi": "Sammodanīyaṁ kathaṁ sāraṇīyaṁ vītisāretvā ekamantaṁ nisīdi. Ekamantaṁ nisinno kho āyasmā sāriputto āyasmantaṁ upavānaṁ etadavoca:", "claims": [], "eval": []}, {"id": "sn46.8:2.1", "en": "“Reverend Upavāṇa, can a mendicant know that by investigating inside themselves, the seven awakening factors have been properly implemented so that they lead to living at ease?”", "pi": "“Jāneyya nu kho, āvuso upavāna, bhikkhu ‘paccattaṁ yonisomanasikārā evaṁ susamāraddhā me satta bojjhaṅgā phāsuvihārāya saṁvattantī’”ti?", "claims": [{"kind": "outcome", "layer": "sutta", "text": "the seven awakening factors leads to living at ease (“the seven awakening factors have been properly implemented so that they lead to living at ease”)"}], "eval": ["Q51"]}, {"id": "sn46.8:2.2", "en": "“They can, Reverend Sāriputta.", "pi": "“Jāneyya kho, āvuso sāriputta, bhikkhu ‘paccattaṁ yonisomanasikārā evaṁ susamāraddhā me satta bojjhaṅgā phāsuvihārāya saṁvattantī’”ti.", "claims": [{"kind": "outcome", "layer": "sutta", "text": "the seven awakening factors leads to living at ease (“the seven awakening factors have been properly implemented so that they lead to living at ease”)"}], "eval": ["Q51"]}, {"id": "sn46.8:3.1", "en": "As a mendicant rouses up the awakening factor of mindfulness, they understand: ‘My mind is well freed. I’ve eradicated dullness and drowsiness, and eliminated restlessness and remorse. My energy is roused up, and my mind is sharply focused, not sluggish.’ …", "pi": "“Satisambojjhaṅgaṁ kho, āvuso, bhikkhu ārabbhamāno pajānāti ‘cittañca me suvimuttaṁ, thinamiddhañca me susamūhataṁ, uddhaccakukkuccañca me suppaṭivinītaṁ, āraddhañca me vīriyaṁ, aṭṭhiṁ katvā manasi karomi, no ca līnan’ti …pe…", "claims": [], "eval": []}, {"id": "sn46.8:3.2", "en": "As they rouse up the awakening factor of equanimity, they understand: ‘My mind is well freed. I’ve eradicated dullness and drowsiness, and eliminated restlessness and remorse. My energy is roused up, and my mind is sharply focused, not sluggish.’", "pi": "upekkhāsambojjhaṅgaṁ āvuso, bhikkhu ārabbhamāno pajānāti ‘cittañca me suvimuttaṁ, thinamiddhañca me susamūhataṁ, uddhaccakukkuccañca me suppaṭivinītaṁ, āraddhañca me vīriyaṁ, aṭṭhiṁ katvā manasi karomi, no ca līnan’”ti.", "claims": [], "eval": []}, {"id": "sn46.8:3.3", "en": "That’s how a mendicant can know that by investigating inside themselves, the seven awakening factors are properly implemented so that they lead to living at ease.”", "pi": "“Evaṁ kho, āvuso sāriputta, bhikkhu jāneyya ‘paccattaṁ yonisomanasikārā evaṁ susamāraddhā me satta bojjhaṅgā phāsuvihārāya saṁvattantī’”ti.", "claims": [{"kind": "outcome", "layer": "sutta", "text": "the seven awakening factors leads to living at ease (“the seven awakening factors have been properly implemented so that they lead to living at ease”)"}], "eval": ["Q51"]}, {"id": "sn46.8:3.4", "en": "", "pi": "Aṭṭhamaṁ.", "claims": [], "eval": []}], "cited": 3}, {"uid": "dhp279", "title": "Dhammapada 279", "layer": "Sutta (early discourses)", "coverage": "cited only", "review": "not yet reviewed", "encodes": "The first line of the verse ('All things are not-self') as evidence for 'dhamma' meaning any phenomenon.", "leftOut": "The rest of the verse, and the rest of the Path chapter (Dhp 273-289).", "modelledBy": "project owner with Claude (AI assistant), from SuttaCentral's text", "modelledOn": "2026-11-13", "segments": [{"id": "dhp279:0", "en": "", "pi": "Anattalakkhaṇavatthu", "claims": [], "eval": []}, {"id": "dhp279:1", "en": "All things are not-self—", "pi": "“Sabbe dhammā anattā”ti,", "claims": [{"kind": "word sense", "layer": "lexicon", "text": "'dhamma' meaning a dhamma (any phenomenon, any thing)"}], "eval": ["Q27"]}, {"id": "dhp279:2", "en": "when this is seen with wisdom,", "pi": "yadā paññāya passati;", "claims": [], "eval": []}, {"id": "dhp279:3", "en": "one grows disillusioned with suffering:", "pi": "Atha nibbindati dukkhe,", "claims": [], "eval": []}, {"id": "dhp279:4", "en": "this is the path to purity.", "pi": "esa maggo visuddhiyā.", "claims": [], "eval": []}], "cited": 1}, {"uid": "mn10", "title": "MN 10 Satipaṭṭhānasutta — Mindfulness Meditation", "layer": "Sutta (early discourses)", "coverage": "cited only", "review": "not yet reviewed", "encodes": "One segment (36.2), recorded as a contested use of the word 'dhamma' and deliberately left without a sense.", "leftOut": "The whole teaching on the four kinds of mindfulness meditation. Its section on the five hindrances (knowing when each is present, how it arises, how it is given up) bears directly on this ontology and should come next.", "modelledBy": "project owner with Claude (AI assistant), from SuttaCentral's text", "modelledOn": "2026-11-13", "segments": [{"id": "mn10:0.1", "en": "Middle Discourses 10", "pi": "Majjhima Nikāya 10", "claims": [], "eval": []}, {"id": "mn10:0.2", "en": "Mindfulness Meditation", "pi": "Satipaṭṭhānasutta", "claims": [], "eval": []}, {"id": "mn10:1.1", "en": "So I have heard.", "pi": "Evaṁ me sutaṁ—", "claims": [], "eval": []}, {"id": "mn10:1.2", "en": "At one time the Buddha was staying in the land of the Kurus, near the Kuru town named Kammāsadamma.", "pi": "ekaṁ samayaṁ bhagavā kurūsu viharati kammāsadhammaṁ nāma kurūnaṁ nigamo.", "claims": [], "eval": []}, {"id": "mn10:1.3", "en": "There the Buddha addressed the mendicants,", "pi": "Tatra kho bhagavā bhikkhū āmantesi:", "claims": [], "eval": []}, {"id": "mn10:1.4", "en": "“Mendicants!”", "pi": "“bhikkhavo”ti.", "claims": [], "eval": []}, {"id": "mn10:1.5", "en": "“Venerable sir,” they replied.", "pi": "“Bhadante”ti te bhikkhū bhagavato paccassosuṁ.", "claims": [], "eval": []}, {"id": "mn10:1.6", "en": "The Buddha said this:", "pi": "Bhagavā etadavoca:", "claims": [], "eval": []}, {"id": "mn10:2.1", "en": "“Mendicants, the four kinds of mindfulness meditation are the path to convergence. They are in order to purify sentient beings, to get past sorrow and crying, to make an end of pain and sadness, to discover the system, and to realize extinguishment.", "pi": "“Ekāyano ayaṁ, bhikkhave, maggo sattānaṁ visuddhiyā, sokaparidevānaṁ samatikkamāya, dukkhadomanassānaṁ atthaṅgamāya, ñāyassa adhigamāya, nibbānassa sacchikiriyāya, yadidaṁ cattāro satipaṭṭhānā.", "claims": [], "eval": []}, {"id": "mn10:3.1", "en": "What four?", "pi": "Katame cattāro?", "claims": [], "eval": []}, {"id": "mn10:3.2", "en": "It’s when a mendicant meditates by observing an aspect of the body—keen, aware, and mindful, rid of covetousness and displeasure for the world.", "pi": "Idha, bhikkhave, bhikkhu kāye kāyānupassī viharati ātāpī sampajāno satimā, vineyya loke abhijjhādomanassaṁ;", "claims": [], "eval": []}, {"id": "mn10:3.3", "en": "They meditate observing an aspect of feelings—keen, aware, and mindful, rid of covetousness and displeasure for the world.", "pi": "vedanāsu vedanānupassī viharati ātāpī sampajāno satimā, vineyya loke abhijjhādomanassaṁ;", "claims": [], "eval": []}, {"id": "mn10:3.4", "en": "They meditate observing an aspect of the mind—keen, aware, and mindful, rid of covetousness and displeasure for the world.", "pi": "citte cittānupassī viharati ātāpī sampajāno satimā, vineyya loke abhijjhādomanassaṁ;", "claims": [], "eval": []}, {"id": "mn10:3.5", "en": "They meditate observing an aspect of principles—keen, aware, and mindful, rid of covetousness and displeasure for the world.", "pi": "dhammesu dhammānupassī viharati ātāpī sampajāno satimā, vineyya loke abhijjhādomanassaṁ.", "claims": [], "eval": []}, {"id": "mn10:3.6", "en": "", "pi": "Uddeso niṭṭhito.", "claims": [], "eval": []}, {"id": "mn10:4.0.1", "en": "1. Observing the Body", "pi": "1. Kāyānupassanā", "claims": [], "eval": []}, {"id": "mn10:4.0.2", "en": "1.1. Mindfulness of Breathing", "pi": "1.1. Kāyānupassanāānāpānapabba", "claims": [], "eval": []}, {"id": "mn10:4.1", "en": "And how does a mendicant meditate observing an aspect of the body?", "pi": "Kathañca, bhikkhave, bhikkhu kāye kāyānupassī viharati?", "claims": [], "eval": []}, {"id": "mn10:4.2", "en": "It’s when a mendicant—gone to a wilderness, or to the root of a tree, or to an empty hut—sits down cross-legged, sets their body straight, and brings mindfulness to the present.", "pi": "Idha, bhikkhave, bhikkhu araññagato vā rukkhamūlagato vā suññāgāragato vā nisīdati, pallaṅkaṁ ābhujitvā, ujuṁ kāyaṁ paṇidhāya, parimukhaṁ satiṁ upaṭṭhapetvā.", "claims": [], "eval": []}, {"id": "mn10:4.3", "en": "Just mindful, they breathe in. Mindful, they breathe out.", "pi": "So satova assasati, satova passasati.", "claims": [], "eval": []}, {"id": "mn10:4.4", "en": "Breathing in heavily they know: ‘I’m breathing in heavily.’ Breathing out heavily they know: ‘I’m breathing out heavily.’", "pi": "Dīghaṁ vā assasanto ‘dīghaṁ assasāmī’ti pajānāti, dīghaṁ vā passasanto ‘dīghaṁ passasāmī’ti pajānāti,", "claims": [], "eval": []}, {"id": "mn10:4.5", "en": "Breathing in lightly they know: ‘I’m breathing in lightly.’ Breathing out lightly they know: ‘I’m breathing out lightly.’", "pi": "rassaṁ vā assasanto ‘rassaṁ assasāmī’ti pajānāti, rassaṁ vā passasanto ‘rassaṁ passasāmī’ti pajānāti.", "claims": [], "eval": []}, {"id": "mn10:4.6", "en": "They practice like this: ‘I’ll breathe in experiencing the whole body.’ They practice like this: ‘I’ll breathe out experiencing the whole body.’", "pi": "‘Sabbakāyapaṭisaṁvedī assasissāmī’ti sikkhati, ‘sabbakāyapaṭisaṁvedī passasissāmī’ti sikkhati.", "claims": [], "eval": []}, {"id": "mn10:4.7", "en": "They practice like this: ‘I’ll breathe in stilling the physical process.’ They practice like this: ‘I’ll breathe out stilling the physical process.’", "pi": "‘Passambhayaṁ kāyasaṅkhāraṁ assasissāmī’ti sikkhati, ‘passambhayaṁ kāyasaṅkhāraṁ passasissāmī’ti sikkhati.", "claims": [], "eval": []}, {"id": "mn10:4.8", "en": "It’s like a deft lathe-turner or lathe-turner’s apprentice. When drawing a long pull they know: ‘I’m drawing a long pull,’ and when drawing a short pull they know: ‘I’m drawing a short pull.’", "pi": "Seyyathāpi, bhikkhave, dakkho bhamakāro vā bhamakārantevāsī vā dīghaṁ vā añchanto ‘dīghaṁ añchāmī’ti pajānāti, rassaṁ vā añchanto ‘rassaṁ añchāmī’ti pajānāti;", "claims": [], "eval": []}, {"id": "mn10:4.9", "en": "", "pi": "evameva kho, bhikkhave, bhikkhu dīghaṁ vā assasanto ‘dīghaṁ assasāmī’ti pajānāti, dīghaṁ vā passasanto ‘dīghaṁ passasāmī’ti pajānāti, rassaṁ vā assasanto ‘rassaṁ assasāmī’ti pajānāti, rassaṁ vā passasanto ‘rassaṁ passasāmī’ti pajānāti;", "claims": [], "eval": []}, {"id": "mn10:4.10", "en": "", "pi": "‘sabbakāyapaṭisaṁvedī assasissāmī’ti sikkhati, ‘sabbakāyapaṭisaṁvedī passasissāmī’ti sikkhati;", "claims": [], "eval": []}, {"id": "mn10:4.11", "en": "", "pi": "‘passambhayaṁ kāyasaṅkhāraṁ assasissāmī’ti sikkhati, ‘passambhayaṁ kāyasaṅkhāraṁ passasissāmī’ti sikkhati.", "claims": [], "eval": []}, {"id": "mn10:5.1", "en": "And so they meditate observing an aspect of the body internally, externally, and both internally and externally.", "pi": "Iti ajjhattaṁ vā kāye kāyānupassī viharati, bahiddhā vā kāye kāyānupassī viharati, ajjhattabahiddhā vā kāye kāyānupassī viharati;", "claims": [], "eval": []}, {"id": "mn10:5.2", "en": "They meditate observing, with respect to the body, the liability to originate, to vanish, and to originate and vanish.", "pi": "samudayadhammānupassī vā kāyasmiṁ viharati, vayadhammānupassī vā kāyasmiṁ viharati, samudayavayadhammānupassī vā kāyasmiṁ viharati.", "claims": [], "eval": []}, {"id": "mn10:5.3", "en": "Or mindfulness is established that the body exists, to the extent necessary for knowledge and mindfulness. They meditate independent, not grasping at anything in the world.", "pi": "‘Atthi kāyo’ti vā panassa sati paccupaṭṭhitā hoti. Yāvadeva ñāṇamattāya paṭissatimattāya anissito ca viharati, na ca kiñci loke upādiyati.", "claims": [], "eval": []}, {"id": "mn10:5.4", "en": "That’s how a mendicant meditates by observing an aspect of the body.", "pi": "Evampi kho, bhikkhave, bhikkhu kāye kāyānupassī viharati.", "claims": [], "eval": []}, {"id": "mn10:5.5", "en": "", "pi": "Ānāpānapabbaṁ niṭṭhitaṁ.", "claims": [], "eval": []}, {"id": "mn10:6.0", "en": "1.2. The Postures", "pi": "1.2. Kāyānupassanāiriyāpathapabba", "claims": [], "eval": []}, {"id": "mn10:6.1", "en": "Furthermore, when a mendicant is walking they know: ‘I am walking.’ When standing they know: ‘I am standing.’ When sitting they know: ‘I am sitting.’ And when lying down they know: ‘I am lying down.’", "pi": "Puna caparaṁ, bhikkhave, bhikkhu gacchanto vā ‘gacchāmī’ti pajānāti, ṭhito vā ‘ṭhitomhī’ti pajānāti, nisinno vā ‘nisinnomhī’ti pajānāti, sayāno vā ‘sayānomhī’ti pajānāti.", "claims": [], "eval": []}, {"id": "mn10:6.2", "en": "Whatever posture their body is in, they know it.", "pi": "Yathā yathā vā panassa kāyo paṇihito hoti tathā tathā naṁ pajānāti.", "claims": [], "eval": []}, {"id": "mn10:7.1", "en": "And so they meditate observing an aspect of the body internally, externally, and both internally and externally.", "pi": "Iti ajjhattaṁ vā kāye kāyānupassī viharati, bahiddhā vā kāye kāyānupassī viharati, ajjhattabahiddhā vā kāye kāyānupassī viharati;", "claims": [], "eval": []}, {"id": "mn10:7.2", "en": "With respect to the body, they meditate observing the liability to originate, to vanish, and to originate and vanish.", "pi": "samudayadhammānupassī vā kāyasmiṁ viharati, vayadhammānupassī vā kāyasmiṁ viharati, samudayavayadhammānupassī vā kāyasmiṁ viharati.", "claims": [], "eval": []}, {"id": "mn10:7.3", "en": "Or mindfulness is established that the body exists, to the extent necessary for knowledge and mindfulness. They meditate independent, not grasping at anything in the world.", "pi": "‘Atthi kāyo’ti vā panassa sati paccupaṭṭhitā hoti. Yāvadeva ñāṇamattāya paṭissatimattāya anissito ca viharati, na ca kiñci loke upādiyati.", "claims": [], "eval": []}, {"id": "mn10:7.4", "en": "That too is how a mendicant meditates by observing an aspect of the body.", "pi": "Evampi kho, bhikkhave, bhikkhu kāye kāyānupassī viharati.", "claims": [], "eval": []}, {"id": "mn10:7.5", "en": "", "pi": "Iriyāpathapabbaṁ niṭṭhitaṁ.", "claims": [], "eval": []}, {"id": "mn10:8.0", "en": "1.3. Situational Awareness", "pi": "1.3. Kāyānupassanāsampajānapabba", "claims": [], "eval": []}, {"id": "mn10:8.1", "en": "Furthermore, a mendicant acts with situational awareness when going out and coming back; when looking ahead and aside; when bending and extending the limbs; when bearing the outer robe, bowl and robes; when eating, drinking, chewing, and tasting; when urinating and defecating; when walking, standing, sitting, sleeping, waking, speaking, and keeping silent.", "pi": "Puna caparaṁ, bhikkhave, bhikkhu abhikkante paṭikkante sampajānakārī hoti, ālokite vilokite sampajānakārī hoti, samiñjite pasārite sampajānakārī hoti, saṅghāṭipattacīvaradhāraṇe sampajānakārī hoti, asite pīte khāyite sāyite sampajānakārī hoti, uccārapassāvakamme sampajānakārī hoti, gate ṭhite nisinne sutte jāgarite bhāsite tuṇhībhāve sampajānakārī hoti.", "claims": [], "eval": []}, {"id": "mn10:9.1", "en": "And so they meditate observing an aspect of the body internally …", "pi": "Iti ajjhattaṁ vā kāye kāyānupassī viharati …pe…", "claims": [], "eval": []}, {"id": "mn10:9.2", "en": "That too is how a mendicant meditates by observing an aspect of the body.", "pi": "evampi kho, bhikkhave, bhikkhu kāye kāyānupassī viharati.", "claims": [], "eval": []}, {"id": "mn10:9.3", "en": "", "pi": "Sampajānapabbaṁ niṭṭhitaṁ.", "claims": [], "eval": []}, {"id": "mn10:10.0", "en": "1.4. Focusing on the Repulsive", "pi": "1.4. Kāyānupassanāpaṭikūlamanasikārapabba", "claims": [], "eval": []}, {"id": "mn10:10.1", "en": "Furthermore, a mendicant examines their own body, up from the soles of the feet and down from the tips of the hairs, wrapped in skin and full of many kinds of filth.", "pi": "Puna caparaṁ, bhikkhave, bhikkhu imameva kāyaṁ uddhaṁ pādatalā, adho kesamatthakā, tacapariyantaṁ pūraṁ nānappakārassa asucino paccavekkhati:", "claims": [], "eval": []}, {"id": "mn10:10.2", "en": "‘In this body there is head hair, body hair, nails, teeth, skin, flesh, sinews, bones, bone marrow, kidneys, heart, liver, diaphragm, spleen, lungs, intestines, mesentery, undigested food, feces, bile, phlegm, pus, blood, sweat, fat, tears, grease, saliva, snot, synovial fluid, urine.’", "pi": "‘atthi imasmiṁ kāye kesā lomā nakhā dantā taco maṁsaṁ nhāru aṭṭhi aṭṭhimiñjaṁ vakkaṁ hadayaṁ yakanaṁ kilomakaṁ pihakaṁ papphāsaṁ antaṁ antaguṇaṁ udariyaṁ karīsaṁ pittaṁ semhaṁ pubbo lohitaṁ sedo medo assu vasā kheḷo siṅghāṇikā lasikā muttan’ti.", "claims": [], "eval": []}, {"id": "mn10:10.3", "en": "It’s as if there were a bag with openings at both ends, filled with various kinds of grains, such as fine rice, wheat, mung beans, peas, sesame, and ordinary rice. And a person with clear eyes were to open it and examine the contents: ‘These grains are fine rice, these are wheat, these are mung beans, these are peas, these are sesame, and these are ordinary rice.’", "pi": "Seyyathāpi, bhikkhave, ubhatomukhā putoḷi pūrā nānāvihitassa dhaññassa, seyyathidaṁ—sālīnaṁ vīhīnaṁ muggānaṁ māsānaṁ tilānaṁ taṇḍulānaṁ. Tamenaṁ cakkhumā puriso muñcitvā paccavekkheyya: ‘ime sālī ime vīhī ime muggā ime māsā ime tilā ime taṇḍulā’ti.", "claims": [], "eval": []}, {"id": "mn10:10.4", "en": "", "pi": "Evameva kho, bhikkhave, bhikkhu imameva kāyaṁ uddhaṁ pādatalā, adho kesamatthakā, tacapariyantaṁ pūraṁ nānappakārassa asucino paccavekkhati:", "claims": [], "eval": []}, {"id": "mn10:10.5", "en": "", "pi": "‘atthi imasmiṁ kāye kesā lomā …pe… muttan’ti.", "claims": [], "eval": []}, {"id": "mn10:11.1", "en": "And so they meditate observing an aspect of the body internally …", "pi": "Iti ajjhattaṁ vā kāye kāyānupassī viharati …pe…", "claims": [], "eval": []}, {"id": "mn10:11.2", "en": "That too is how a mendicant meditates by observing an aspect of the body.", "pi": "evampi kho, bhikkhave, bhikkhu kāye kāyānupassī viharati.", "claims": [], "eval": []}, {"id": "mn10:11.3", "en": "", "pi": "Paṭikūlamanasikārapabbaṁ niṭṭhitaṁ.", "claims": [], "eval": []}, {"id": "mn10:12.0", "en": "1.5. Focusing on the Elements", "pi": "1.5. Kāyānupassanādhātumanasikārapabba", "claims": [], "eval": []}, {"id": "mn10:12.1", "en": "Furthermore, a mendicant examines their own body, whatever its placement or posture, according to the elements:", "pi": "Puna caparaṁ, bhikkhave, bhikkhu imameva kāyaṁ yathāṭhitaṁ yathāpaṇihitaṁ dhātuso paccavekkhati:", "claims": [], "eval": []}, {"id": "mn10:12.2", "en": "‘In this body there is the earth element, the water element, the fire element, and the air element.’", "pi": "‘atthi imasmiṁ kāye pathavīdhātu āpodhātu tejodhātu vāyodhātū’ti.", "claims": [], "eval": []}, {"id": "mn10:12.3", "en": "It’s as if a deft butcher or butcher’s apprentice were to kill a cow and sit down at the crossroads with the meat cut into chops.", "pi": "Seyyathāpi, bhikkhave, dakkho goghātako vā goghātakantevāsī vā gāviṁ vadhitvā catumahāpathe bilaso vibhajitvā nisinno assa.", "claims": [], "eval": []}, {"id": "mn10:12.4", "en": "", "pi": "Evameva kho, bhikkhave, bhikkhu imameva kāyaṁ yathāṭhitaṁ yathāpaṇihitaṁ dhātuso paccavekkhati:", "claims": [], "eval": []}, {"id": "mn10:12.5", "en": "", "pi": "‘atthi imasmiṁ kāye pathavīdhātu āpodhātu tejodhātu vāyodhātū’ti.", "claims": [], "eval": []}, {"id": "mn10:13.1", "en": "And so they meditate observing an aspect of the body internally …", "pi": "Iti ajjhattaṁ vā kāye kāyānupassī viharati …pe…", "claims": [], "eval": []}, {"id": "mn10:13.2", "en": "That too is how a mendicant meditates by observing an aspect of the body.", "pi": "evampi kho, bhikkhave, bhikkhu kāye kāyānupassī viharati.", "claims": [], "eval": []}, {"id": "mn10:13.3", "en": "", "pi": "Dhātumanasikārapabbaṁ niṭṭhitaṁ.", "claims": [], "eval": []}, {"id": "mn10:14.0", "en": "1.6. The Charnel Ground Contemplations", "pi": "1.6. Kāyānupassanānavasivathikapabba", "claims": [], "eval": []}, {"id": "mn10:14.1", "en": "Furthermore, suppose a mendicant were to see a corpse discarded in a charnel ground. And it had been dead for one, two, or three days, bloated, livid, and festering.", "pi": "Puna caparaṁ, bhikkhave, bhikkhu seyyathāpi passeyya sarīraṁ sivathikāya chaḍḍitaṁ ekāhamataṁ vā dvīhamataṁ vā tīhamataṁ vā uddhumātakaṁ vinīlakaṁ vipubbakajātaṁ.", "claims": [], "eval": []}, {"id": "mn10:14.2", "en": "They’d compare it with their own body:", "pi": "So imameva kāyaṁ upasaṁharati:", "claims": [], "eval": []}, {"id": "mn10:14.3", "en": "‘This body is also of that same nature, that same kind, and cannot go beyond that.’", "pi": "‘ayampi kho kāyo evaṁdhammo evaṁbhāvī evaṁanatīto’ti.", "claims": [], "eval": []}, {"id": "mn10:15.1", "en": "And so they meditate observing an aspect of the body internally …", "pi": "Iti ajjhattaṁ vā kāye kāyānupassī viharati …pe…", "claims": [], "eval": []}, {"id": "mn10:15.2", "en": "That too is how a mendicant meditates by observing an aspect of the body.", "pi": "evampi kho, bhikkhave, bhikkhu kāye kāyānupassī viharati.", "claims": [], "eval": []}, {"id": "mn10:16.1", "en": "Furthermore, suppose they were to see a corpse discarded in a charnel ground being devoured by crows, hawks, vultures, herons, hounds, tigers, leopards, jackals, and many kinds of little creatures.", "pi": "Puna caparaṁ, bhikkhave, bhikkhu seyyathāpi passeyya sarīraṁ sivathikāya chaḍḍitaṁ kākehi vā khajjamānaṁ kulalehi vā khajjamānaṁ gijjhehi vā khajjamānaṁ kaṅkehi vā khajjamānaṁ sunakhehi vā khajjamānaṁ byagghehi vā khajjamānaṁ dīpīhi vā khajjamānaṁ siṅgālehi vā khajjamānaṁ vividhehi vā pāṇakajātehi khajjamānaṁ.", "claims": [], "eval": []}, {"id": "mn10:16.2", "en": "They’d compare it with their own body:", "pi": "So imameva kāyaṁ upasaṁharati:", "claims": [], "eval": []}, {"id": "mn10:16.3", "en": "‘This body is also of that same nature, that same kind, and cannot go beyond that.’", "pi": "‘ayampi kho kāyo evaṁdhammo evaṁbhāvī evaṁanatīto’ti.", "claims": [], "eval": []}, {"id": "mn10:17.1", "en": "And so they meditate observing an aspect of the body internally …", "pi": "Iti ajjhattaṁ vā kāye kāyānupassī viharati …pe…", "claims": [], "eval": []}, {"id": "mn10:17.2", "en": "That too is how a mendicant meditates by observing an aspect of the body.", "pi": "evampi kho, bhikkhave, bhikkhu kāye kāyānupassī viharati.", "claims": [], "eval": []}, {"id": "mn10:18-23.1", "en": "Furthermore, suppose they were to see a corpse discarded in a charnel ground, a skeleton with flesh and blood, held together by sinews …", "pi": "Puna caparaṁ, bhikkhave, bhikkhu seyyathāpi passeyya sarīraṁ sivathikāya chaḍḍitaṁ aṭṭhikasaṅkhalikaṁ samaṁsalohitaṁ nhārusambandhaṁ …pe…", "claims": [], "eval": []}, {"id": "mn10:18-23.2", "en": "A skeleton without flesh but smeared with blood, and held together by sinews …", "pi": "Aṭṭhikasaṅkhalikaṁ nimaṁsalohitamakkhitaṁ nhārusambandhaṁ …pe…", "claims": [], "eval": []}, {"id": "mn10:18-23.3", "en": "A skeleton rid of flesh and blood, held together by sinews …", "pi": "Aṭṭhikasaṅkhalikaṁ apagatamaṁsalohitaṁ nhārusambandhaṁ …pe…", "claims": [], "eval": []}, {"id": "mn10:24.1", "en": "Bones rid of sinews scattered in every direction. Here a hand-bone, there a foot-bone, here an ankle bone, there a shin-bone, here a thigh-bone, there a hip-bone, here a rib-bone, there a back-bone, here an arm-bone, there a neck-bone, here a jaw-bone, there a tooth, here the skull. …", "pi": "Aṭṭhikāni apagatasambandhāni disā vidisā vikkhittāni, aññena hatthaṭṭhikaṁ aññena pādaṭṭhikaṁ aññena gopphakaṭṭhikaṁ aññena jaṅghaṭṭhikaṁ aññena ūruṭṭhikaṁ aññena kaṭiṭṭhikaṁ aññena phāsukaṭṭhikaṁ aññena piṭṭhiṭṭhikaṁ aññena khandhaṭṭhikaṁ aññena gīvaṭṭhikaṁ aññena hanukaṭṭhikaṁ aññena dantaṭṭhikaṁ aññena sīsakaṭāhaṁ.", "claims": [], "eval": []}, {"id": "mn10:24.2", "en": "", "pi": "So imameva kāyaṁ upasaṁharati:", "claims": [], "eval": []}, {"id": "mn10:24.3", "en": "", "pi": "‘ayampi kho kāyo evaṁdhammo evaṁbhāvī evaṁanatīto’ti.", "claims": [], "eval": []}, {"id": "mn10:25.1", "en": "", "pi": "Iti ajjhattaṁ vā kāye kāyānupassī viharati …pe…", "claims": [], "eval": []}, {"id": "mn10:25.2", "en": "", "pi": "evampi kho, bhikkhave, bhikkhu kāye kāyānupassī viharati.", "claims": [], "eval": []}, {"id": "mn10:26-28.1", "en": "White bones, the color of shells …", "pi": "Puna caparaṁ, bhikkhave, bhikkhu seyyathāpi passeyya sarīraṁ sivathikāya chaḍḍitaṁ, aṭṭhikāni setāni saṅkhavaṇṇapaṭibhāgāni …pe…", "claims": [], "eval": []}, {"id": "mn10:29.1", "en": "Decrepit bones, heaped in a pile …", "pi": "Aṭṭhikāni puñjakitāni terovassikāni …pe…", "claims": [], "eval": []}, {"id": "mn10:30.1", "en": "Bones rotted and crumbled to powder.", "pi": "Aṭṭhikāni pūtīni cuṇṇakajātāni.", "claims": [], "eval": []}, {"id": "mn10:30.2", "en": "They’d compare it with their own body:", "pi": "So imameva kāyaṁ upasaṁharati:", "claims": [], "eval": []}, {"id": "mn10:30.3", "en": "‘This body is also of that same nature, that same kind, and cannot go beyond that.’", "pi": "‘ayampi kho kāyo evaṁdhammo evaṁbhāvī evaṁanatīto’ti.", "claims": [], "eval": []}, {"id": "mn10:31.1", "en": "And so they meditate observing an aspect of the body internally, externally, and both internally and externally.", "pi": "Iti ajjhattaṁ vā kāye kāyānupassī viharati, bahiddhā vā kāye kāyānupassī viharati, ajjhattabahiddhā vā kāye kāyānupassī viharati;", "claims": [], "eval": []}, {"id": "mn10:31.2", "en": "With respect to the body, they meditate observing the liability to originate, to vanish, and to originate and vanish.", "pi": "samudayadhammānupassī vā kāyasmiṁ viharati, vayadhammānupassī vā kāyasmiṁ viharati, samudayavayadhammānupassī vā kāyasmiṁ viharati.", "claims": [], "eval": []}, {"id": "mn10:31.3", "en": "Or mindfulness is established that the body exists, to the extent necessary for knowledge and mindfulness. They meditate independent, not grasping at anything in the world.", "pi": "‘Atthi kāyo’ti vā panassa sati paccupaṭṭhitā hoti. Yāvadeva ñāṇamattāya paṭissatimattāya anissito ca viharati, na ca kiñci loke upādiyati.", "claims": [], "eval": []}, {"id": "mn10:31.4", "en": "That too is how a mendicant meditates by observing an aspect of the body.", "pi": "Evampi kho, bhikkhave, bhikkhu kāye kāyānupassī viharati.", "claims": [], "eval": []}, {"id": "mn10:31.5", "en": "", "pi": "Navasivathikapabbaṁ niṭṭhitaṁ.", "claims": [], "eval": []}, {"id": "mn10:31.6", "en": "", "pi": "Cuddasakāyānupassanā niṭṭhitā.", "claims": [], "eval": []}, {"id": "mn10:32.0", "en": "2. Observing the Feelings", "pi": "2. Vedanānupassanā", "claims": [], "eval": []}, {"id": "mn10:32.1", "en": "And how does a mendicant meditate observing an aspect of feelings?", "pi": "Kathañca, bhikkhave, bhikkhu vedanāsu vedanānupassī viharati?", "claims": [], "eval": []}, {"id": "mn10:32.2", "en": "It’s when a mendicant who feels a pleasant feeling knows: ‘I feel a pleasant feeling.’", "pi": "Idha, bhikkhave, bhikkhu sukhaṁ vā vedanaṁ vedayamāno ‘sukhaṁ vedanaṁ vedayāmī’ti pajānāti.", "claims": [], "eval": []}, {"id": "mn10:32.3", "en": "When they feel a painful feeling, they know: ‘I feel a painful feeling.’", "pi": "Dukkhaṁ vā vedanaṁ vedayamāno ‘dukkhaṁ vedanaṁ vedayāmī’ti pajānāti.", "claims": [], "eval": []}, {"id": "mn10:32.4", "en": "When they feel a neutral feeling, they know: ‘I feel a neutral feeling.’", "pi": "Adukkhamasukhaṁ vā vedanaṁ vedayamāno ‘adukkhamasukhaṁ vedanaṁ vedayāmī’ti pajānāti.", "claims": [], "eval": []}, {"id": "mn10:32.5", "en": "When they feel a pleasant feeling of the flesh, they know: ‘I feel a pleasant feeling of the flesh.’", "pi": "Sāmisaṁ vā sukhaṁ vedanaṁ vedayamāno ‘sāmisaṁ sukhaṁ vedanaṁ vedayāmī’ti pajānāti.", "claims": [], "eval": []}, {"id": "mn10:32.6", "en": "When they feel a pleasant feeling not of the flesh, they know: ‘I feel a pleasant feeling not of the flesh.’", "pi": "Nirāmisaṁ vā sukhaṁ vedanaṁ vedayamāno ‘nirāmisaṁ sukhaṁ vedanaṁ vedayāmī’ti pajānāti.", "claims": [], "eval": []}, {"id": "mn10:32.7", "en": "When they feel a painful feeling of the flesh, they know: ‘I feel a painful feeling of the flesh.’", "pi": "Sāmisaṁ vā dukkhaṁ vedanaṁ vedayamāno ‘sāmisaṁ dukkhaṁ vedanaṁ vedayāmī’ti pajānāti.", "claims": [], "eval": []}, {"id": "mn10:32.8", "en": "When they feel a painful feeling not of the flesh, they know: ‘I feel a painful feeling not of the flesh.’", "pi": "Nirāmisaṁ vā dukkhaṁ vedanaṁ vedayamāno ‘nirāmisaṁ dukkhaṁ vedanaṁ vedayāmī’ti pajānāti.", "claims": [], "eval": []}, {"id": "mn10:32.9", "en": "When they feel a neutral feeling of the flesh, they know: ‘I feel a neutral feeling of the flesh.’", "pi": "Sāmisaṁ vā adukkhamasukhaṁ vedanaṁ vedayamāno ‘sāmisaṁ adukkhamasukhaṁ vedanaṁ vedayāmī’ti pajānāti.", "claims": [], "eval": []}, {"id": "mn10:32.10", "en": "When they feel a neutral feeling not of the flesh, they know: ‘I feel a neutral feeling not of the flesh.’", "pi": "Nirāmisaṁ vā adukkhamasukhaṁ vedanaṁ vedayamāno ‘nirāmisaṁ adukkhamasukhaṁ vedanaṁ vedayāmī’ti pajānāti.", "claims": [], "eval": []}, {"id": "mn10:33.1", "en": "And so they meditate observing an aspect of feelings internally, externally, and both internally and externally.", "pi": "Iti ajjhattaṁ vā vedanāsu vedanānupassī viharati, bahiddhā vā vedanāsu vedanānupassī viharati, ajjhattabahiddhā vā vedanāsu vedanānupassī viharati;", "claims": [], "eval": []}, {"id": "mn10:33.2", "en": "With respect to feelings, they meditate observing the liability to originate, to vanish, and to originate and vanish.", "pi": "samudayadhammānupassī vā vedanāsu viharati, vayadhammānupassī vā vedanāsu viharati, samudayavayadhammānupassī vā vedanāsu viharati.", "claims": [], "eval": []}, {"id": "mn10:33.3", "en": "Or mindfulness is established that feelings exist, to the extent necessary for knowledge and mindfulness. They meditate independent, not grasping at anything in the world.", "pi": "‘Atthi vedanā’ti vā panassa sati paccupaṭṭhitā hoti. Yāvadeva ñāṇamattāya paṭissatimattāya anissito ca viharati, na ca kiñci loke upādiyati.", "claims": [], "eval": []}, {"id": "mn10:33.4", "en": "That’s how a mendicant meditates by observing an aspect of feelings.", "pi": "Evampi kho, bhikkhave, bhikkhu vedanāsu vedanānupassī viharati.", "claims": [], "eval": []}, {"id": "mn10:33.5", "en": "", "pi": "Vedanānupassanā niṭṭhitā.", "claims": [], "eval": []}, {"id": "mn10:34.0", "en": "3. Observing the Mind", "pi": "3. Cittānupassanā", "claims": [], "eval": []}, {"id": "mn10:34.1", "en": "And how does a mendicant meditate observing an aspect of the mind?", "pi": "Kathañca, bhikkhave, bhikkhu citte cittānupassī viharati?", "claims": [], "eval": []}, {"id": "mn10:34.2", "en": "It’s when a mendicant understands mind with greed as ‘mind with greed,’", "pi": "Idha, bhikkhave, bhikkhu sarāgaṁ vā cittaṁ ‘sarāgaṁ cittan’ti pajānāti.", "claims": [], "eval": []}, {"id": "mn10:34.3", "en": "and mind without greed as ‘mind without greed.’", "pi": "Vītarāgaṁ vā cittaṁ ‘vītarāgaṁ cittan’ti pajānāti.", "claims": [], "eval": []}, {"id": "mn10:34.4", "en": "They understand mind with hate as ‘mind with hate,’", "pi": "Sadosaṁ vā cittaṁ ‘sadosaṁ cittan’ti pajānāti.", "claims": [], "eval": []}, {"id": "mn10:34.5", "en": "and mind without hate as ‘mind without hate.’", "pi": "Vītadosaṁ vā cittaṁ ‘vītadosaṁ cittan’ti pajānāti.", "claims": [], "eval": []}, {"id": "mn10:34.6", "en": "They understand mind with delusion as ‘mind with delusion,’", "pi": "Samohaṁ vā cittaṁ ‘samohaṁ cittan’ti pajānāti.", "claims": [], "eval": []}, {"id": "mn10:34.7", "en": "and mind without delusion as ‘mind without delusion.’", "pi": "Vītamohaṁ vā cittaṁ ‘vītamohaṁ cittan’ti pajānāti.", "claims": [], "eval": []}, {"id": "mn10:34.8", "en": "They know constricted mind as ‘constricted mind,’", "pi": "Saṅkhittaṁ vā cittaṁ ‘saṅkhittaṁ cittan’ti pajānāti.", "claims": [], "eval": []}, {"id": "mn10:34.9", "en": "and scattered mind as ‘scattered mind.’", "pi": "Vikkhittaṁ vā cittaṁ ‘vikkhittaṁ cittan’ti pajānāti.", "claims": [], "eval": []}, {"id": "mn10:34.10", "en": "They know expansive mind as ‘expansive mind,’", "pi": "Mahaggataṁ vā cittaṁ ‘mahaggataṁ cittan’ti pajānāti.", "claims": [], "eval": []}, {"id": "mn10:34.11", "en": "and unexpansive mind as ‘unexpansive mind.’", "pi": "Amahaggataṁ vā cittaṁ ‘amahaggataṁ cittan’ti pajānāti.", "claims": [], "eval": []}, {"id": "mn10:34.12", "en": "They know mind that is not supreme as ‘mind that is not supreme,’", "pi": "Sauttaraṁ vā cittaṁ ‘sauttaraṁ cittan’ti pajānāti.", "claims": [], "eval": []}, {"id": "mn10:34.13", "en": "and mind that is supreme as ‘mind that is supreme.’", "pi": "Anuttaraṁ vā cittaṁ ‘anuttaraṁ cittan’ti pajānāti.", "claims": [], "eval": []}, {"id": "mn10:34.14", "en": "They know mind immersed in samādhi as ‘mind immersed in samādhi,’", "pi": "Samāhitaṁ vā cittaṁ ‘samāhitaṁ cittan’ti pajānāti.", "claims": [], "eval": []}, {"id": "mn10:34.15", "en": "and mind not immersed in samādhi as ‘mind not immersed in samādhi.’", "pi": "Asamāhitaṁ vā cittaṁ ‘asamāhitaṁ cittan’ti pajānāti.", "claims": [], "eval": []}, {"id": "mn10:34.16", "en": "They know freed mind as ‘freed mind,’", "pi": "Vimuttaṁ vā cittaṁ ‘vimuttaṁ cittan’ti pajānāti.", "claims": [], "eval": []}, {"id": "mn10:34.17", "en": "and unfreed mind as ‘unfreed mind.’", "pi": "Avimuttaṁ vā cittaṁ ‘avimuttaṁ cittan’ti pajānāti.", "claims": [], "eval": []}, {"id": "mn10:35.1", "en": "And so they meditate observing an aspect of the mind internally, externally, and both internally and externally.", "pi": "Iti ajjhattaṁ vā citte cittānupassī viharati, bahiddhā vā citte cittānupassī viharati, ajjhattabahiddhā vā citte cittānupassī viharati;", "claims": [], "eval": []}, {"id": "mn10:35.2", "en": "With respect to the mind, they meditate observing the liability to originate, to vanish, and to originate and vanish.", "pi": "samudayadhammānupassī vā cittasmiṁ viharati, vayadhammānupassī vā cittasmiṁ viharati, samudayavayadhammānupassī vā cittasmiṁ viharati.", "claims": [], "eval": []}, {"id": "mn10:35.3", "en": "Or mindfulness is established that the mind exists, to the extent necessary for knowledge and mindfulness. They meditate independent, not grasping at anything in the world.", "pi": "‘Atthi cittan’ti vā panassa sati paccupaṭṭhitā hoti. Yāvadeva ñāṇamattāya paṭissatimattāya anissito ca viharati, na ca kiñci loke upādiyati.", "claims": [], "eval": []}, {"id": "mn10:35.4", "en": "That’s how a mendicant meditates by observing an aspect of the mind.", "pi": "Evampi kho, bhikkhave, bhikkhu citte cittānupassī viharati.", "claims": [], "eval": []}, {"id": "mn10:35.5", "en": "", "pi": "Cittānupassanā niṭṭhitā.", "claims": [], "eval": []}, {"id": "mn10:36.0.1", "en": "4. Observing Principles", "pi": "4. Dhammānupassanā", "claims": [], "eval": []}, {"id": "mn10:36.0.2", "en": "4.1. The Hindrances", "pi": "4.1. Dhammānupassanānīvaraṇapabba", "claims": [], "eval": []}, {"id": "mn10:36.1", "en": "And how does a mendicant meditate observing an aspect of principles?", "pi": "Kathañca, bhikkhave, bhikkhu dhammesu dhammānupassī viharati?", "claims": [], "eval": []}, {"id": "mn10:36.2", "en": "It’s when a mendicant meditates by observing an aspect of principles with respect to the five hindrances.", "pi": "Idha, bhikkhave, bhikkhu dhammesu dhammānupassī viharati pañcasu nīvaraṇesu.", "claims": [{"kind": "contested", "layer": "editor", "text": "contested use of 'dhamma', left unassigned (rendered 'principles (Sujato)')"}], "eval": ["Q29"]}, {"id": "mn10:36.3", "en": "And how does a mendicant meditate observing an aspect of principles with respect to the five hindrances?", "pi": "Kathañca pana, bhikkhave, bhikkhu dhammesu dhammānupassī viharati pañcasu nīvaraṇesu?", "claims": [], "eval": []}, {"id": "mn10:36.4", "en": "It’s when a mendicant who has sensual desire in them understands: ‘I have sensual desire in me.’ When they don’t have sensual desire in them, they understand: ‘I don’t have sensual desire in me.’ They understand how sensual desire arises; how, when it’s already arisen, it’s given up; and how, once it’s given up, it doesn’t arise again in the future.", "pi": "Idha, bhikkhave, bhikkhu santaṁ vā ajjhattaṁ kāmacchandaṁ ‘atthi me ajjhattaṁ kāmacchando’ti pajānāti, asantaṁ vā ajjhattaṁ kāmacchandaṁ ‘natthi me ajjhattaṁ kāmacchando’ti pajānāti; yathā ca anuppannassa kāmacchandassa uppādo hoti tañca pajānāti, yathā ca uppannassa kāmacchandassa pahānaṁ hoti tañca pajānāti, yathā ca pahīnassa kāmacchandassa āyatiṁ anuppādo hoti tañca pajānāti.", "claims": [], "eval": []}, {"id": "mn10:36.5", "en": "When they have ill will in them, they understand: ‘I have ill will in me.’ When they don’t have ill will in them, they understand: ‘I don’t have ill will in me.’ They understand how ill will arises; how, when it’s already arisen, it’s given up; and how, once it’s given up, it doesn’t arise again in the future.", "pi": "Santaṁ vā ajjhattaṁ byāpādaṁ ‘atthi me ajjhattaṁ byāpādo’ti pajānāti, asantaṁ vā ajjhattaṁ byāpādaṁ ‘natthi me ajjhattaṁ byāpādo’ti pajānāti; yathā ca anuppannassa byāpādassa uppādo hoti tañca pajānāti, yathā ca uppannassa byāpādassa pahānaṁ hoti tañca pajānāti, yathā ca pahīnassa byāpādassa āyatiṁ anuppādo hoti tañca pajānāti.", "claims": [], "eval": []}, {"id": "mn10:36.6", "en": "When they have dullness and drowsiness in them, they understand: ‘I have dullness and drowsiness in me.’ When they don’t have dullness and drowsiness in them, they understand: ‘I don’t have dullness and drowsiness in me.’ They understand how dullness and drowsiness arise; how, when they’ve already arisen, they’re given up; and how, once they’re given up, they don’t arise again in the future.", "pi": "Santaṁ vā ajjhattaṁ thinamiddhaṁ ‘atthi me ajjhattaṁ thinamiddhan’ti pajānāti, asantaṁ vā ajjhattaṁ thinamiddhaṁ ‘natthi me ajjhattaṁ thinamiddhan’ti pajānāti, yathā ca anuppannassa thinamiddhassa uppādo hoti tañca pajānāti, yathā ca uppannassa thinamiddhassa pahānaṁ hoti tañca pajānāti, yathā ca pahīnassa thinamiddhassa āyatiṁ anuppādo hoti tañca pajānāti.", "claims": [], "eval": []}, {"id": "mn10:36.7", "en": "When they have restlessness and remorse in them, they understand: ‘I have restlessness and remorse in me.’ When they don’t have restlessness and remorse in them, they understand: ‘I don’t have restlessness and remorse in me.’ They understand how restlessness and remorse arise; how, when they’ve already arisen, they’re given up; and how, once they’re given up, they don’t arise again in the future.", "pi": "Santaṁ vā ajjhattaṁ uddhaccakukkuccaṁ ‘atthi me ajjhattaṁ uddhaccakukkuccan’ti pajānāti, asantaṁ vā ajjhattaṁ uddhaccakukkuccaṁ ‘natthi me ajjhattaṁ uddhaccakukkuccan’ti pajānāti; yathā ca anuppannassa uddhaccakukkuccassa uppādo hoti tañca pajānāti, yathā ca uppannassa uddhaccakukkuccassa pahānaṁ hoti tañca pajānāti, yathā ca pahīnassa uddhaccakukkuccassa āyatiṁ anuppādo hoti tañca pajānāti.", "claims": [], "eval": []}, {"id": "mn10:36.8", "en": "When they have doubt in them, they understand: ‘I have doubt in me.’ When they don’t have doubt in them, they understand: ‘I don’t have doubt in me.’ They understand how doubt arises; how, when it’s already arisen, it’s given up; and how, once it’s given up, it doesn’t arise again in the future.", "pi": "Santaṁ vā ajjhattaṁ vicikicchaṁ ‘atthi me ajjhattaṁ vicikicchā’ti pajānāti, asantaṁ vā ajjhattaṁ vicikicchaṁ ‘natthi me ajjhattaṁ vicikicchā’ti pajānāti; yathā ca anuppannāya vicikicchāya uppādo hoti tañca pajānāti, yathā ca uppannāya vicikicchāya pahānaṁ hoti tañca pajānāti, yathā ca pahīnāya vicikicchāya āyatiṁ anuppādo hoti tañca pajānāti.", "claims": [], "eval": []}, {"id": "mn10:37.1", "en": "And so they meditate observing an aspect of principles internally, externally, and both internally and externally.", "pi": "Iti ajjhattaṁ vā dhammesu dhammānupassī viharati, bahiddhā vā dhammesu dhammānupassī viharati, ajjhattabahiddhā vā dhammesu dhammānupassī viharati;", "claims": [], "eval": []}, {"id": "mn10:37.2", "en": "They meditate observing, with respect to the principles, the liability to originate, to vanish, and to originate and vanish.", "pi": "samudayadhammānupassī vā dhammesu viharati, vayadhammānupassī vā dhammesu viharati, samudayavayadhammānupassī vā dhammesu viharati.", "claims": [], "eval": []}, {"id": "mn10:37.3", "en": "Or mindfulness is established that principles exist, to the extent necessary for knowledge and mindfulness. They meditate independent, not grasping at anything in the world.", "pi": "‘Atthi dhammā’ti vā panassa sati paccupaṭṭhitā hoti. Yāvadeva ñāṇamattāya paṭissatimattāya anissito ca viharati, na ca kiñci loke upādiyati.", "claims": [], "eval": []}, {"id": "mn10:37.4", "en": "That’s how a mendicant meditates by observing an aspect of principles with respect to the five hindrances.", "pi": "Evampi kho, bhikkhave, bhikkhu dhammesu dhammānupassī viharati pañcasu nīvaraṇesu.", "claims": [], "eval": []}, {"id": "mn10:37.5", "en": "", "pi": "Nīvaraṇapabbaṁ niṭṭhitaṁ.", "claims": [], "eval": []}, {"id": "mn10:38.0", "en": "4.2. The Aggregates", "pi": "4.2. Dhammānupassanākhandhapabba", "claims": [], "eval": []}, {"id": "mn10:38.1", "en": "Furthermore, a mendicant meditates by observing an aspect of principles with respect to the five grasping aggregates.", "pi": "Puna caparaṁ, bhikkhave, bhikkhu dhammesu dhammānupassī viharati pañcasu upādānakkhandhesu.", "claims": [], "eval": []}, {"id": "mn10:38.2", "en": "And how does a mendicant meditate observing an aspect of principles with respect to the five grasping aggregates?", "pi": "Kathañca pana, bhikkhave, bhikkhu dhammesu dhammānupassī viharati pañcasu upādānakkhandhesu?", "claims": [], "eval": []}, {"id": "mn10:38.3", "en": "It’s when a mendicant contemplates:", "pi": "Idha, bhikkhave, bhikkhu:", "claims": [], "eval": []}, {"id": "mn10:38.4", "en": "‘Such is form, such is the origin of form, such is the disappearance of form.", "pi": "‘iti rūpaṁ, iti rūpassa samudayo, iti rūpassa atthaṅgamo;", "claims": [], "eval": []}, {"id": "mn10:38.5", "en": "Such is feeling, such is the origin of feeling, such is the disappearance of feeling.", "pi": "iti vedanā, iti vedanāya samudayo, iti vedanāya atthaṅgamo;", "claims": [], "eval": []}, {"id": "mn10:38.6", "en": "Such is perception, such is the origin of perception, such is the disappearance of perception.", "pi": "iti saññā, iti saññāya samudayo, iti saññāya atthaṅgamo;", "claims": [], "eval": []}, {"id": "mn10:38.7", "en": "Such are choices, such is the origin of choices, such is the disappearance of choices.", "pi": "iti saṅkhārā, iti saṅkhārānaṁ samudayo, iti saṅkhārānaṁ atthaṅgamo;", "claims": [], "eval": []}, {"id": "mn10:38.8", "en": "Such is consciousness, such is the origin of consciousness, such is the disappearance of consciousness.’", "pi": "iti viññāṇaṁ, iti viññāṇassa samudayo, iti viññāṇassa atthaṅgamo’ti;", "claims": [], "eval": []}, {"id": "mn10:39.1", "en": "And so they meditate observing an aspect of principles internally …", "pi": "iti ajjhattaṁ vā dhammesu dhammānupassī viharati, bahiddhā vā dhammesu dhammānupassī viharati, ajjhattabahiddhā vā dhammesu dhammānupassī viharati;", "claims": [], "eval": []}, {"id": "mn10:39.2", "en": "", "pi": "samudayadhammānupassī vā dhammesu viharati, vayadhammānupassī vā dhammesu viharati, samudayavayadhammānupassī vā dhammesu viharati.", "claims": [], "eval": []}, {"id": "mn10:39.3", "en": "", "pi": "‘Atthi dhammā’ti vā panassa sati paccupaṭṭhitā hoti. Yāvadeva ñāṇamattāya paṭissatimattāya anissito ca viharati, na ca kiñci loke upādiyati.", "claims": [], "eval": []}, {"id": "mn10:39.4", "en": "That’s how a mendicant meditates by observing an aspect of principles with respect to the five grasping aggregates.", "pi": "Evampi kho, bhikkhave, bhikkhu dhammesu dhammānupassī viharati pañcasu upādānakkhandhesu.", "claims": [], "eval": []}, {"id": "mn10:39.5", "en": "", "pi": "Khandhapabbaṁ niṭṭhitaṁ.", "claims": [], "eval": []}, {"id": "mn10:40.0", "en": "4.3. The Sense Fields", "pi": "4.3. Dhammānupassanāāyatanapabba", "claims": [], "eval": []}, {"id": "mn10:40.1", "en": "Furthermore, a mendicant meditates by observing an aspect of principles with respect to the six interior and exterior sense fields.", "pi": "Puna caparaṁ, bhikkhave, bhikkhu dhammesu dhammānupassī viharati chasu ajjhattikabāhiresu āyatanesu.", "claims": [], "eval": []}, {"id": "mn10:40.2", "en": "And how does a mendicant meditate observing an aspect of principles with respect to the six interior and exterior sense fields?", "pi": "Kathañca pana, bhikkhave, bhikkhu dhammesu dhammānupassī viharati chasu ajjhattikabāhiresu āyatanesu?", "claims": [], "eval": []}, {"id": "mn10:40.3", "en": "It’s when a mendicant understands the eye, sights, and the fetter that arises dependent on both of these. They understand how the fetter that has not arisen comes to arise; how the arisen fetter comes to be abandoned; and how the abandoned fetter comes to not rise again in the future.", "pi": "Idha, bhikkhave, bhikkhu cakkhuñca pajānāti, rūpe ca pajānāti, yañca tadubhayaṁ paṭicca uppajjati saṁyojanaṁ tañca pajānāti, yathā ca anuppannassa saṁyojanassa uppādo hoti tañca pajānāti, yathā ca uppannassa saṁyojanassa pahānaṁ hoti tañca pajānāti, yathā ca pahīnassa saṁyojanassa āyatiṁ anuppādo hoti tañca pajānāti.", "claims": [], "eval": []}, {"id": "mn10:40.4", "en": "They understand the ear, sounds, and the fetter …", "pi": "Sotañca pajānāti, sadde ca pajānāti, yañca tadubhayaṁ paṭicca uppajjati saṁyojanaṁ tañca pajānāti, yathā ca anuppannassa saṁyojanassa uppādo hoti tañca pajānāti, yathā ca uppannassa saṁyojanassa pahānaṁ hoti tañca pajānāti, yathā ca pahīnassa saṁyojanassa āyatiṁ anuppādo hoti tañca pajānāti.", "claims": [], "eval": []}, {"id": "mn10:40.5", "en": "They understand the nose, smells, and the fetter …", "pi": "Ghānañca pajānāti, gandhe ca pajānāti, yañca tadubhayaṁ paṭicca uppajjati saṁyojanaṁ tañca pajānāti, yathā ca anuppannassa saṁyojanassa uppādo hoti tañca pajānāti, yathā ca uppannassa saṁyojanassa pahānaṁ hoti tañca pajānāti, yathā ca pahīnassa saṁyojanassa āyatiṁ anuppādo hoti tañca pajānāti.", "claims": [], "eval": []}, {"id": "mn10:40.6", "en": "They understand the tongue, tastes, and the fetter …", "pi": "Jivhañca pajānāti, rase ca pajānāti, yañca tadubhayaṁ paṭicca uppajjati saṁyojanaṁ tañca pajānāti, yathā ca anuppannassa saṁyojanassa uppādo hoti tañca pajānāti, yathā ca uppannassa saṁyojanassa pahānaṁ hoti tañca pajānāti, yathā ca pahīnassa saṁyojanassa āyatiṁ anuppādo hoti tañca pajānāti.", "claims": [], "eval": []}, {"id": "mn10:40.7", "en": "They understand the body, touches, and the fetter …", "pi": "Kāyañca pajānāti, phoṭṭhabbe ca pajānāti, yañca tadubhayaṁ paṭicca uppajjati saṁyojanaṁ tañca pajānāti, yathā ca anuppannassa saṁyojanassa uppādo hoti tañca pajānāti, yathā ca uppannassa saṁyojanassa pahānaṁ hoti tañca pajānāti, yathā ca pahīnassa saṁyojanassa āyatiṁ anuppādo hoti tañca pajānāti.", "claims": [], "eval": []}, {"id": "mn10:40.8", "en": "They understand the mind, ideas, and the fetter that arises dependent on both of these. They understand how the fetter that has not arisen comes to arise; how the arisen fetter comes to be abandoned; and how the abandoned fetter comes to not rise again in the future.", "pi": "Manañca pajānāti, dhamme ca pajānāti, yañca tadubhayaṁ paṭicca uppajjati saṁyojanaṁ tañca pajānāti, yathā ca anuppannassa saṁyojanassa uppādo hoti tañca pajānāti, yathā ca uppannassa saṁyojanassa pahānaṁ hoti tañca pajānāti, yathā ca pahīnassa saṁyojanassa āyatiṁ anuppādo hoti tañca pajānāti.", "claims": [], "eval": []}, {"id": "mn10:41.1", "en": "And so they meditate observing an aspect of principles internally …", "pi": "Iti ajjhattaṁ vā dhammesu dhammānupassī viharati, bahiddhā vā dhammesu dhammānupassī viharati, ajjhattabahiddhā vā dhammesu dhammānupassī viharati;", "claims": [], "eval": []}, {"id": "mn10:41.2", "en": "", "pi": "samudayadhammānupassī vā dhammesu viharati, vayadhammānupassī vā dhammesu viharati, samudayavayadhammānupassī vā dhammesu viharati.", "claims": [], "eval": []}, {"id": "mn10:41.3", "en": "", "pi": "‘Atthi dhammā’ti vā panassa sati paccupaṭṭhitā hoti. Yāvadeva ñāṇamattāya paṭissatimattāya anissito ca viharati na ca kiñci loke upādiyati.", "claims": [], "eval": []}, {"id": "mn10:41.4", "en": "That’s how a mendicant meditates by observing an aspect of principles with respect to the six interior and exterior sense fields.", "pi": "Evampi kho, bhikkhave, bhikkhu dhammesu dhammānupassī viharati chasu ajjhattikabāhiresu āyatanesu.", "claims": [], "eval": []}, {"id": "mn10:41.5", "en": "", "pi": "Āyatanapabbaṁ niṭṭhitaṁ.", "claims": [], "eval": []}, {"id": "mn10:42.0", "en": "4.4. The Awakening Factors", "pi": "4.4. Dhammānupassanābojjhaṅgapabba", "claims": [], "eval": []}, {"id": "mn10:42.1", "en": "Furthermore, a mendicant meditates by observing an aspect of principles with respect to the seven awakening factors.", "pi": "Puna caparaṁ, bhikkhave, bhikkhu dhammesu dhammānupassī viharati sattasu bojjhaṅgesu.", "claims": [], "eval": []}, {"id": "mn10:42.2", "en": "And how does a mendicant meditate observing an aspect of principles with respect to the seven awakening factors?", "pi": "Kathañca pana, bhikkhave, bhikkhu dhammesu dhammānupassī viharati sattasu bojjhaṅgesu?", "claims": [], "eval": []}, {"id": "mn10:42.3", "en": "It’s when a mendicant who has the awakening factor of mindfulness in them understands: ‘I have the awakening factor of mindfulness in me.’ When they don’t have the awakening factor of mindfulness in them, they understand: ‘I don’t have the awakening factor of mindfulness in me.’ They understand how the awakening factor of mindfulness that has not arisen comes to arise; and how the awakening factor of mindfulness that has arisen becomes fully developed.", "pi": "Idha, bhikkhave, bhikkhu santaṁ vā ajjhattaṁ satisambojjhaṅgaṁ ‘atthi me ajjhattaṁ satisambojjhaṅgo’ti pajānāti, asantaṁ vā ajjhattaṁ satisambojjhaṅgaṁ ‘natthi me ajjhattaṁ satisambojjhaṅgo’ti pajānāti, yathā ca anuppannassa satisambojjhaṅgassa uppādo hoti tañca pajānāti, yathā ca uppannassa satisambojjhaṅgassa bhāvanāya pāripūrī hoti tañca pajānāti.", "claims": [], "eval": []}, {"id": "mn10:42.4", "en": "When they have the awakening factor of investigation of principles …", "pi": "Santaṁ vā ajjhattaṁ dhammavicayasambojjhaṅgaṁ ‘atthi me ajjhattaṁ dhammavicayasambojjhaṅgo’ti pajānāti, asantaṁ vā ajjhattaṁ dhammavicayasambojjhaṅgaṁ ‘natthi me ajjhattaṁ dhammavicayasambojjhaṅgo’ti pajānāti, yathā ca anuppannassa dhammavicayasambojjhaṅgassa uppādo hoti tañca pajānāti, yathā ca uppannassa dhammavicayasambojjhaṅgassa bhāvanāya pāripūrī hoti tañca pajānāti.", "claims": [], "eval": []}, {"id": "mn10:42.5", "en": "energy …", "pi": "Santaṁ vā ajjhattaṁ vīriyasambojjhaṅgaṁ ‘atthi me ajjhattaṁ vīriyasambojjhaṅgo’ti pajānāti, asantaṁ vā ajjhattaṁ vīriyasambojjhaṅgaṁ ‘natthi me ajjhattaṁ vīriyasambojjhaṅgo’ti pajānāti, yathā ca anuppannassa vīriyasambojjhaṅgassa uppādo hoti tañca pajānāti, yathā ca uppannassa vīriyasambojjhaṅgassa bhāvanāya pāripūrī hoti tañca pajānāti.", "claims": [], "eval": []}, {"id": "mn10:42.6", "en": "rapture …", "pi": "Santaṁ vā ajjhattaṁ pītisambojjhaṅgaṁ ‘atthi me ajjhattaṁ pītisambojjhaṅgo’ti pajānāti, asantaṁ vā ajjhattaṁ pītisambojjhaṅgaṁ ‘natthi me ajjhattaṁ pītisambojjhaṅgo’ti pajānāti, yathā ca anuppannassa pītisambojjhaṅgassa uppādo hoti tañca pajānāti, yathā ca uppannassa pītisambojjhaṅgassa bhāvanāya pāripūrī hoti tañca pajānāti.", "claims": [], "eval": []}, {"id": "mn10:42.7", "en": "tranquility …", "pi": "Santaṁ vā ajjhattaṁ passaddhisambojjhaṅgaṁ ‘atthi me ajjhattaṁ passaddhisambojjhaṅgo’ti pajānāti, asantaṁ vā ajjhattaṁ passaddhisambojjhaṅgaṁ ‘natthi me ajjhattaṁ passaddhisambojjhaṅgo’ti pajānāti, yathā ca anuppannassa passaddhisambojjhaṅgassa uppādo hoti tañca pajānāti, yathā ca uppannassa passaddhisambojjhaṅgassa bhāvanāya pāripūrī hoti tañca pajānāti.", "claims": [], "eval": []}, {"id": "mn10:42.8", "en": "immersion …", "pi": "Santaṁ vā ajjhattaṁ samādhisambojjhaṅgaṁ ‘atthi me ajjhattaṁ samādhisambojjhaṅgo’ti pajānāti, asantaṁ vā ajjhattaṁ samādhisambojjhaṅgaṁ ‘natthi me ajjhattaṁ samādhisambojjhaṅgo’ti pajānāti, yathā ca anuppannassa samādhisambojjhaṅgassa uppādo hoti tañca pajānāti, yathā ca uppannassa samādhisambojjhaṅgassa bhāvanāya pāripūrī hoti tañca pajānāti.", "claims": [], "eval": []}, {"id": "mn10:42.9", "en": "equanimity in them, they understand: ‘I have the awakening factor of equanimity in me.’ When they don’t have the awakening factor of equanimity in them, they understand: ‘I don’t have the awakening factor of equanimity in me.’ They understand how the awakening factor of equanimity that has not arisen comes to arise; and how the awakening factor of equanimity that has arisen becomes fully developed.", "pi": "Santaṁ vā ajjhattaṁ upekkhāsambojjhaṅgaṁ ‘atthi me ajjhattaṁ upekkhāsambojjhaṅgo’ti pajānāti, asantaṁ vā ajjhattaṁ upekkhāsambojjhaṅgaṁ ‘natthi me ajjhattaṁ upekkhāsambojjhaṅgo’ti pajānāti, yathā ca anuppannassa upekkhāsambojjhaṅgassa uppādo hoti tañca pajānāti, yathā ca uppannassa upekkhāsambojjhaṅgassa bhāvanāya pāripūrī hoti tañca pajānāti.", "claims": [], "eval": []}, {"id": "mn10:43.1", "en": "And so they meditate observing an aspect of principles internally, externally, and both internally and externally.", "pi": "Iti ajjhattaṁ vā dhammesu dhammānupassī viharati, bahiddhā vā dhammesu dhammānupassī viharati, ajjhattabahiddhā vā dhammesu dhammānupassī viharati;", "claims": [], "eval": []}, {"id": "mn10:43.2", "en": "They meditate observing, with respect to the principles, the liability to originate, to vanish, and to originate and vanish.", "pi": "samudayadhammānupassī vā dhammesu viharati, vayadhammānupassī vā dhammesu viharati, samudayavayadhammānupassī vā dhammesu viharati.", "claims": [], "eval": []}, {"id": "mn10:43.3", "en": "Or mindfulness is established that principles exist, to the extent necessary for knowledge and mindfulness. They meditate independent, not grasping at anything in the world.", "pi": "‘Atthi dhammā’ti vā panassa sati paccupaṭṭhitā hoti. Yāvadeva ñāṇamattāya paṭissatimattāya anissito ca viharati, na ca kiñci loke upādiyati.", "claims": [], "eval": []}, {"id": "mn10:43.4", "en": "That’s how a mendicant meditates by observing an aspect of principles with respect to the seven awakening factors.", "pi": "Evampi kho, bhikkhave, bhikkhu dhammesu dhammānupassī viharati sattasu bojjhaṅgesu.", "claims": [], "eval": []}, {"id": "mn10:43.5", "en": "", "pi": "Bojjhaṅgapabbaṁ niṭṭhitaṁ.", "claims": [], "eval": []}, {"id": "mn10:44.0", "en": "4.5. The Truths", "pi": "4.5. Dhammānupassanāsaccapabba", "claims": [], "eval": []}, {"id": "mn10:44.1", "en": "Furthermore, a mendicant meditates by observing an aspect of principles with respect to the four noble truths.", "pi": "Puna caparaṁ, bhikkhave, bhikkhu dhammesu dhammānupassī viharati catūsu ariyasaccesu.", "claims": [], "eval": []}, {"id": "mn10:44.2", "en": "And how does a mendicant meditate observing an aspect of principles with respect to the four noble truths?", "pi": "Kathañca pana, bhikkhave, bhikkhu dhammesu dhammānupassī viharati catūsu ariyasaccesu?", "claims": [], "eval": []}, {"id": "mn10:44.3", "en": "It’s when a mendicant truly understands: ‘This is suffering’ … ‘This is the origin of suffering’ … ‘This is the cessation of suffering’ … ‘This is the practice that leads to the cessation of suffering.’", "pi": "Idha, bhikkhave, bhikkhu ‘idaṁ dukkhan’ti yathābhūtaṁ pajānāti, ‘ayaṁ dukkhasamudayo’ti yathābhūtaṁ pajānāti, ‘ayaṁ dukkhanirodho’ti yathābhūtaṁ pajānāti, ‘ayaṁ dukkhanirodhagāminī paṭipadā’ti yathābhūtaṁ pajānāti.", "claims": [], "eval": []}, {"id": "mn10:45.1", "en": "And so they meditate observing an aspect of principles internally, externally, and both internally and externally.", "pi": "Iti ajjhattaṁ vā dhammesu dhammānupassī viharati, bahiddhā vā dhammesu dhammānupassī viharati, ajjhattabahiddhā vā dhammesu dhammānupassī viharati;", "claims": [], "eval": []}, {"id": "mn10:45.2", "en": "They meditate observing, with respect to the principles, the liability to originate, to vanish, and to originate and vanish.", "pi": "samudayadhammānupassī vā dhammesu viharati, vayadhammānupassī vā dhammesu viharati, samudayavayadhammānupassī vā dhammesu viharati.", "claims": [], "eval": []}, {"id": "mn10:45.3", "en": "Or mindfulness is established that principles exist, to the extent necessary for knowledge and mindfulness. They meditate independent, not grasping at anything in the world.", "pi": "‘Atthi dhammā’ti vā panassa sati paccupaṭṭhitā hoti. Yāvadeva ñāṇamattāya paṭissatimattāya anissito ca viharati, na ca kiñci loke upādiyati.", "claims": [], "eval": []}, {"id": "mn10:45.4", "en": "That’s how a mendicant meditates by observing an aspect of principles with respect to the four noble truths.", "pi": "Evampi kho, bhikkhave, bhikkhu dhammesu dhammānupassī viharati catūsu ariyasaccesu.", "claims": [], "eval": []}, {"id": "mn10:45.5", "en": "", "pi": "Saccapabbaṁ niṭṭhitaṁ.", "claims": [], "eval": []}, {"id": "mn10:45.6", "en": "", "pi": "Dhammānupassanā niṭṭhitā.", "claims": [], "eval": []}, {"id": "mn10:46.1", "en": "Anyone who develops these four kinds of mindfulness meditation in this way for seven years can expect one of two results:", "pi": "Yo hi koci, bhikkhave, ime cattāro satipaṭṭhāne evaṁ bhāveyya satta vassāni, tassa dvinnaṁ phalānaṁ aññataraṁ phalaṁ pāṭikaṅkhaṁ", "claims": [], "eval": []}, {"id": "mn10:46.2", "en": "enlightenment in this very life, or if there’s residue left behind, non-return.", "pi": "diṭṭheva dhamme aññā; sati vā upādisese anāgāmitā.", "claims": [], "eval": []}, {"id": "mn10:46.3", "en": "Let alone seven years,", "pi": "Tiṭṭhantu, bhikkhave, satta vassāni.", "claims": [], "eval": []}, {"id": "mn10:46.4", "en": "anyone who develops these four kinds of mindfulness meditation in this way for six years …", "pi": "Yo hi koci, bhikkhave, ime cattāro satipaṭṭhāne evaṁ bhāveyya cha vassāni …pe…", {"uid": "mn148", "title": "MN 148 Chachakkasutta — Six By Six", "layer": "Sutta (early discourses)", "coverage": "cited only", "review": "not yet reviewed", "encodes": "Two segments (5.3, 6.8) as evidence for 'dhamma' meaning an object of the mind.", "leftOut": "The six sets of six (sense fields, objects, consciousnesses, contacts, feelings, cravings) and the not-self argument built on them.", "modelledBy": "project owner with Claude (AI assistant), from SuttaCentral's text", "modelledOn": "2026-11-13", "segments": [{"id": "mn148:0.1", "en": "Middle Discourses 148", "pi": "Majjhima Nikāya 148", "claims": [], "eval": []}, {"id": "mn148:0.2", "en": "Six By Six", "pi": "Chachakkasutta", "claims": [], "eval": []}, {"id": "mn148:1.1", "en": "So I have heard.", "pi": "Evaṁ me sutaṁ—", "claims": [], "eval": []}, {"id": "mn148:1.2", "en": "At one time the Buddha was staying near Sāvatthī in Jeta’s Grove, Anāthapiṇḍika’s monastery.", "pi": "ekaṁ samayaṁ bhagavā sāvatthiyaṁ viharati jetavane anāthapiṇḍikassa ārāme.", "claims": [], "eval": []}, {"id": "mn148:1.3", "en": "There the Buddha addressed the mendicants,", "pi": "Tatra kho bhagavā bhikkhū āmantesi:", "claims": [], "eval": []}, {"id": "mn148:1.4", "en": "“Mendicants!”", "pi": "“bhikkhavo”ti.", "claims": [], "eval": []}, {"id": "mn148:1.5", "en": "“Venerable sir,” they replied.", "pi": "“Bhadante”ti te bhikkhū bhagavato paccassosuṁ.", "claims": [], "eval": []}, {"id": "mn148:1.6", "en": "The Buddha said this:", "pi": "Bhagavā etadavoca:", "claims": [], "eval": []}, {"id": "mn148:2.1", "en": "“Mendicants, I shall teach you the Dhamma that’s good in the beginning, good in the middle, and good in the end, meaningful and well-phrased. And I shall reveal a spiritual practice that’s entirely full and pure, namely,", "pi": "“dhammaṁ vo, bhikkhave, desessāmi ādikalyāṇaṁ majjhekalyāṇaṁ pariyosānakalyāṇaṁ sātthaṁ sabyañjanaṁ, kevalaparipuṇṇaṁ parisuddhaṁ brahmacariyaṁ pakāsessāmi, yadidaṁ—", "claims": [], "eval": []}, {"id": "mn148:2.2", "en": "the six sets of six.", "pi": "cha chakkāni.", "claims": [], "eval": []}, {"id": "mn148:2.3", "en": "Listen and apply your mind well, I will speak.”", "pi": "Taṁ suṇātha, sādhukaṁ manasi karotha, bhāsissāmī”ti.", "claims": [], "eval": []}, {"id": "mn148:2.4", "en": "“Yes, sir,” they replied.", "pi": "“Evaṁ, bhante”ti kho te bhikkhū bhagavato paccassosuṁ.", "claims": [], "eval": []}, {"id": "mn148:2.5", "en": "The Buddha said this:", "pi": "Bhagavā etadavoca:", "claims": [], "eval": []}, {"id": "mn148:3.1", "en": "“The six interior sense fields should be understood. The six exterior sense fields should be understood. The six classes of consciousness should be understood. The six classes of contact should be understood. The six classes of feeling should be understood. The six classes of craving should be understood.", "pi": "“Cha ajjhattikāni āyatanāni veditabbāni, cha bāhirāni āyatanāni veditabbāni, cha viññāṇakāyā veditabbā, cha phassakāyā veditabbā, cha vedanākāyā veditabbā, cha taṇhākāyā veditabbā.", "claims": [], "eval": []}, {"id": "mn148:4.1", "en": "‘The six interior sense fields should be understood.’", "pi": "‘Cha ajjhattikāni āyatanāni veditabbānī’ti—", "claims": [], "eval": []}, {"id": "mn148:4.2", "en": "That’s what I said, but why did I say it?", "pi": "iti kho panetaṁ vuttaṁ. Kiñcetaṁ paṭicca vuttaṁ?", "claims": [], "eval": []}, {"id": "mn148:4.3", "en": "There are the sense fields of the eye, ear, nose, tongue, body, and mind.", "pi": "Cakkhāyatanaṁ, sotāyatanaṁ, ghānāyatanaṁ, jivhāyatanaṁ, kāyāyatanaṁ, manāyatanaṁ.", "claims": [], "eval": []}, {"id": "mn148:4.4", "en": "‘The six interior sense fields should be understood.’", "pi": "‘Cha ajjhattikāni āyatanāni veditabbānī’ti—", "claims": [], "eval": []}, {"id": "mn148:4.5", "en": "That’s what I said, and this is why I said it.", "pi": "iti yaṁ taṁ vuttaṁ, idametaṁ paṭicca vuttaṁ.", "claims": [], "eval": []}, {"id": "mn148:4.6", "en": "This is the first set of six.", "pi": "Idaṁ paṭhamaṁ chakkaṁ.", "claims": [], "eval": []}, {"id": "mn148:5.1", "en": "‘The six exterior sense fields should be understood.’", "pi": "‘Cha bāhirāni āyatanāni veditabbānī’ti—", "claims": [], "eval": []}, {"id": "mn148:5.2", "en": "That’s what I said, but why did I say it?", "pi": "iti kho panetaṁ vuttaṁ. Kiñcetaṁ paṭicca vuttaṁ?", "claims": [], "eval": []}, {"id": "mn148:5.3", "en": "There are the sense fields of sights, sounds, smells, tastes, touches, and ideas.", "pi": "Rūpāyatanaṁ, saddāyatanaṁ, gandhāyatanaṁ, rasāyatanaṁ, phoṭṭhabbāyatanaṁ, dhammāyatanaṁ.", "claims": [{"kind": "word sense", "layer": "lexicon", "text": "'dhamma' meaning a dhamma (an object of the mind, an idea)"}], "eval": []}, {"id": "mn148:5.4", "en": "‘The six exterior sense fields should be understood.’", "pi": "‘Cha bāhirāni āyatanāni veditabbānī’ti—", "claims": [], "eval": []}, {"id": "mn148:5.5", "en": "That’s what I said, and this is why I said it.", "pi": "iti yaṁ taṁ vuttaṁ, idametaṁ paṭicca vuttaṁ.", "claims": [], "eval": []}, {"id": "mn148:5.6", "en": "This is the second set of six.", "pi": "Idaṁ dutiyaṁ chakkaṁ.", "claims": [], "eval": []}, {"id": "mn148:6.1", "en": "‘The six classes of consciousness should be understood.’", "pi": "‘Cha viññāṇakāyā veditabbā’ti—", "claims": [], "eval": []}, {"id": "mn148:6.2", "en": "That’s what I said, but why did I say it?", "pi": "iti kho panetaṁ vuttaṁ. Kiñcetaṁ paṭicca vuttaṁ?", "claims": [], "eval": []}, {"id": "mn148:6.3", "en": "Eye consciousness arises dependent on the eye and sights.", "pi": "Cakkhuñca paṭicca rūpe ca uppajjati cakkhuviññāṇaṁ,", "claims": [], "eval": []}, {"id": "mn148:6.4", "en": "Ear consciousness arises dependent on the ear and sounds.", "pi": "sotañca paṭicca sadde ca uppajjati sotaviññāṇaṁ,", "claims": [], "eval": []}, {"id": "mn148:6.5", "en": "Nose consciousness arises dependent on the nose and smells.", "pi": "ghānañca paṭicca gandhe ca uppajjati ghānaviññāṇaṁ,", "claims": [], "eval": []}, {"id": "mn148:6.6", "en": "Tongu ": "mn148:17-21.5", "en": "craving like this: ‘This is mine, I am this, this is my self.’", "pi": "taṇhaṁ ‘etaṁ mama, esohamasmi, eso me attā’ti samanupassati;", "claims": [], "eval": []}, {"id": "mn148:17-21.6", "en": "You regard the ear …", "pi": "sotaṁ ‘etaṁ mama, esohamasmi, eso me attā’ti samanupassati …pe…", "claims": [], "eval": []}, {"id": "mn148:17-21.7", "en": "nose …", "pi": "ghānaṁ ‘etaṁ mama, esohamasmi, eso me attā’ti samanupassati …pe…", "claims": [], "eval": []}, {"id": "mn148:17-21.8", "en": "tongue …", "pi": "jivhaṁ ‘etaṁ mama, esohamasmi, eso me attā’ti samanupassati …pe…", "claims": [], "eval": []}, {"id": "mn148:17-21.9", "en": "body …", "pi": "kāyaṁ ‘etaṁ mama, esohamasmi, eso me attā’ti samanupassati …pe…", "claims": [], "eval": []}, {"id": "mn148:17-21.10", "en": "mind … ideas … mind consciousness … mind contact … feeling … craving like this: ‘This is mine, I am this, this is my self.’", "pi": "manaṁ ‘etaṁ mama, esohamasmi, eso me attā’ti samanupassati, dhamme ‘etaṁ mama, esohamasmi, eso me attā’ti samanupassati, manoviññāṇaṁ ‘etaṁ mama, esohamasmi, eso me attā’ti samanupassati, manosamphassaṁ ‘etaṁ mama, esohamasmi, eso me attā’ti samanupassati, vedanaṁ ‘etaṁ mama, esohamasmi, eso me attā’ti samanupassati, taṇhaṁ ‘etaṁ mama, esohamasmi, eso me attā’ti samanupassati.", "claims": [], "eval": []}, {"id": "mn148:22.1", "en": "But this is the practice that leads to the cessation of substantial reality.", "pi": "Ayaṁ kho pana, bhikkhave, sakkāyanirodhagāminī paṭipadā—", "claims": [], "eval": []}, {"id": "mn148:22.2", "en": "You regard the eye like this: ‘This is not mine, I am not this, this is not my self.’", "pi": "cakkhuṁ ‘netaṁ mama, nesohamasmi, na meso attā’ti samanupassati.", "claims": [], "eval": []}, {"id": "mn148:23-27.1", "en": "You regard sights …", "pi": "Rūpe ‘netaṁ mama, nesohamasmi, na meso attā’ti samanupassati.", "claims": [], "eval": []}, {"id": "mn148:23-27.2", "en": "eye consciousness …", "pi": "Cakkhuviññāṇaṁ ‘netaṁ mama, nesohamasmi, na meso attā’ti samanupassati.", "claims": [], "eval": []}, {"id": "mn148:23-27.3", "en": "eye contact …", "pi": "Cakkhusamphassaṁ ‘netaṁ mama, nesohamasmi, na meso attā’ti samanupassati.", "claims": [], "eval": []}, {"id": "mn148:23-27.4", "en": "feeling …", "pi": "Vedanaṁ ‘netaṁ mama, nesohamasmi, na meso attā’ti samanupassati.", "claims": [], "eval": []}, {"id": "mn148:23-27.5", "en": "craving like this: ‘This is not mine, I am not this, this is not my self.’", "pi": "Taṇhaṁ ‘netaṁ mama, nesohamasmi, na meso attā’ti samanupassati.", "claims": [], "eval": []}, {"id": "mn148:23-27.6", "en": "You regard the ear …", "pi": "Sotaṁ ‘netaṁ mama, nesohamasmi, na meso attā’ti samanupassati …pe…", "claims": [], "eval": []}, {"id": "mn148:23-27.7", "en": "nose …", "pi": "ghānaṁ ‘netaṁ mama, nesohamasmi, na meso attā’ti samanupassati …pe…", "claims": [], "eval": []}, {"id": "mn148:23-27.8", "en": "tongue …", "pi": "jivhaṁ ‘netaṁ mama, nesohamasmi, na meso attā’ti samanupassati …pe…", "claims": [], "eval": []}, {"id": "mn148:23-27.9", "en": "body …", "pi": "kāyaṁ ‘netaṁ mama, nesohamasmi, na meso attā’ti samanupassati …pe…", "claims": [], "eval": []}, {"id": "mn148:23-27.10", "en": "mind like this: ‘This is not mine, I am not this, this is not my self.’", "pi": "manaṁ ‘netaṁ mama, nesohamasmi, na meso attā’ti samanupassati.", "claims": [], "eval": []}, {"id": "mn148:23-27.11", "en": "You regard ideas …", "pi": "Dhamme ‘netaṁ mama, nesohamasmi, na meso attā’ti samanupassati.", "claims": [], "eval": []}, {"id": "mn148:23-27.12", "en": "mind consciousness …", "pi": "Manoviññāṇaṁ ‘netaṁ mama, nesohamasmi, na meso attā’ti samanupassati.", "claims": [], "eval": []}, {"id": "mn148:23-27.13", "en": "mind contact …", "pi": "Manosamphassaṁ ‘netaṁ mama, nesohamasmi, na meso attā’ti samanupassati.", "claims": [], "eval": []}, {"id": "mn148:23-27.14", "en": "feeling …", "pi": "Vedanaṁ ‘netaṁ mama, nesohamasmi, na meso attā’ti samanupassati.", "claims": [], "eval": []}, {"id": "mn148:23-27.15", "en": "craving like this: ‘This is not mine, I am not this, this is not my self.’", "pi": "Taṇhaṁ ‘netaṁ mama, nesohamasmi, na meso attā’ti samanupassati.", "claims": [], "eval": []}, {"id": "mn148:28.1", "en": "Eye consciousness arises dependent on the eye and sights. The meeting of the three is contact. Contact is a requirement for the arising of what is felt as pleasant, painful, or neutral.", "pi": "Cakkhuñca, bhikkhave, paṭicca rūpe ca uppajjati cakkhuviññāṇaṁ, tiṇṇaṁ saṅgati phasso, phassapaccayā uppajjati vedayitaṁ sukhaṁ vā dukkhaṁ vā adukkhamasukhaṁ vā.", "claims": [], "eval": []}, {"id": "mn148:28.2", "en": "When you experience a pleasant feeling, if you approve, welcome, and keep clinging to it,", "pi": "So sukhāya vedanāya phuṭṭho samāno abhinandati abhivadati ajjhosāya tiṭṭhati.", "claims": [], "eval": []}, {"id": "mn148:28.3", "en": "the underlying tendency to greed underlies that.", "pi": "Tassa rāgānusayo anuseti.", "claims": [], "eval": []}, {"id": "mn148:28.4", "en": "When you experience a painful feeling, if you sorrow and wail and lament, beating your breast and falling into confusion,", "pi": "Dukkhāya vedanāya phuṭṭho samāno socati kilamati paridevati urattāḷiṁ kandati sammohaṁ āpajjati.", "claims": [], "eval": []}, {"id": "mn148:28.5", "en": "the underlying tendency to aversion underlies that.", "pi": "Tassa paṭighānusayo anuseti.", "claims": [], "eval": []}, {"id": "mn148:28.6", "en": "When you experience a neutral feeling, if you don’t truly understand that feeling’s origin, disappearance, gratification, drawback, and escape,", "pi": "Adukkhamasukhāya vedanāya phuṭṭho samāno tassā vedanāya samudayañca atthaṅgamañca assādañca ādīnavañca nissaraṇañca yathābhūtaṁ nappajānāti.", "claims": [], "eval": []}, {"id": "mn148:28.7", "en": "the underlying tendency to ignorance underlies that.", "pi": "Tassa avijjānusayo anuseti.", "claims": [], "eval": []}, {"id": "mn148:28.8", "en": "Mendicants, without giving up the underlying tendency   }
  box.innerHTML = rows.join("") || `<p class="empty">No segments match this filter.</p>`;
}

function render() {
  const t = current();
  document.querySelectorAll("nav a").forEach(a => a.setAttribute("aria-current", a.dataset.slug === slug(t.uid) ? "page" : "false"));
  renderRecord(t);
  renderSegments(t);
}

for (const f of ["all", "cited", "uncited"]) {
  document.getElementById("f-" + f).onclick = () => {
    filter = f;
    for (const g of ["all", "cited", "uncited"]) document.getElementById("f-" + g).setAttribute("aria-pressed", String(g === f));
    renderSegments(current());
  };
}
addEventListener("hashchange", render);
render();
</script>
