s": [], "eval": []}, {"id": "sn46.53:2.1", "en": "“Mendicants, when wanderers of other religions say this, you should say to them:", "pi": "“Evaṁvādino, bhikkhave, aññatitthiyā paribbājakā evamassu vacanīyā:", "claims": [], "eval": []}, {"id": "sn46.53:2.2", "en": "‘Reverends, which awakening factors should not be developed when the mind is sluggish? And which awakening factors should be developed at that time?", "pi": "‘yasmiṁ, āvuso, samaye līnaṁ cittaṁ hoti, katamesaṁ tasmiṁ samaye bojjhaṅgānaṁ akālo bhāvanāya, katamesaṁ tasmiṁ samaye bojjhaṅgānaṁ kālo bhāvanāya?", "claims": [], "eval": []}, {"id": "sn46.53:2.3", "en": "Which awakening factors should not be developed when the mind is restless? And which awakening factors should be developed at that time?’", "pi": "Yasmiṁ panāvuso, samaye uddhataṁ cittaṁ hoti, katamesaṁ tasmiṁ samaye bojjhaṅgānaṁ akālo bhāvanāya, katamesaṁ tasmiṁ samaye bojjhaṅgānaṁ kālo bhāvanāyā’ti?", "claims": [], "eval": []}, {"id": "sn46.53:2.4", "en": "Questioned like this, the wanderers of other religions would be stumped, and, in addition, would get frustrated.", "pi": "Evaṁ puṭṭhā, bhikkhave, aññatitthiyā paribbājakā na ceva sampāyissanti, uttariñca vighātaṁ āpajjissanti.", "claims": [], "eval": []}, {"id": "sn46.53:2.5", "en": "Why is that?", "pi": "Taṁ kissa hetu?", "claims": [], "eval": []}, {"id": "sn46.53:2.6", "en": "Because they’re out of their element.", "pi": "Yathā taṁ, bhikkhave, avisayasmiṁ.", "claims": [], "eval": []}, {"id": "sn46.53:3.1", "en": "I don’t see anyone in this world—with its gods, Māras, and divinities, this population with its ascetics and brahmins, its gods and humans—who could provide a satisfying answer to these questions except the Realized One or his disciple or someone who has heard it from them.", "pi": "Nāhaṁ taṁ, bhikkhave, passāmi sadevake loke samārake sabrahmake sassamaṇabrāhmaṇiyā pajāya sadevamanussāya yo imesaṁ pañhānaṁ veyyākaraṇena cittaṁ ārādheyya, aññatra tathāgatena vā tathāgatasāvakena vā ito vā pana sutvā.", "claims": [], "eval": []}, {"id": "sn46.53:4.1", "en": "When the mind is sluggish, it’s the wrong time to develop the awakening factors of tranquility, immersion, and equanimity.", "pi": "Yasmiṁ, bhikkhave, samaye līnaṁ cittaṁ hoti, akālo tasmiṁ samaye passaddhisambojjhaṅgassa bhāvanāya, akālo samādhisambojjhaṅgassa bhāvanāya, akālo upekkhāsambojjhaṅgassa bhāvanāya.", "claims": [{"kind": "timing", "layer": "sutta", "text": "when the mind is sluggish: wrong time to develop tranquility"}, {"kind": "timing", "layer": "sutta", "text": "when the mind is sluggish: wrong time to develop immersion"}, {"kind": "timing", "layer": "sutta", "text": "when the mind is sluggish: wrong time to develop equanimity"}], "eval": ["Q14", "Q25"]}, {"id": "sn46.53:4.2", "en": "Why is that?", "pi": "Taṁ kissa hetu?", "claims": [], "eval": []}, {"id": "sn46.53:4.3", "en": "Because it’s hard to stimulate a sluggish mind with these things.", "pi": "Līnaṁ, bhikkhave, cittaṁ taṁ etehi dhammehi dussamuṭṭhāpayaṁ hoti.", "claims": [{"kind": "timing", "layer": "sutta", "text": "when the mind is sluggish: wrong time to develop tranquility"}, {"kind": "timing", "layer": "sutta", "text": "when the mind is sluggish: wrong time to develop immersion"}, {"kind": "timing", "layer": "sutta", "text": "when the mind is sluggish: wrong time to develop equanimity"}], "eval": []}, {"id": "sn46.53:5.1", "en": "Suppose someone wanted to make a small fire flare up.", "pi": "Seyyathāpi, bhikkhave, puriso parittaṁ aggiṁ ujjāletukāmo assa.", "claims": [], "eval": ["Q17"]}, {"id": "sn46.53:5.2", "en": "If they toss wet grass, cow-dung, and timber on it, spray it with water, and scatter dirt on it,", "pi": "So tattha allāni ceva tiṇāni pakkhipeyya, allāni ca gomayāni pakkhipeyya, allāni ca kaṭṭhāni pakkhipeyya, udakavātañca dadeyya, paṁsukena ca okireyya;", "claims": [], "eval": ["Q17"]}, {"id": "sn46.53:5.3", "en": "could they make it flare up?”", "pi": "bhabbo nu kho so puriso parittaṁ aggiṁ ujjāletun”ti?", "claims": [], "eval": ["Q17"]}, {"id": "sn46.53:5.4", "en": "“No, sir.”", "pi": "“No hetaṁ, bhante”.", "claims": [], "eval": ["Q17"]}, {"id": "sn46.53:6.1", "en": "“In the same way, when the mind is sluggish, it’s the wrong time to develop the awakening factors of tranquility, immersion, and equanimity.", "pi": "“Evameva kho, bhikkhave, yasmiṁ samaye līnaṁ cittaṁ hoti, akālo tasmiṁ samaye passaddhisambojjhaṅgassa bhāvanāya, akālo samādhisambojjhaṅgassa bhāvanāya, akālo upekkhāsambojjhaṅgassa bhāvanāya.", "claims": [], "eval": []}, {"id": "sn46.53:6.2", "en": "Why is that?", "pi": "Taṁ kissa hetu?", "claims": [], "eval": []}, {"id": "sn46.53:6.3", "en": "Because it’s hard to stimulate a sluggish mind with these things.", "pi": "Līnaṁ, bhikkhave, cittaṁ taṁ etehi dhammehi dussamuṭṭhāpayaṁ hoti.", "claims": [], "eval": []}, {"id": "sn46.53:7.1", "en": "When the mind is sluggish, it’s the right time to develop the awakening factors of investigation of principles, energy, and rapture.", "pi": "Yasmiñca kho, bhikkhave, samaye līnaṁ cittaṁ hoti, kālo tasmiṁ samaye dhammavicayasambojjhaṅgassa bhāvanāya, kālo vīriyasambojjhaṅgassa bhāvanāya, kālo pītisambojjhaṅgassa bhāvanāya.", "claims": [{"kind": "timing", "layer": "sutta", "text": "when the mind is sluggish: right time to develop investigation of principles"}, {"kind": "timing", "layer": "sutta", "text": "when the mind is sluggish: right time to develop energy"}, {"kind": "timing", "layer": "sutta", "text": "when the mind is sluggish: right time to develop rapture"}], "eval": ["Q14", "Q25"]}, {"id": "sn46.53:7.2", "en": "Why is that?", "pi": "Taṁ kissa hetu?", "claims": [], "eval": []}, {"id": "sn46.53:7.3", "en": "Because it’s easy to stimulate a sluggish mind with these things.", "pi": "Līnaṁ, bhikkhave, cittaṁ taṁ etehi dhammehi susamuṭṭhāpayaṁ hoti.", "claims": [{"kind": "timing", "layer": "sutta", "text": "when the mind is sluggish: right time to develop investigation of principles"}, {"kind": "timing", "layer": "sutta", "text": "when the mind is sluggish: right time to develop energy"}, {"kind": "timing", "layer": "sutta", "text": "when the mind is sluggish: right time to develop rapture"}], "eval": []}, {"id": "sn46.53:8.1", "en": "Suppose someone wanted to make a small fire flare up.", "pi": "Seyyathāpi, bhikkhave, puriso parittaṁ aggiṁ ujjāletukāmo assa.", "claims": [], "eval": []}, {"id": "sn46.53:8.2", "en": "If they toss dry grass, cow-dung, and timber on it, blow on it, and don’t scatter dirt on it,", "pi": "So tattha sukkhāni ceva tiṇāni pakkhipeyya, sukkhāni gomayāni pakkhipeyya, sukkhāni kaṭṭhāni pakkhipeyya, mukhavātañca dadeyya, na ca paṁsukena okireyya;", "claims": [], "eval": []}, {"id": "sn46.53:8.3", "en": "could they make it flare up?”", "pi": "bhabbo nu kho so puriso parittaṁ aggiṁ ujjāletun”ti?", "claims": [], "eval": []}, {"id": "sn46.53:8.4", "en": "“Yes, sir.”", "pi": "“Evaṁ, bhante”.", "claims": [], "eval": []}, {"id": "sn46.53:9.1", "en": "“In the same way, when the mind is sluggish, it’s the right time to develop the awakening factors of investigation of principles, energy, and rapture.", "pi": "“Evameva kho, bhikkhave, yasmiṁ samaye līnaṁ cittaṁ hoti, kālo tasmiṁ samaye dhammavicayasambojjhaṅgassa bhāvanāya, kālo vīriyasambojjhaṅgassa bhāvanāya, kālo pītisambojjhaṅgassa bhāvanāya.", "claims": [], "eval": []}, {"id": "sn46.53:9.2", "en": "Why is that?", "pi": "Taṁ kissa hetu?", "claims": [], "eval": []}, {"id": "sn46.53:9.3", "en": "Because it’s easy to stimulate a sluggish mind with these things.", "pi": "Līnaṁ, bhikkhave, cittaṁ taṁ etehi dhammehi susamuṭṭhāpayaṁ hoti.", "claims": [], "eval": []}, {"id": "sn46.53:10.1", "en": "When the mind is restless, it’s the wrong time to develop the awakening factors of investigation of principles, energy, and rapture.", "pi": "Yasmiṁ, bhikkhave, samaye uddhataṁ cittaṁ hoti, akālo tasmiṁ samaye dhammavicayasambojjhaṅgassa bhāvanāya, akālo vīriyasambojjhaṅgassa bhāvanāya, akālo pītisambojjhaṅgassa bhāvanāya.", "claims": [{"kind": "timing", "layer": "sutta", "text": "when the mind is restless: wrong time to develop investigation of principles"}, {"kind": "timing", "layer": "sutta", "text": "when the mind is restless: wrong time to develop energy"}, {"kind": "timing", "layer": "sutta", "text": "when the mind is restless: wrong time to develop rapture"}], "eval": ["Q15", "Q26"]}, {"id": "sn46.53:10.2", "en": "Why is that?", "pi": "Taṁ kissa hetu?", "claims": [], "eval": []}, {"id": "sn46.53:10.3", "en": "Because it’s hard to settle a restless mind with these things.", "pi": "Uddhataṁ, bhikkhave, cittaṁ taṁ etehi dhammehi duvūpasamayaṁ hoti.", "claims": [{"kind": "timing", "layer": "sutta", "text": "when the mind is restless: wrong time to develop investigation of principles"}, {"kind": "timing", "layer": "sutta", "text": "when the mind is restless: wrong time to develop energy"}, {"kind": "timing", "layer": "sutta", "text": "when the mind is restless: wrong time to develop rapture"}], "eval": []}, {"id": "sn46.53:11.1", "en": "Suppose someone wanted to extinguish a great mass of fire.", "pi": "Seyyathāpi, bhikkhave, puriso mahantaṁ aggikkhandhaṁ nibbāpetukāmo assa.", "claims": [], "eval": []}, {"id": "sn46.53:11.2", "en": "If they toss dry grass, cow-dung, and timber on it, blow on it, and don’t scatter dirt on it,", "pi": "So tattha sukkhāni ceva tiṇāni pakkhipeyya, sukkhāni ca gomayāni pakkhipeyya, sukkhāni ca kaṭṭhāni pakkhipeyya, mukhavātañca dadeyya, na ca paṁsukena okireyya;", "claims": [], "eval": []}, {"id": "sn46.53:11.3", "en": "could they extinguish it?”", "pi": "bhabbo nu kho so puriso mahantaṁ aggikkhandhaṁ nibbāpetun”ti?", "claims": [], "eval": []}, {"id": "sn46.53:11.4", "en": "“No, sir.”", "pi": "“No hetaṁ, bhante”.", "claims": [], "eval": []}, {"id": "sn46.53:12.1", "en": "“In the same way, when the mind is restless, it’s the wrong time to develop the awakening factors of investigation of principles, energy, and rapture.", "pi": "“Evameva kho, bhikkhave, yasmiṁ samaye uddhataṁ cittaṁ hoti, akālo tasmiṁ samaye dhammavicayasambojjhaṅgassa bhāvanāya, akālo vīriyasambojjhaṅgassa bhāvanāya, akālo pītisambojjhaṅgassa bhāvanāya.", "claims": [], "eval": []}, {"id": "sn46.53:12.2", "en": "Why is that?", "pi": "Taṁ kissa hetu?", "claims": [], "eval": []}, {"id": "sn46.53:12.3", "en": "Because it’s hard to settle a restless mind with these things.", "pi": "Uddhataṁ, bhikkhave, cittaṁ taṁ etehi dhammehi duvūpasamayaṁ hoti.", "claims": [], "eval": []}, {"id": "sn46.53:13.1", "en": "When the mind is restless, it’s the right time to develop the awakening factors of tranquility, immersion, and equanimity.", "pi": "Yasmiñca kho, bhikkhave, samaye uddhataṁ cittaṁ hoti, kālo tasmiṁ samaye passaddhisambojjhaṅgassa bhāvanāya, kālo samādhisambojjhaṅgassa bhāvanāya, kālo upekkhāsambojjhaṅgassa bhāvanāya.", "claims": [{"kind": "timing", "layer": "sutta", "text": "when the mind is restless: right time to develop tranquility"}, {"kind": "timing", "layer": "sutta", "text": "when the mind is restless: right time to develop immersion"}, {"kind": "timing", "layer": "sutta", "text": "when the mind is restless: right time to develop equanimity"}], "eval": ["Q15", "Q18", "Q26"]}, {"id": "sn46.53:13.2", "en": "Why is that?", "pi": "Taṁ kissa hetu?", "claims": [], "eval": []}, {"id": "sn46.53:13.3", "en": "Because it’s easy to settle a restless mind with these things.", "pi": "Uddhataṁ, bhikkhave, cittaṁ taṁ etehi dhammehi suvūpasamayaṁ hoti.", "claims": [{"kind": "timing", "layer": "sutta", "text": "when the mind is restless: right time to develop tranquility"}, {"kind": "timing", "layer": "sutta", "text": "when the mind is restless: right time to develop immersion"}, {"kind": "timing", "layer": "sutta", "text": "when the mind is restless: right time to develop equanimity"}], "eval": []}, {"id": "sn46.53:14.1", "en": "Suppose someone wanted to extinguish a great mass of fire.", "pi": "Seyyathāpi, bhikkhave, puriso mahantaṁ aggikkhandhaṁ nibbāpetukāmo assa.", "claims": [], "eval": []}, {"id": "sn46.53:14.2", "en": "If they toss wet grass, cow-dung, and timber on it, spray it with water, and scatter dirt on it,", "pi": "So tattha allāni ceva tiṇāni pakkhipeyya, allāni ca gomayāni pakkhipeyya, allāni ca kaṭṭhāni pakkhipeyya, udakavātañca dadeyya, paṁsukena ca okireyya;", "claims": [], "eval": []}, {"id": "sn46.53:14.3", "en": "could they extinguish it?”", "pi": "bhabbo nu kho so puriso mahantaṁ aggikkhandhaṁ nibbāpetun”ti?", "claims": [], "eval": []}, {"id": "sn46.53:14.4", "en": "“Yes, sir.”", "pi": "“Evaṁ, bhante”.", "claims": [], "eval": []}, {"id": "sn46.53:15.1", "en": "“In the same way, when the mind is restless, it’s the right time to develop the awakening factors of tranquility, immersion, and equanimity.", "pi": "“Evameva kho, bhikkhave, yasmiṁ samaye uddhataṁ cittaṁ hoti, kālo tasmiṁ samaye passaddhisambojjhaṅgassa bhāvanāya, kālo samādhisambojjhaṅgassa bhāvanāya, kālo upekkhāsambojjhaṅgassa bhāvanāya.", "claims": [], "eval": []}, {"id": "sn46.53:15.2", "en": "Why is that?", "pi": "Taṁ kissa hetu?", "claims": [], "eval": []}, {"id": "sn46.53:15.3", "en": "Because it’s easy to settle a restless mind with these things.", "pi": "Uddhataṁ, bhikkhave, cittaṁ taṁ etehi dhammehi suvūpasamayaṁ hoti.", "claims": [], "eval": []}, {"id": "sn46.53:15.4", "en": "But mindfulness is always useful, I say.”", "pi": "Satiñca khvāhaṁ, bhikkhave, sabbatthikaṁ vadāmī”ti.", "claims": [{"kind": "timing", "layer": "sutta", "text": "always useful mindfulness"}], "eval": ["Q16", "Q26"]}, {"id": "sn46.53:15.5", "en": "", "pi": "Tatiyaṁ.", "claims": [], "eval": []}], "cited": 9}, {"uid": "sn46.54", "title": "SN 46.54 Mettāsahagatasutta — Full of Love", "layer": "Sutta (early discourses)", "coverage": "partly encoded", "review": "not yet reviewed", "encodes": "How each heart's release (by love, compassion, rejoicing, equanimity) is developed: each awakening factor developed accompanied by that quality, with the stock formula (12.1-12.3, 13.1-13.3, 14.1-14.3, 15.1-15.3; the Pali's direction, not the English's, D21). The apex of each, for a wise mendicant who has not penetrated to a higher freedom: the beautiful; the dimension of infinite space; of infinite consciousness; of nothingness (12.8-12.9, 13.6-13.7, 14.6-14.7, 15.9-15.10).", "leftOut": "The narrative frame and the wanderers' challenge (1.1-10.2), including their restatement of the teaching: give up the five hindrances, corruptions of the heart that weaken wisdom, and spread a heart full of love, compassion, rejoicing and equanimity in every direction (3.2-3.5, 4.2-4.6, 8.2-9.5): said by the interlocutors (D17). The Buddha's counter-questions and 'they're out of their element' (11.1-11.9). The five ways of perceiving at will: the repulsive in the unrepulsive, the unrepulsive in the repulsive, and so on, and staying equanimous (12.4-12.8, 13.4-13.5, 14.4-14.5, 15.4-15.8): no pattern yet. The questions also ask each release's destination, fruit and end; only the apex is answered.", "modelledBy": "project owner with Claude (AI assistant), from SuttaCentral's text", "modelledOn": "2026-11-16", "segments": [{"id": "sn46.54:0.1", "en": "Linked Discourses 46.54", "pi": "Saṁyutta Nikāya 46.54", "claims": [], "eval": []}, {"id": "sn46.54:0.2", "en": "6. Discussion", "pi": "6. Sākacchavagga", "claims": [], "eval": []}, {"id": "sn46.54:0.3", "en": "Full of Love", "pi": "Mettāsahagatasutta", "claims": [], "eval": []}, {"id": "sn46.54:1.1", "en": "At one time the Buddha was staying in the land of the Koliyans, where they have a town named Haliddavasana.", "pi": "Ekaṁ samayaṁ bhagavā koliyesu viharati haliddavasanaṁ nāma koliyānaṁ nigamo.", "claims": [], "eval": []}, {"id": "sn46.54:1.2", "en": "Then several mendicants robed up in the morning and, taking their bowls and robes, entered Haliddavasana for alms.", "pi": "Atha kho sambahulā bhikkhū pubbaṇhasamayaṁ nivāsetvā pattacīvaramādāya haliddavasanaṁ piṇḍāya pavisiṁsu.", "claims": [], "eval": []}, {"id": "sn46.54:1.3", "en": "Then it occurred to them,", "pi": "Atha kho tesaṁ bhikkhūnaṁ etadahosi:", "claims": [], "eval": []}, {"id": "sn46.54:1.4", "en": "“It’s too early to wander for alms in Haliddavasana.", "pi": "“atippago kho tāva haliddavasane piṇḍāya carituṁ.", "claims": [], "eval": []}, {"id": "sn46.54:1.5", "en": "Why don’t we visit the monastery for the wanderers of other religions?”", "pi": "Yannūna mayaṁ yena aññatitthiyānaṁ paribbājakānaṁ ārāmo tenupasaṅkameyyāmā”ti.", "claims": [], "eval": []}, {"id": "sn46.54:2.1", "en": "Then they went to the monastery for the wanderers of other religions and exchanged greetings with the wanderers there.", "pi": "Atha kho te bhikkhū yena aññatitthiyānaṁ paribbājakānaṁ ārāmo tenupasaṅkamiṁsu; upasaṅkamitvā tehi aññatitthiyehi paribbājakehi saddhiṁ sammodiṁsu.", "claims": [], "eval": []}, {"id": "sn46.54:2.2", "en": "When the greetings and polite conversation were over, they sat down to one side. The wanderers said to them:", "pi": "Sammodanīyaṁ kathaṁ sāraṇīyaṁ vītisāretvā ekamantaṁ nisīdiṁsu. Ekamantaṁ nisinne kho te bhikkhū aññatitthiyā paribbājakā etadavocuṁ:", "claims": [], "eval": []}, {"id": "sn46.54:3.1", "en": "“Reverends, the ascetic Gotama teaches his disciples like this:", "pi": "“Samaṇo, āvuso, gotamo sāvakānaṁ evaṁ dhammaṁ deseti:", "claims": [], "eval": []}, {"id": "sn46.54:3.2", "en": "‘Come, mendicants, give up these five hindrances, corruptions of the heart that weaken wisdom, and meditate spreading a heart full of love to one direction, and to the second, and to the third, and to the fourth. In the same way above, below, across, everywhere, all around, spread a heart full of love to the whole world—abundant, expansive, limitless, free of enmity and ill will.", "pi": "‘etha tumhe, bhikkhave, pañca nīvaraṇe pahāya cetaso upakkilese paññāya dubbalīkaraṇe mettāsahagatena cetasā ekaṁ disaṁ pharitvā viharatha, tathā dutiyaṁ, tathā tatiyaṁ, tathā catutthaṁ; iti uddhamadho tiriyaṁ sabbadhi sabbattatāya sabbāvantaṁ lokaṁ mettāsahagatena cetasā vipulena mahaggatena appamāṇena averena abyāpajjena pharitvā viharatha.", "claims": [], "eval": ["Q53"]}, {"id": "sn46.54:3.3", "en": "Meditate spreading a heart full of compassion to one direction, and to the second, and to the third, and to the fourth. In the same way above, below, across, everywhere, all around, spread a heart full of compassion to the whole world—abundant, expansive, limitless, free of enmity and ill will.", "pi": "Karuṇāsahagatena cetasā ekaṁ disaṁ pharitvā viharatha, tathā dutiyaṁ, tathā tatiyaṁ, tathā catutthaṁ; iti uddhamadho tiriyaṁ sabbadhi sabbattatāya sabbāvantaṁ lokaṁ karuṇāsahagatena cetasā vipulena mahaggatena appamāṇena averena abyāpajjena pharitvā viharatha.", "claims": [], "eval": []}, {"id": "sn46.54:3.4", "en": "Meditate spreading a heart full of rejoicing to one direction, and to the second, and to the third, and to the fourth. In the same way above, below, across, everywhere, all around, spread a heart full of rejoicing to the whole world—abundant, expansive, limitless, free of enmity and ill will.", "pi": "Muditāsahagatena cetasā ekaṁ disaṁ pharitvā viharatha, tathā dutiyaṁ, tathā tatiyaṁ, tathā catutthaṁ; iti uddhamadho tiriyaṁ sabbadhi sabbattatāya sabbāvantaṁ lokaṁ muditāsahagatena cetasā vipulena mahaggatena appamāṇena averena abyāpajjena pharitvā viharatha.", "claims": [], "eval": []}, {"id": "sn46.54:3.5", "en": "Meditate spreading a heart full of equanimity to one direction, and to the second, and to the third, and to the fourth. In the same way above, below, across, everywhere, all around, they spread a heart full of equanimity to the whole world—abundant, expansive, limitless, free of enmity and ill will.’", "pi": "Upekkhāsahagatena cetasā ekaṁ disaṁ pharitvā viharatha, tathā dutiyaṁ, tathā tatiyaṁ, tathā catutthaṁ; iti uddhamadho tiriyaṁ sabbadhi sabbattatāya sabbāvantaṁ lokaṁ upekkhāsahagatena cetasā vipulena mahaggatena appamāṇena averena abyāpajjena pharitvā viharathā’ti.", "claims": [], "eval": []}, {"id": "sn46.54:4.1", "en": "We too teach our disciples in just the same way.", "pi": "Mayampi kho, āvuso, sāvakānaṁ evaṁ dhammaṁ desema:", "claims": [], "eval": []}, {"id": "sn46.54:4.2", "en": "", "pi": "‘etha tumhe, āvuso, pañca nīvaraṇe pahāya cetaso upakkilese paññāya dubbalīkaraṇe mettāsahagatena cetasā ekaṁ disaṁ pharitvā viharatha …pe…", "claims": [], "eval": []}, {"id": "sn46.54:4.3", "en": "", "pi": "karuṇāsahagatena cetasā …", "claims": [], "eval": []}, {"id": "sn46.54:4.4", "en": "", "pi": "muditāsahagatena cetasā …", "claims": [], "eval": []}, {"id": "sn46.54:4.5", "en": "", "pi": "upekkhāsahagatena cetasā ekaṁ disaṁ pharitvā viharatha, tathā dutiyaṁ, tathā tatiyaṁ, tathā catutthaṁ;", "claims": [], "eval": []}, {"id": "sn46.54:4.6", "en": "", "pi": "iti uddhamadho tiriyaṁ sabbadhi sabbattatāya sabbāvantaṁ lokaṁ upekkhāsahagatena cetasā vipulena mahaggatena appamāṇena averena abyāpajjena pharitvā viharathā’ti.", "claims": [], "eval": []}, {"id": "sn46.54:4.7", "en": "What, then, is the difference between the ascetic Gotama’s teaching and instruction and ours?”", "pi": "Idha no, āvuso, ko viseso, ko adhippayāso, kiṁ nānākaraṇaṁ samaṇassa vā gotamassa amhākaṁ vā, yadidaṁ—dhammadesanāya vā dhammadesanaṁ, anusāsaniyā vā anusāsanin”ti?", "claims": [], "eval": []}, {"id": "sn46.54:5.1", "en": "Those mendicants neither approved nor rejected that statement of the wanderers of other religions.", "pi": "Atha kho te bhikkhū tesaṁ aññatitthiyānaṁ paribbājakānaṁ bhāsitaṁ neva abhinandiṁsu nappaṭikkosiṁsu.", "claims": [], "eval": []}, {"id": "sn46.54:5.2", "en": "They rose from their seats, thinking:", "pi": "Anabhinanditvā appaṭikkositvā uṭṭhāyāsanā pakkamiṁsu:", "claims": [], "eval": []}, {"id": "sn46.54:5.3", "en": "“We will learn the meaning of this statement from the Buddha himself.”", "pi": "“bhagavato santike etassa bhāsitassa atthaṁ ājānissāmā”ti.", "claims": [], "eval": []}, {"id": "sn46.54:5.4", "en": "Then, after the meal, when they returned from almsround, they went up to the Buddha, bowed, sat down to one side, and told him what had happened.", "pi": "Atha kho te bhikkhū haliddavasane piṇḍāya caritvā pacchābhattaṁ piṇḍapātapaṭikkantā yena bhagavā tenupasaṅkamiṁsu; upasaṅkamitvā bhagavantaṁ abhivādetvā ekamantaṁ nisīdiṁsu. Ekamantaṁ nisinnā kho te bhikkhū bhagavantaṁ etadavocuṁ:", "claims": [], "eval": []}, {"id": "sn46.54:6.1", "en": "", "pi": "“Idha mayaṁ, bhante, pubbaṇhasamayaṁ nivāsetvā pattacīvaramādāya haliddavasane piṇḍāya pavisimha.", "claims": [], "eval": []}, {"id": "sn46.54:6.2", "en": "", "pi": "Tesaṁ no, bhante, amhākaṁ etadahosi:", "claims": [], "eval": []}, {"id": "sn46.54:6.3", "en": "", "pi": "‘atippago kho tāva haliddavasane piṇḍāya carituṁ.", "claims": [], "eval": []}, {"id": "sn46.54:7.1", "en": "", "pi": "Yannūna mayaṁ yena aññatitthiyānaṁ paribbājakānaṁ ārāmo tenupasaṅkameyyāmā’ti. Atha kho mayaṁ, bhante, yena aññatitthiyānaṁ paribbājakānaṁ ārāmo tenupasaṅkamimha, upasaṅkamitvā tehi aññatitthiyehi paribbājakehi saddhiṁ sammodimha.", "claims": [], "eval": []}, {"id": "sn46.54:7.2", "en": "", "pi": "Sammodanīyaṁ kathaṁ sāraṇīyaṁ vītisāretvā ekamantaṁ nisīdimha. Ekamantaṁ nisinne kho amhe, bhante, te aññatitthiyā paribbājakā etadavocuṁ:", "claims": [], "eval": []}, {"id": "sn46.54:8.1", "en": "", "pi": "‘Samaṇo, āvuso, gotamo sāvakānaṁ evaṁ dhammaṁ deseti:", "claims": [], "eval": []}, {"id": "sn46.54:8.2", "en": "", "pi": "“etha tumhe, bhikkhave, pañca nīvaraṇe pahāya cetaso upakkilese paññāya dubbalīkaraṇe mettāsahagatena cetasā ekaṁ disaṁ pharitvā viharatha …pe…", "claims": [], "eval": []}, {"id": "sn46.54:8.3", "en": "", "pi": "karuṇāsahagatena cetasā …pe…", "claims": [], "eval": []}, {"id": "sn46.54:8.4", "en": "", "pi": "muditāsahagatena cetasā …pe…", "claims": [], "eval": []}, {"id": "sn46.54:8.5", "en": "", "pi": "upekkhāsahagatena cetasā ekaṁ disaṁ pharitvā viharatha, tathā dutiyaṁ, tathā tatiyaṁ, tathā catutthaṁ; iti uddhamadho tiriyaṁ sabbadhi sabbattatāya s are a cause and reason for knowing and seeing (5.3-6.4); the stock formula (5.3, 6.2).", "leftOut": "The framing: Prince Abhaya reports Pūraṇa Kassapa's view that knowing and not knowing have no cause (1.4-1.9). (The Buddha's reply, 1.10-1.13, that both have causes and reasons, is encoded; corrected 2026-11-15.) The naming 'these are called the hindrances / awakening factors' (4.2, 7.2). Prince Abhaya's responses, including 'overcome by even a single hindrance you wouldn't truly know or see' and 'endowed with even a single awakening factor you would' (4.3-4.5, 7.3-7.6): said by the interlocutor, not taught, so not encoded (D17).", "modelledBy": "project owner with Claude (AI assistant), from SuttaCentral's text", "modelledOn": "2026-11-14", "segments": [{"id": "sn46.56:0.1", "en": "Linked Discourses 46.56", "pi": "Saṁyutta Nikāya 46.56", "claims": [], "eval": []}, {"id": "sn46.56:0.2", "en": "6. Discussion", "pi": "6. Sākacchavagga", "claims": [], "eval": []}, {"id": "sn46.56:0.3", "en": "With Prince Abhaya", "pi": "Abhayasutta", "claims": [], "eval": []}, {"id": "sn46.56:1.1", "en": "So I have heard.", "pi": "Evaṁ me sutaṁ—", "claims": [], "eval": []}, {"id": "sn46.56:1.2", "en": "At one time the Buddha was staying near Rājagaha, on the Vulture’s Peak Mountain.", "pi": "ekaṁ samayaṁ bhagavā rājagahe viharati gijjhakūṭe pabbate.", "claims": [], "eval": []}, {"id": "sn46.56:1.3", "en": "Then Prince Abhaya went up to the Buddha, bowed, sat down to one side, and said to him:", "pi": "Atha kho abhayo rājakumāro yena bhagavā tenupasaṅkami; upasaṅkamitvā bhagavantaṁ abhivādetvā ekamantaṁ nisīdi. Ekamantaṁ nisinno kho abhayo rājakumāro bhagavantaṁ etadavoca:", "claims": [], "eval": []}, {"id": "sn46.56:1.4", "en": "“Sir, Pūraṇa Kassapa says this:", "pi": "“pūraṇo, bhante, kassapo evamāha:", "claims": [], "eval": []}, {"id": "sn46.56:1.5", "en": "‘There is no cause or reason for not knowing and not seeing.", "pi": "‘natthi hetu, natthi paccayo aññāṇāya adassanāya.", "claims": [], "eval": []}, {"id": "sn46.56:1.6", "en": "Not knowing and not seeing have no cause or reason.", "pi": "Ahetu, appaccayo aññāṇaṁ adassanaṁ hoti.", "claims": [], "eval": []}, {"id": "sn46.56:1.7", "en": "There is no cause or reason for knowing and seeing.", "pi": "Natthi hetu, natthi paccayo ñāṇāya dassanāya.", "claims": [], "eval": []}, {"id": "sn46.56:1.8", "en": "Knowing and seeing have no cause or reason.’", "pi": "Ahetu, appaccayo ñāṇaṁ dassanaṁ hotī’ti.", "claims": [], "eval": []}, {"id": "sn46.56:1.9", "en": "What does the Buddha say about this?”", "pi": "Idha bhagavā kimāhā”ti?", "claims": [], "eval": []}, {"id": "sn46.56:1.10", "en": "“Prince, there are causes and reasons for not knowing and not seeing.", "pi": "“Atthi, rājakumāra, hetu, atthi paccayo aññāṇāya adassanāya.", "claims": [{"kind": "condition", "layer": "sutta", "text": "the five hindrances is a cause and reason for not knowing and not seeing (“a cause and reason for not knowing and not seeing”)"}], "eval": []}, {"id": "sn46.56:1.11", "en": "Not knowing and not seeing have causes and reasons.", "pi": "Sahetu, sappaccayo aññāṇaṁ adassanaṁ hoti.", "claims": [{"kind": "condition", "layer": "sutta", "text": "the five hindrances is a cause and reason for not knowing and not seeing (“a cause and reason for not knowing and not seeing”)"}], "eval": []}, {"id": "sn46.56:1.12", "en": "There are causes and reasons for knowing and seeing.", "pi": "Atthi, rājakumāra, hetu, atthi paccayo ñāṇāya dassanāya.", "claims": [{"kind": "condition", "layer": "sutta", "text": "the seven awakening factors is a cause and reason for knowing and seeing (“a cause and reason for knowing and seeing”)"}], "eval": []}, {"id": "sn46.56:1.13", "en": "Knowing and seeing have causes and reasons.”", "pi": "Sahetu, sappaccayo ñāṇaṁ dassanaṁ hotī”ti.", "claims": [{"kind": "condition", "layer": "sutta", "text": "the seven awakening factors is a cause and reason for knowing and seeing (“a cause and reason for knowing and seeing”)"}], "eval": []}, {"id": "sn46.56:2.1", "en": "“But sir, what is the cause and reason for not knowing and not seeing?", "pi": "“Katamo pana, bhante, hetu, katamo paccayo aññāṇāya adassanāya?", "claims": [], "eval": []}, {"id": "sn46.56:2.2", "en": "How do not knowing and not seeing have causes and reasons?”", "pi": "Kathaṁ sahetu, sappaccayo aññāṇaṁ adassanaṁ hotī”ti?", "claims": [], "eval": []}, {"id": "sn46.56:2.3", "en": "“There’s a time when the heart is overcome and mired in sensual desire, without truly knowing and seeing the escape from sensual desire that has arisen.", "pi": "“Yasmiṁ kho, rājakumāra, samaye kāmarāgapariyuṭṭhitena cetasā viharati kāmarāgaparetena, uppannassa ca kāmarāgassa nissaraṇaṁ yathābhūtaṁ na jānāti na passati—", "claims": [{"kind": "condition", "layer": "sutta", "text": "the five hindrances is a cause and reason for not knowing and not seeing (“a cause and reason for not knowing and not seeing”)"}], "eval": []}, {"id": "sn46.56:2.4", "en": "This is a cause and reason for not knowing and not seeing.", "pi": "ayampi kho, rājakumāra, hetu, ayaṁ paccayo aññāṇāya adassanāya.", "claims": [{"kind": "condition", "layer": "sutta", "text": "the five hindrances is a cause and reason for not knowing and not seeing (“a cause and reason for not knowing and not seeing”)"}], "eval": ["Q44"]}, {"id": "sn46.56:2.5", "en": "And this is how not knowing and not seeing have causes and reasons.", "pi": "Evampi sahetu sappaccayo aññāṇaṁ adassanaṁ hoti.", "claims": [], "eval": []}, {"id": "sn46.56:3.1", "en": "Furthermore, there’s a time when the heart is overcome and mired in ill will …", "pi": "Puna caparaṁ, rājakumāra, yasmiṁ samaye byāpādapariyuṭṭhitena cetasā viharati byāpādaparetena …pe…", "claims": [], "eval": []}, {"id": "sn46.56:3.2", "en": "dullness and drowsiness …", "pi": "thinamiddhapariyuṭṭhitena …pe…", "claims": [], "eval": []}, {"id": "sn46.56:3.3", "en": "restlessness and remorse …", "pi": "uddhaccakukkuccapariyuṭṭhitena …pe…", "claims": [], "eval": []}, {"id": "sn46.56:3.4", "en": "doubt, without truly knowing and seeing the escape from doubt that has arisen.", "pi": "vicikicchāpariyuṭṭhitena cetasā viharati vicikicchāparetena, uppannāya ca vicikicchāya nissaraṇaṁ yathābhūtaṁ na jānāti na passati—", "claims": [{"kind": "condition", "layer": "sutta", "text": "the five hindrances is a cause and reason for not knowing and not seeing (“a cause and reason for not knowing and not seeing”)"}], "eval": []}, {"id": "sn46.56:3.5", "en": "This is a cause and reason for not knowing and not seeing.", "pi": "ayampi kho, rājakumāra, hetu, ayaṁ paccayo aññāṇāya adassanāya.", "claims": [{"kind": "condition", "layer": "sutta", "text": "the five hindrances is a cause and reason for not knowing and not seeing (“a cause and reason for not knowing and not seeing”)"}], "eval": []}, {"id": "sn46.56:3.6", "en": "And this is how not knowing and not seeing have causes and reasons.”", "pi": "Evampi sahetu sappaccayo aññāṇaṁ adassanaṁ hotī”ti.", "claims": [], "eval": []}, {"id": "sn46.56:4.1", "en": "“Sir, what is the name of this exposition of the teaching?”", "pi": "“Ko nāmāyaṁ, bhante, dhammapariyāyo”ti?", "claims": [], "eval": []}, {"id": "sn46.56:4.2", "en": "“These are called the ‘hindrances’, prince.”", "pi": "“Nīvaraṇā nāmete, rājakumārā”ti.", "claims": [], "eval": []}, {"id": "sn46.56:4.3", "en": "“Indeed, Blessed One, these are hindrances!", "pi": "“Taggha, bhagavā, nīvaraṇā;", "claims": [], "eval": ["Q44"]}, {"id": "sn46.56:4.4", "en": "Indeed, Holy One, these are hindrances!", "pi": "taggha, sugata, nīvaraṇā.", "claims": [], "eval": []}, {"id": "sn46.56:4.5", "en": "Overcome by even a single hindrance you wouldn’t truly know or see, let alone all five hindrances.", "pi": "Ekamekenapi kho, bhante, nīvaraṇena abhibhūto yathābhūtaṁ na jāneyya na passeyya, ko pana vādo pañcahi nīvaraṇehi?", "claims": [], "eval": ["Q44"]}, {"id": "sn46.56:5.1", "en": "But sir, what is the cause and reason for knowing and seeing?", "pi": "Kata
