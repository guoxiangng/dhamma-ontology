[], "eval": []}, {"id": "mn43:1.1", "en": "So I have heard.", "pi": "Evaṁ me sutaṁ—", "claims": [], "eval": []}, {"id": "mn43:1.2", "en": "At one time the Buddha was staying near Sāvatthī in Jeta’s Grove, Anāthapiṇḍika’s monastery.", "pi": "ekaṁ samayaṁ bhagavā sāvatthiyaṁ viharati jetavane anāthapiṇḍikassa ārāme.", "claims": [], "eval": []}, {"id": "mn43:1.3", "en": "Then in the late afternoon, Venerable Mahākoṭṭhita came out of retreat, went to Venerable Sāriputta, and exchanged greetings with him.", "pi": "Atha kho āyasmā mahākoṭṭhiko sāyanhasamayaṁ paṭisallānā vuṭṭhito yenāyasmā sāriputto tenupasaṅkami; upasaṅkamitvā āyasmatā sāriputtena saddhiṁ sammodi.", "claims": [], "eval": []}, {"id": "mn43:1.4", "en": "When the greetings and polite conversation were over, he sat down to one side and said to Sāriputta:", "pi": "Sammodanīyaṁ kathaṁ sāraṇīyaṁ vītisāretvā ekamantaṁ nisīdi. Ekamantaṁ nisinno kho āyasmā mahākoṭṭhiko āyasmantaṁ sāriputtaṁ etadavoca:", "claims": [], "eval": []}, {"id": "mn43:2.1", "en": "“Reverend, they speak of ‘a witless person’.", "pi": "“‘Duppañño duppañño’ti, āvuso, vuccati.", "claims": [], "eval": []}, {"id": "mn43:2.2", "en": "How is a witless person defined?”", "pi": "Kittāvatā nu kho, āvuso, duppaññoti vuccatī”ti?", "claims": [], "eval": []}, {"id": "mn43:2.3", "en": "“Reverend, they’re called witless because they don’t understand.", "pi": "“‘Nappajānāti nappajānātī’ti kho, āvuso, tasmā duppaññoti vuccati.", "claims": [], "eval": []}, {"id": "mn43:2.4", "en": "And what don’t they understand?", "pi": "Kiñca nappajānāti?", "claims": [], "eval": []}, {"id": "mn43:2.5", "en": "They don’t understand: ‘This is suffering’ … ‘This is the origin of suffering’ … ‘This is the cessation of suffering’ … ‘This is the practice that leads to the cessation of suffering.’", "pi": "‘Idaṁ dukkhan’ti nappajānāti, ‘ayaṁ dukkhasamudayo’ti nappajānāti, ‘ayaṁ dukkhanirodho’ti nappajānāti, ‘ayaṁ dukkhanirodhagāminī paṭipadā’ti nappajānāti.", "claims": [], "eval": []}, {"id": "mn43:2.6", "en": "They’re called witless because they don’t understand.”", "pi": "‘Nappajānāti nappajānātī’ti kho, āvuso, tasmā duppaññoti vuccatī”ti.", "claims": [], "eval": []}, {"id": "mn43:2.7", "en": "Saying “Good, reverend,” Mahākoṭṭhita approved and agreed with what Sāriputta said. Then he asked another question:", "pi": "“Sādhāvuso”ti kho āyasmā mahākoṭṭhiko āyasmato sāriputtassa bhāsitaṁ abhinanditvā anumoditvā āyasmantaṁ sāriputtaṁ uttariṁ pañhaṁ apucchi:", "claims": [], "eval": []}, {"id": "mn43:3.1", "en": "“They speak of ‘a wise person’.", "pi": "“‘Paññavā paññavā’ti, āvuso, vuccati.", "claims": [], "eval": []}, {"id": "mn43:3.2", "en": "How is a wise person defined?”", "pi": "Kittāvatā nu kho, āvuso, paññavāti vuccatī”ti?", "claims": [], "eval": []}, {"id": "mn43:3.3", "en": "“They’re called wise because they understand.", "pi": "“‘Pajānāti pajānātī’ti kho, āvuso, tasmā paññavāti vuccati.", "claims": [], "eval": []}, {"id": "mn43:3.4", "en": "And what do they understand?", "pi": "Kiñca pajānāti?", "claims": [], "eval": []}, {"id": "mn43:3.5", "en": "They understand: ‘This is suffering’ … ‘This is the origin of suffering’ … ‘This is the cessation of suffering’ … ‘This is the practice that leads to the cessation of suffering.’", "pi": "‘Idaṁ dukkhan’ti pajānāti, ‘ayaṁ dukkhasamudayo’ti pajānāti, ‘ayaṁ dukkhanirodho’ti pajānāti, ‘ayaṁ dukkhanirodhagāminī paṭipadā’ti pajānāti.", "claims": [], "eval": []}, {"id": "mn43:3.6", "en": "They’re called wise because they understand.”", "pi": "‘Pajānāti pajānātī’ti kho, āvuso, tasmā paññavāti vuccatī”ti.", "claims": [], "eval": []}, {"id": "mn43:4.1", "en": "“They speak of ‘consciousness’.", "pi": "“‘Viññāṇaṁ viññāṇan’ti, āvuso, vuccati.", "claims": [], "eval": []}, {"id": "mn43:4.2", "en": "How is consciousness defined?”", "pi": "Kittāvatā nu kho, āvuso, viññāṇanti vuccatī”ti?", "claims": [], "eval": []}, {"id": "mn43:4.3", "en": "“It’s called consciousness because it cognizes.", "pi": "“‘Vijānāti vijānātī’ti kho, āvuso, tasmā viññāṇanti vuccati.", "claims": [], "eval": []}, {"id": "mn43:4.4", "en": "And what does it cognize?", "pi": "Kiñca vijānāti?", "claims": [], "eval": []}, {"id": "mn43:4.5", "en": "It cognizes ‘pleasure’ and ‘pain’ and ‘neutral’.", "pi": "Sukhantipi vijānāti, dukkhantipi vijānāti, adukkhamasukhantipi vijānāti.", "claims": [], "eval": []}, {"id": "mn43:4.6", "en": "It’s called consciousness because it cognizes.”", "pi": "‘Vijānāti vijānātī’ti kho, āvuso, tasmā viññāṇanti vuccatī”ti.", "claims": [], "eval": []}, {"id": "mn43:5.1", "en": "“Wisdom and consciousness—", "pi": "“Yā cāvuso, paññā yañca viññāṇaṁ—", "claims": [], "eval": []}, {"id": "mn43:5.2", "en": "are these things mixed or separate?", "pi": "ime dhammā saṁsaṭṭhā udāhu visaṁsaṭṭhā?", "claims": [], "eval": []}, {"id": "mn43:5.3", "en": "And can we completely disentangle them so as to describe the difference between them?”", "pi": "Labbhā ca panimesaṁ dhammānaṁ vinibbhujitvā vinibbhujitvā nānākaraṇaṁ paññāpetun”ti?", "claims": [], "eval": []}, {"id": "mn43:5.4", "en": "“Wisdom and consciousness—", "pi": "“Yā cāvuso, paññā yañca viññāṇaṁ—", "claims": [], "eval": []}, {"id": "mn43:5.5", "en": "these things are mixed, not separate.", "pi": "ime dhammā saṁsaṭṭhā, no visaṁsaṭṭhā.", "claims": [], "eval": []}, {"id": "mn43:5.6", "en": "And you can never completely disentangle them so as to describe the difference between them.", "pi": "Na ca labbhā imesaṁ dhammānaṁ vinibbhujitvā vinibbhujitvā nānākaraṇaṁ paññāpetuṁ.", "claims": [], "eval": []}, {"id": "mn43:5.7", "en": "For you understand what you cognize, and you cognize what you understand.", "pi": "Yaṁ hāvuso, pajānāti taṁ vijānāti, yaṁ vijānāti taṁ pajānāti.", "claims": [], "eval": []}, {"id": "mn43:5.8", "en": "That’s why these things are mixed, not separate.", "pi": "Tasmā ime dhammā saṁsaṭṭhā, no visaṁsaṭṭhā.", "claims": [], "eval": []}, {"id": "mn43:5.9", "en": "And you can never completely disentangle them so as to describe the difference between them.”", "pi": "Na ca labbhā imesaṁ dhammānaṁ vinibbhujitvā vinibbhujitvā nānākaraṇaṁ paññāpetun”ti.", "claims": [], "eval": []}, {"id": "mn43:6.1", "en": "“Wisdom and consciousness—", "pi": "“Yā cāvuso, paññā yañca viññāṇaṁ—", "claims": [], "eval": []}, {"id": "mn43:6.2", "en": "what is the difference between these things that are mixed, not separate?”", "pi": "imesaṁ dhammānaṁ saṁsaṭṭhānaṁ no visaṁsaṭṭhānaṁ kiṁ nānākaraṇan”ti?", "claims": [], "eval": []}, {"id": "mn43:6.3", "en": "", "pi": "“Yā cāvuso, paññā yañca viññāṇaṁ—", "claims": [], "eval": []}, {"id": "mn43:6.4", "en": "“The difference between these things is that wisdom should be developed, while consciousness should be completely understood.”", "pi": "imesaṁ dhammānaṁ saṁsaṭṭhānaṁ no visaṁsaṭṭhānaṁ paññā bhāvetabbā, viññāṇaṁ pariññeyyaṁ.", "claims": [], "eval": []}, {"id": "mn43:6.5", "en": "", "pi": "Idaṁ nesaṁ nānākaraṇan”ti.", "claims": [], "eval": []}, {"id": "mn43:7.1", "en": "“They speak of this thing called ‘feeling’.", "pi": "“‘Vedanā vedanā’ti, āvuso, vuccati.", "claims": [], "eval": []}, {"id": "mn43:7.2", "en": "How is feeling defined?”", "pi": "Kittāvatā nu kho, āvuso, vedanāti vuccatī”ti?", "claims": [], "eval": []}, {"id": "mn43:7.3", "en": "“It’s called feeling because it feels.", "pi": "“‘Vedeti vedetī’ti kho, āvuso, tasmā vedanāti vuccati.", "claims": [], "eval": []}, {"id": "mn43:7.4", "en": "And what does it feel?", "pi": "Kiñca vedeti?", "claims": [], "eval": []}, {"id": "mn43:7.5", "en": "It feels pleasure, pain, and neutral.", "pi": "Sukhampi vedeti, dukkhampi vedeti, adukkhamasukhampi vedeti.", "claims": [], "eval": []}, {"id": "mn43:7.6", "en": "It’s called feeling because it feels.”", "pi": "‘Vedeti vedetī’ti kho, āvuso, tasmā vedanāti vuccatī”ti.", "claims": [], "eval": []}, {"id": "mn43:8.1", "en": "“They speak of this thing called ‘perception’.", "pi": "“‘Saññā saññā’ti, āvuso, vuccati.", "claims": [], "eval": []}, {"id": "mn43:8.2", "en": "How is perception defined?”", "pi": "Kittāvatā nu kho, āvuso, saññāti vuccatī”ti?", "claims": [], "eval": []}, {"id": "mn43:8.3", "en": "“It’s called perception because it perceives.", "pi": "“‘Sañjānāti sañjānātī’ti kho, āvuso, tasmā saññāti vuccati.", "claims": [], "eval": []}, {"id": "mn43:8.4", "en": "And what does it perceive?", "pi": "Kiñca sañjānāti?", "claims": [], "eval": []}, {"id": "mn43:8.5", "en": "It perceives blue, yellow, red, and white.", "pi": "Nīlakampi sañjānāti, pītakampi sañjānāti, lohitakampi sañjānāti, odātampi sañjānāti.", "claims": [], "eval": []}, {"id": "mn43:8.6", "en": "It’s called perception because it perceives.”", "pi": "‘Sañjānāti sañjānātī’ti kho, āvuso, tasmā saññāti vuccatī”ti.", "claims": [], "eval": []}, {"id": "mn43:9.1", "en": "“Feeling, perception, and consciousness—", "pi": "“Yā cāvuso, vedanā yā ca saññā yañca viññāṇaṁ—", "claims": [], "eval": []}, {"id": "mn43:9.2", "en": "are these things mixed or separate?", "pi": "ime dhammā saṁsaṭṭhā udāhu visaṁsaṭṭhā?", "claims": [], "eval": []}, {"id": "mn43:9.3", "en": "And can we completely disentangle them so as to describe the difference between them?”", "pi": "Labbhā ca panimesaṁ dhammānaṁ vinibbhujitvā vinibbhujitvā nānākaraṇaṁ paññāpetun”ti?", "claims": [], "eval": []}, {"id": "mn43:9.4", "en": "“Feeling, perception, and consciousness—", "pi": "“Yā cāvuso, vedanā yā ca saññā yañca viññāṇaṁ—", "claims": [], "eval": []}, {"id": "mn43:9.5", "en": "these things are mixed, not separate.", "pi": "ime dhammā saṁsaṭṭhā, no visaṁsaṭṭhā.", "claims": [], "eval": []}, {"id": "mn43:9.6", "en": "And you can never completely disentangle them so as to describe the difference between them.", "pi": "Na ca labbhā imesaṁ dhammānaṁ vinibbhujitvā vinibbhujitvā nānākaraṇaṁ paññāpetuṁ.", "claims": [], "eval": []}, {"id": "mn43:9.7", "en": "For you perceive what you feel, and you cognize what you perceive.", "pi": "Yaṁ hāvuso, vedeti taṁ sañjānāti, yaṁ sañjānāti taṁ vijānāti.", "claims": [], "eval": []}, {"id": "mn43:9.8", "en": "That’s why these things are mixed, not separate.", "pi": "Tasmā ime dhammā saṁsaṭṭhā no visaṁsaṭṭhā.", "claims": [], "eval": []}, {"id": "mn43:9.9", "en": "And you can never completely disentangle them so as to describe the difference between them.”", "pi": "Na ca labbhā imesaṁ dhammānaṁ vinibbhujitvā vinibbhujitvā nānākaraṇaṁ paññāpetun”ti.", "claims": [], "eval": []}, {"id": "mn43:10.1", "en": "“What can be known by purified mind consciousness released from the five senses?”", "pi": "“Nissaṭṭhena hāvuso, pañcahi indriyehi parisuddhena manoviññāṇena kiṁ neyyan”ti?", "claims": [], "eval": []}, {"id": "mn43:10.2", "en": "“Aware that ‘space is infinite’ it can know the dimension of infinite space. Aware that ‘consciousness is infinite’ it can know the dimension of infinite consciousness. Aware that ‘there is nothing at all’ it can know the dimension of nothingness.”", "pi": "“Nissaṭṭhena, āvuso, pañcahi indriyehi parisuddhena manoviññāṇena ‘ananto ākāso’ti ākāsānañcāyatanaṁ neyyaṁ, ‘anantaṁ viññāṇan’ti viññāṇañcāyatanaṁ neyyaṁ, ‘natthi kiñcī’ti ākiñcaññāyatanaṁ neyyan”ti.", "claims": [], "eval": []}, {"id": "mn43:11.1", "en": "“How do you understand something that can be known?”", "pi": "“Neyyaṁ panāvuso, dhammaṁ kena pajānātī”ti?", "claims": [], "eval": []}, {"id": "mn43:11.2", "en": "“You understand something that can be known with the eye of wisdom.”", "pi": "“Neyyaṁ kho, āvuso, dhammaṁ paññācakkhunā pajānātī”ti.", "claims": [], "eval": []}, {"id": "mn43:12.1", "en": "“What is the goal of wisdom?”", "pi": "“Paññā panāvuso, kimatthiyā”ti?", "claims": [], "eval": []}, {"id": "mn43:12.2", "en": "“The goal of wisdom is direct knowledge, complete understanding, and giving up.”", "pi": "“Paññā kho, āvuso, abhiññatthā pariññatthā pahānatthā”ti.", "claims": [], "eval": []}, {"id": "mn43:13.1", "en": "“How many conditions are there for the arising of right view?”", "pi": "“Kati panāvuso, paccayā sammādiṭṭhiyā uppādāyā”ti?", "claims": [], "eval": []}, {"id": "mn43:13.2", "en": "“There are two conditions for the arising of right view:", "pi": "“Dve kho, āvuso, paccayā sammādiṭṭhiyā uppādāya—", "claims": [], "eval": []}, {"id": "mn43:13.3", "en": "the voice of another and rational application of mind.", "pi": "parato ca ghoso, yoniso ca manasikāro.", "claims": [], "eval": []}, {"id": "mn43:13.4", "en": "These are the two conditions for the arising of right view.”", "pi": "Ime kho, āvuso, dve paccayā sammādiṭṭhiyā uppādāyā”ti.", "claims": [], "eval": []}, {"id": "mn43:14.1", "en": "“When right view is supported by how many factors does it have freedom of heart and freedom by wisdom as its fruit and benefit?”", "pi": "“Katihi panāvuso, aṅgehi anuggahitā sammādiṭṭhi cetovimuttiphalā ca hoti cetovimuttiphalānisaṁsā ca, paññāvimuttiphalā ca hoti paññāvimuttiphalānisaṁsā cā”ti?", "claims": [], "eval": []}, {"id": "mn43:14.2", "en": "“When right view is supported by five factors it has freedom of heart and freedom by wisdom as its fruit and benefit.", "pi": "“Pañcahi kho, āvuso, aṅgehi anuggahitā sammādiṭṭhi cetovimuttiphalā ca hoti cetovimuttiphalānisaṁsā ca, paññāvimuttiphalā ca hoti paññāvimuttiphalānisaṁsā ca.", "claims": [], "eval": []}, {"id": "mn43:14.3", "en": "It’s when right view is supported by ethics, learning, discussion, serenity, and discernment.", "pi": "Idhāvuso, sammādiṭṭhi sīlānuggahitā ca hoti, sutānuggahitā ca hoti, sākacchānuggahitā ca hoti, samathānuggahitā ca hoti, vipassanānuggahitā ca hoti.", "claims": [], "eval": []}, {"id": "mn43:14.4", "en": "When right view is supported by these five factors it has freedom of heart and freedom by wisdom as its fruit and benefit.”", "pi": "Imehi kho, āvuso, pañcahaṅgehi anuggahitā sammādiṭṭhi cetovimuttiphalā ca hoti cetovimuttiphalānisaṁsā ca, paññāvimuttiphalā ca hoti paññāvimuttiphalānisaṁsā cā”ti.", "claims": [], "eval": []}, {"id": "mn43:15.1", "en": "“How many states of existence are there?”", "pi": "“Kati panāvuso, bhavā”ti?", "claims": [], "eval": []}, {"id": "mn43:15.2", "en": "“Reverend, there are these three states of existence.", "pi": "“Tayome, āvuso, bhavā—", "claims": [], "eval": []}, {"id": "mn43:15.3", "en": "Existence in the sensual realm, the realm of luminous form, and the formless realm.”", "pi": "kāmabhavo, rūpabhavo, arūpabhavo”ti.", "claims": [], "eval": []}, {"id": "mn43:16.1", "en": "“But how is there regeneration into a new state of existence in the future?”", "pi": "“Kathaṁ panāvuso, āyatiṁ punabbhavābhinibbatti hotī”ti?", "claims": [], "eval": []}, {"id": "mn43:16.2", "en": "“It’s because of sentient beings—shrouded by ignorance and fettered by craving—taking pleasure wherever they land.", "pi": "“Avijjānīvaraṇānaṁ kho, āvuso, sattānaṁ taṇhāsaṁyojanānaṁ tatratatrābhinandanā—", "claims": [], "eval": []}, {"id": "mn43:16.3", "en": "That’s how there is regeneration into a new state of existence in the future.”", "pi": "evaṁ āyatiṁ punabbhavābhinibbatti hotī”ti.", "claims": [], "eval": []}, {"id": "mn43:17.1", "en": "“But how is there no regeneration into a new state of existence in the future?”", "pi": "“Kathaṁ panāvuso, āyatiṁ punabbhavābhinibbatti na hotī”ti?", "claims": [], "eval": []}, {"id": "mn43:17.2", "en": "“It’s when ignorance fades away, knowledge arises, and craving ceases.", "pi": "“Avijjāvirāgā kho, āvuso, vijjuppādā taṇhānirodhā—", "claims": [], "eval": []}, {"id": "mn43:17.3", "en": "That’s how there is no regeneration into a new state of existence in the future.”", "pi": "evaṁ āyatiṁ punabbhavābhinibbatti na hotī”ti.", "claims": [], "eval": []}, {"id": "mn43:18.1", "en": "“But what, reverend, is the first absorption?”", "pi": "“Katamaṁ panāvuso, paṭhamaṁ jhānan”ti?", "claims": [], "eval": []}, {"id": "mn43:18.2", "en": "“Reverend, it’s when a mendicant, quite secluded from sensual pleasures, secluded from unskillful qualities, enters and remains in the first absorption, which has the rapture and bliss born of seclusion, while placing the mind and keeping it connected.", "pi": "“Idhāvuso, bhikkhu vivicceva kāmehi vivicca akusalehi dhammehi savitakkaṁ savicāraṁ vivekajaṁ pītisukhaṁ paṭhamaṁ jhānaṁ upasampajja viharati—", "claims": [], "eval": []}, {"id": "mn43:18.3", "en": "This is called the first absorption.”", "pi": "idaṁ vuccati, āvuso, paṭhamaṁ jhānan”ti.", "claims": [], "eval": []}, {"id": "mn43:19.1", "en": "“But how many factors does the first absorption have?”", "pi": "“Paṭhamaṁ panāvuso, jhānaṁ katiaṅgikan”ti?", "claims": [], "eval": []}, {"id": "mn43:19.2", "en": "“The first absorption has five factors.", "pi": "“Paṭhamaṁ kho, āvuso, jhānaṁ pañcaṅgikaṁ.", "claims": [{"kind": "list", "layer": "sutta", "text": "the five factors of the first absorption (5): bliss, keeping it connected, placing the mind, rapture, unification of mind"}], "eval": ["Q12"]}, {"id": "mn43:19.3", "en": "When a mendicant has entered the first absorption, placing the mind, keeping it connected, rapture, bliss, and unification of mind are present.", "pi": "Idhāvuso, paṭhamaṁ jhānaṁ samāpannassa bhikkhuno vitakko ca vattati, vicāro ca pīti ca sukhañca cittekaggatā ca.", "claims": [{"kind": "list", "layer": "sutta", "text": "the five factors of the first absorption (5): bliss, keeping it connected, placing the mind, rapture, unification of mind"}], "eval": ["Q12", "Q23"]}, {"id": "mn43:19.4", "en": "That’s how the first absorption has five factors.”", "pi": "Paṭhamaṁ kho, āvuso, jhānaṁ evaṁ pañcaṅgikan”ti.", "claims": [], "eval": []}, {"id": "mn43:20.1", "en": "“But how many factors has the first absorption given up and how many does it possess?”", "pi": "“Paṭhamaṁ panāvuso, jhānaṁ kataṅgavippahīnaṁ kataṅgasamannāgatan”ti?", "claims": [], "eval": []}, {"id": "mn43:20.2", "en": "“The first absorption has given up five factors and possesses five factors.", "pi": "“Paṭhamaṁ kho, āvuso, jhānaṁ pañcaṅgavippahīnaṁ, pañcaṅgasamannāgataṁ.", "claims": [{"kind": "attainment", "layer": "sutta", "text": "first absorption gives up the five hindrances, has the five factors of the first absorption"}], "eval": ["Q13", "Q21"]}, {"id": "mn43:20.3", "en": "When a mendicant has entered the first absorption, sensual desire, ill will, dullness and drowsiness, restlessness and remorse, and doubt are given up.", "pi": "Idhāvuso, paṭhamaṁ jhānaṁ samāpannassa bhikkhuno kāmacchando pahīno hoti, byāpādo pahīno hoti, thinamiddhaṁ pahīnaṁ hoti, uddhaccakukkuccaṁ pahīnaṁ hoti, vicikicchā pahīnā hoti;", "claims": [{"kind": "list", "layer": "sutta", "text": "the five hindrances (5): doubt, dullness and drowsiness, ill will, restlessness and remorse, sensual desire"}, {"kind": "attainment", "layer": "sutta", "text": "first absorption gives up the five hindrances, has the five factors of the first absorption"}], "eval": ["Q13", "Q21"]}, {"id": "mn43:20.4", "en": "Placing the mind, keeping it connected, rapture, bliss, and unification of mind are present.", "pi": "vitakko ca vattati, vicāro ca pīti ca sukhañca cittekaggatā ca.", "claims": [{"kind": "attainment", "layer": "sutta", "text": "first absorption gives up the five hindrances, has the five factors of the first absorption"}], "eval": ["Q21"]}, {"id": "mn43:20.5", "en": "That’s how the first absorption has given up five factors and possesses five factors.”", "pi": "Paṭhamaṁ kho, āvuso, jhānaṁ evaṁ pañcaṅgavippahīnaṁ pañcaṅgasamannāgatan”ti.", "claims": [], "eval": []}, {"id": "mn43:21.1", "en": "“Reverend, these five faculties have different domains and different ranges, and don’t experience each other’s domain and range. That is,", "pi": "“Pañcimāni, āvuso, indriyāni nānāvisayāni nānāgocarāni, na aññamaññassa gocaravisayaṁ paccanubhonti, seyyathidaṁ—", "claims": [], "eval": []}, {"id": "mn43:21.2", "en": "the faculties of the eye, ear, nose, tongue, and body.", "pi": "cakkhundriyaṁ, sotindriyaṁ, ghānindriyaṁ, jivhindriyaṁ, kāyindriyaṁ.", "claims": [], "eval": []}, {"id": "mn43:21.3", "en": "What do these five faculties, with their different domains and ranges, have recourse to? What experiences their domains and ranges?”", "pi": "Imesaṁ kho, āvuso, pañcannaṁ indriyānaṁ nānāvisayānaṁ nānāgocarānaṁ, na aññamaññassa gocaravisayaṁ paccanubhontānaṁ, kiṁ paṭisaraṇaṁ, ko ca nesaṁ gocaravisayaṁ paccanubhotī”ti?", "claims": [], "eval": []}, {"id": "mn43:21.4", "en": "", "pi": "“Pañcimāni, āvuso, indriyāni nānāvisayāni nānāgocarāni, na aññamaññassa gocaravisayaṁ paccanubhonti, seyyathidaṁ—", "claims": [], "eval": []}, {"id": "mn43:21.5", "en": "", "pi": "cakkhundriyaṁ, sotindriyaṁ, ghānindriyaṁ, jivhindriyaṁ, kāyindriyaṁ.", "claims": [], "eval": []}, {"id": "mn43:21.6", "en": "“These five faculties, with their different domains and ranges, have recourse to the mind. And the mind experiences their domains and ranges.”", "pi": "Imesaṁ kho, āvuso, pañcannaṁ indriyānaṁ nānāvisayānaṁ nānāgocarānaṁ, na aññamaññassa gocaravisayaṁ paccanubhontānaṁ, mano paṭisaraṇaṁ, mano ca nesaṁ gocaravisayaṁ paccanubhotī”ti.", "claims": [], "eval": []}, {"id": "mn43:22.1", "en": "", "pi": "“Pañcimāni, āvuso, indriyāni, seyyathidaṁ—", "claims": [], "eval": []}, {"id": "mn43:22.2", "en": "", "pi": "cakkhundriyaṁ, sotindriyaṁ, ghānindriyaṁ, jivhindriyaṁ, kāyindriyaṁ.", "claims": [], "eval": []}, {"id": "mn43:22.3", "en": "“These five faculties depend on what to continue?”", "pi": "Imāni kho, āvuso, pañcindriyāni kiṁ paṭicca tiṭṭhantī”ti?", "claims": [], "eval": []}, {"id": "mn43:22.4", "en": "", "pi": "“Pañcimāni, āvuso, indriyāni, seyyathidaṁ—", "claims": [], "eval": []}, {"id": "mn43:22.5", "en": "", "pi": "cakkhundriyaṁ, sotindriyaṁ, ghānindriyaṁ, jivhindriyaṁ, kāyindriyaṁ.", "claims": [], "eval": []}, {"id": "mn43:22.6", "en": "“These five faculties depend on vitality to continue.”", "pi": "Imāni kho, āvuso, pañcindriyāni āyuṁ paṭicca tiṭṭhantī”ti.", "claims": [], "eval": []}, {"id": "mn43:22.7", "en": "“But what does vitality depend on to continue?”", "pi": "“Āyu panāvuso, kiṁ paṭicca tiṭṭhatī”ti?", "claims": [], "eval": []}, {"id": "mn43:22.8", "en": "“Vitality depends on warmth to continue.”", "pi": "“Āyu usmaṁ paṭicca tiṭṭhatī”ti.", "claims": [], "eval": []}, {"id": "mn43:22.9", "en": "“But what does warmth depend on to continue?”", "pi": "“Usmā panāvuso, kiṁ paṭicca tiṭṭhatī”ti?", "claims": [], "eval": []}, {"id": "mn43:22.10", "en": "“Warmth depends on vitality to continue.”", "pi": "“Usmā āyuṁ paṭicca tiṭṭhatī”ti.", "claims": [], "eval": []}, {"id": "mn43:22.11", "en": "“Just now I understood you to say:", "pi": "“Idāneva kho mayaṁ, āvuso, āyasmato sāriputtassa bhāsitaṁ evaṁ ājānāma:", "claims": [], "eval": []}, {"id": "mn43:22.12", "en": "‘Vitality depends on warmth to continue.’", "pi": "‘āyu usmaṁ paṭicca tiṭṭhatī’ti.", "claims": [], "eval": []}, {"id": "mn43:22.13", "en": "But I also understood you to say:", "pi": "Idāneva pana mayaṁ, āvuso, āyasmato sāriputtassa bhāsitaṁ evaṁ ājānāma:", "claims": [], "eval": []}, {"id": "mn43:22.14", "en": "‘Warmth depends on vitality to continue.’", "pi": "‘usmā āyuṁ paṭicca tiṭṭhatī’ti.", "claims": [], "eval": []}, {"id": "mn43:22.15", "en": "How then should we see the meaning of this statement?”", "pi": "Yathā kathaṁ panāvuso, imassa bhāsitassa attho daṭṭhabbo”ti?", "claims": [], "eval": []}, {"id": "mn43:22.16", "en": "“Well then, reverend, I shall give you a simile.", "pi": "“Tena hāvuso, upamaṁ te karissāmi;", "claims": [], "eval": []}, {"id": "mn43:22.17", "en": "For by means of a simile some sensible people understand the meaning of what is said.", "pi": "upamāyapidhekacce viññū purisā bhāsitassa atthaṁ ājānanti.", "claims": [], "eval": []}, {"id": "mn43:22.18", "en": "Suppose there was an oil lamp burning. The luminosity appears dependent on the flame, and the flame appears dependent on the luminosity.", "pi": "Seyyathāpi, āvuso, telappadīpassa jhāyato acciṁ paṭicca ābhā paññāyati, ābhaṁ paṭicca acci paññāyati;", "claims": [], "eval": []}, {"id": "mn43:22.19", "en": "In the same way, vitality depends on warmth to continue, and warmth depends on vitality to continue.”", "pi": "evameva kho, āvuso, āyu usmaṁ paṭicca tiṭṭhati, usmā āyuṁ paṭicca tiṭṭhatī”ti.", "claims": [], "eval": []}, {"id": "mn43:23.1", "en": "“Are the vital forces and the phenomena that are felt one and the same? Or are the vital forces one thing, and the phenomena that are felt another?”", "pi": "“Teva nu kho, āvuso, āyusaṅkhārā, te vedaniyā dhammā udāhu aññe āyusaṅkhārā aññe vedaniyā dhammā”ti?", "claims": [], "eval": []}, {"id": "mn43:23.2", "en": "“The vital forces are not the same things as the phenomena that are felt.", "pi": "“Na kho, āvuso, teva āyusaṅkhārā te vedaniyā dhammā.", "claims": [], "eval": []}, {"id": "mn43:23.3", "en": "For if the vital forces and the phenomena that are felt were the same things, a mendicant who had attained the cessation of perception and feeling would not emerge from it.", "pi": "Te ca hāvuso, āyusaṅkhārā abhaviṁsu te vedaniyā dhammā, na yidaṁ saññāvedayitanirodhaṁ samāpannassa bhikkhuno vuṭṭhānaṁ paññāyetha.", "claims": [], "eval": []}, {"id": "mn43:23.4", "en": "But because the vital forces and the phenomena that are felt are different things, a mendicant who has attained the cessation of perception and feeling can emerge from it.”", "pi": "Yasmā ca kho, āvuso, aññe āyusaṅkhārā aññe vedaniyā dhammā, tasmā saññāvedayitanirodhaṁ samāpannassa bhikkhuno vuṭṭhānaṁ paññāyatī”ti.", "claims": [], "eval": []}, {"id": "mn43:24.1", "en": "“How many things must this body lose before it lies abandoned, tossed aside like an insentient log?”", "pi": "“Yadā nu kho, āvuso, imaṁ kāyaṁ kati dhammā jahanti; athāyaṁ kāyo ujjhito avakkhitto seti, yathā kaṭṭhaṁ acetanan”ti?", "claims": [], "eval": []}, {"id": "mn43:24.2", "en": "“This body must lose three things before it lies abandoned, tossed aside like an insentient log: vitality, warmth, and consciousness.”", "pi": "“Yadā kho, āvuso, imaṁ kāyaṁ tayo dhammā jahanti—āyu usmā ca viññāṇaṁ; athāyaṁ kāyo ujjhito avakkhitto seti, yathā kaṭṭhaṁ acetanan”ti.", "claims": [], "eval": []}, {"id": "mn43:25.1", "en": "“What’s the difference between someone who has passed away and a mendicant who has attained the cessation of perception and feeling?”", "pi": "“Yvāyaṁ, āvuso, mato kālaṅkato, yo cāyaṁ bhikkhu saññāvedayitanirodhaṁ samāpanno—imesaṁ kiṁ nānākaraṇan”ti?", "claims": [], "eval": []}, {"id": "mn43:25.2", "en": "“When someone dies, their physical, verbal, and mental processes have ceased and stilled; their vitality is spent; their warmth is dissipated; and their faculties have disintegrated.", "pi": "“Yvāyaṁ, āvuso, mato kālaṅkato tassa kāyasaṅkhārā niruddhā paṭippassaddhā, vacīsaṅkhārā niruddhā paṭippassaddhā, cittasaṅkhārā niruddhā paṭippassaddhā, āyu parikkhīṇo, usmā vūpasantā, indriyāni paribhinnāni.", "claims": [], "eval": []}, {"id": "mn43:25.3", "en": "When a mendicant has attained the cessation of perception and feeling, their physical, verbal, and mental processes have ceased and stilled. But their vitality is not spent; their warmth is not dissipated; and their faculties are very clear.", "pi": "Yo cāyaṁ bhikkhu saññāvedayitanirodhaṁ samāpanno tassapi kāyasaṅkhārā niruddhā paṭippassaddhā, vacīsaṅkhārā niruddhā paṭippassaddhā, cittasaṅkhārā niruddhā paṭippassaddhā, āyu na parikkhīṇo, usmā avūpasantā, indriyāni vippasannāni.", "claims": [], "eval": []}, {"id": "mn43:25.4", "en": "That’s the difference between someone who has passed away and a mendicant who has attained the cessation of perception and feeling.”", "pi": "Yvāyaṁ, āvuso, mato kālaṅkato, yo cāyaṁ bhikkhu saññāvedayitanirodhaṁ samāpanno—idaṁ nesaṁ nānākaraṇan”ti.", "claims": [], "eval": []}, {"id": "mn43:26.1", "en": "“How many conditions are necessary to attain the neutral release of the heart?”", "pi": "“Kati panāvuso, paccayā adukkhamasukhāya cetovimuttiyā samāpattiyā”ti?", "claims": [], "eval": []}, {"id": "mn43:26.2", "en": "“Four conditions are necessary to attain the neutral release of the heart.", "pi": "“Cattāro kho, āvuso, paccayā adukkhamasukhāya cetovimuttiyā samāpattiyā.", "claims": [], "eval": []}, {"id": "mn43:26.3", "en": "With the giving up of pleasure and pain and the disappearance of former happiness and sadness, a mendicant enters and remains in the fourth absorption, without pleasure or pain, with pure equanimity and mindfulness.", "pi": "Idhāvuso, bhikkhu sukhassa ca pahānā dukkhassa ca pahānā pubbeva somanassadomanassānaṁ atthaṅgamā adukkhamasukhaṁ upekkhāsatipārisuddhiṁ catutthaṁ jhānaṁ upasampajja viharati.", "claims": [], "eval": []}, {"id": "mn43:26.4", "en": "These four conditions are necessary to attain the neutral release of the heart.”", "pi": "Ime kho, āvuso, cattāro paccayā adukkhamasukhāya cetovimuttiyā samāpattiyā”ti.", "claims": [], "eval": []}, {"id": "mn43:27.1", "en": "“How many conditions are necessary to attain the signless release of the heart?”", "pi": "“Kati panāvuso, paccayā animittāya cetovimuttiyā samāpattiyā”ti?", "claims": [], "eval": []}, {"id": "mn43:27.2", "en": "“Two conditions are necessary to attain the signless release of the heart:", "pi": "“Dve kho, āvuso, paccayā animittāya cetovimuttiyā samāpattiyā—", "claims": [], "eval": []}, {"id": "mn43:27.3", "en": "not focusing on any signs, and focusing on the signless.", "pi": "sabbanimittānañca amanasikāro, animittāya ca dhātuyā manasikāro.", "claims": [], "eval": []}, {"id": "mn43:27.4", "en": "These two conditions are necessary to attain the signless release of the heart.”", "pi": "Ime kho, āvuso, dve paccayā animittāya cetovimuttiyā samāpattiyā”ti.", "claims": [], "eval": []}, {"id": "mn43:27.5", "en": "“How many conditions are necessary to remain in the signless release of the heart?”", "pi": "“Kati panāvuso, paccayā animittāya cetovimuttiyā ṭhitiyā”ti?", "claims": [], "eval": []}, {"id": "mn43:28.1", "en": "“Three conditions are necessary to remain in the signless release of the heart:", "pi": "“Tayo kho, āvuso, paccayā animittāya cetovimuttiyā ṭhitiyā—", "claims": [], "eval": []}, {"id": "mn43:28.2", "en": "not focusing on any signs, focusing on the signless, and a previous determination.", "pi": "sabbanimittānañca amanasikāro, animittāya ca dhātuyā manasikāro, pubbe ca abhisaṅkhāro.", "claims": [], "eval": []}, {"id": "mn43:28.3", "en": "These three conditions are necessary to remain in the signless release of the heart.”", "pi": "Ime kho, āvuso, tayo paccayā animittāya cetovimuttiyā ṭhitiyā”ti.", "claims": [], "eval": []}, {"id": "mn43:29.1", "en": "“How many conditions are necessary to emerge from the signless release of the heart?”", "pi": "“Kati panāvuso, paccayā animittāya cetovimuttiyā vuṭṭhānāyā”ti?", "claims": [], "eval": []}, {"id": "mn43:29.2", "en": "“Two conditions are necessary to emerge from the signless release of the heart:", "pi": "“Dve kho, āvuso, paccayā animittāya cetovimuttiyā vuṭṭhānāya—", "claims": [], "eval": []}, {"id": "mn43:29.3", "en": "focusing on all signs, and not focusing on the signless.", "pi": "sabbanimittānañca manasikāro, animittāya ca dhātuyā amanasikāro.", "claims": [], "eval": []}, {"id": "mn43:29.4", "en": "These two conditions are necessary to emerge from the signless release of the heart.”", "pi": "Ime kho, āvuso, dve paccayā animittāya cetovimuttiyā vuṭṭhānāyā”ti.", "claims": [], "eval": []}, {"id": "mn43:29.5", "en": "“The limitless release of the heart, and the release of the heart through nothingness, and the release of the heart through emptiness, and the signless release of the heart: do these things differ in both meaning and phrasing? Or do they mean the same thing, and differ only in the phrasing?”", "pi": "“Yā cāyaṁ, āvuso, appamāṇā cetovimutti, yā ca ākiñcaññā cetovimutti, yā ca suññatā cetovimutti, yā ca animittā cetovimutti—ime dhammā nānātthā ceva nānābyañjanā ca udāhu ekatthā byañjanameva nānan”ti?", "claims": [], "eval": []}, {"id": "mn43:30.1", "en": "“There is a way in which these things differ in both meaning and phrasing.", "pi": "“Yā cāyaṁ, āvuso, appamāṇā cetovimutti, yā ca ākiñcaññā cetovimutti, yā ca suññatā cetovimutti, yā ca animittā cetovimutti—atthi kho, āvuso, pariyāyo yaṁ pariyāyaṁ āgamma ime dhammā nānātthā ceva nānābyañjanā ca;", "claims": [], "eval": []}, {"id": "mn43:30.2", "en": "But there’s also a way in which they mean the same thing, and differ only in the phrasing.", "pi": "atthi ca kho, āvuso, pariyāyo yaṁ pariyāyaṁ āgamma ime dhammā ekatthā, byañjanameva nānaṁ.", "claims": [], "eval": []}, {"id": "mn43:31.1", "en": "And what’s the way in which these things differ in both meaning and phrasing?", "pi": "Katamo cāvuso, pariyāyo yaṁ pariyāyaṁ āgamma ime dhammā nānātthā ceva nānābyañjanā ca?", "claims": [], "eval": []}, {"id": "mn43:31.2", "en": "Firstly, a mendicant meditates spreading a heart full of love to one direction, and to the second, and to the third, and to the fourth. In the same way above, below, across, everywhere, all around, they spread a heart full of love to the whole world—abundant, expansive, limitless, free of enmity and ill will.", "pi": "Idhāvuso, bhikkhu mettāsahagatena cetasā ekaṁ disaṁ pharitvā viharati, tathā dutiyaṁ, tathā tatiyaṁ, tathā catutthaṁ. Iti uddhamadho tiriyaṁ sabbadhi sabbattatāya sabbāvantaṁ lokaṁ mettāsahagatena cetasā vipulena mahaggatena appamāṇena averena abyābajjhena pharitvā viharati.", "claims": [], "eval": []}, {"id": "mn43:31.3", "en": "They meditate spreading a heart full of compassion …", "pi": "Karuṇāsahagatena cetasā …pe…", "claims": [], "eval": []}, {"id": "mn43:31.4", "en": "They meditate spreading a heart full of rejoicing …", "pi": "muditāsahagatena cetasā …", "claims": [], "eval": []}, {"id": "mn43:31.5", "en": "They meditate spreading a heart full of equanimity to one direction, and to the second, and to the third, and to the fourth. In the same way above, below, across, everywhere, all around, they spread a heart full of equanimity to the whole world—abundant, expansive, limitless, free of enmity and ill will.", "pi": "upekkhāsahagatena cetasā ekaṁ disaṁ pharitvā viharati, tathā dutiyaṁ, tathā tatiyaṁ, tathā catutthaṁ. Iti uddhamadho tiriyaṁ sabbadhi sabbattatāya sabbāvantaṁ lokaṁ upekkhāsahagatena cetasā vipulena mahaggatena appamāṇena averena abyābajjhena pharitvā viharati.", "claims": [], "eval": []}, {"id": "mn43:31.6", "en": "This is called the limitless release of the heart.", "pi": "Ayaṁ vuccatāvuso, appamāṇā cetovimutti.", "claims": [], "eval": []}, {"id": "mn43:32.1", "en": "And what is the release of the heart through nothingness?", "pi": "Katamā cāvuso, ākiñcaññā cetovimutti?", "claims": [], "eval": []}, {"id": "mn43:32.2", "en": "It’s when a mendicant, going totally beyond the dimension of infinite consciousness, aware that ‘there is nothing at all’, enters and remains in the dimension of nothingness.", "pi": "Idhāvuso, bhikkhu sabbaso viññāṇañcāyatanaṁ samatikkamma natthi kiñcīti ākiñcaññāyatanaṁ upasampajja viharati.", "claims": [], "eval": []}, {"id": "mn43:32.3", "en": "This is called the heart’s release through nothingness.", "pi": "Ayaṁ vuccatāvuso, ākiñcaññā cetovimutti.", "claims": [], "eval": []}, {"id": "mn43:33.1", "en": "And what is the release of the heart through emptiness?", "pi": "Katamā cāvuso, suññatā cetovimutti?", "claims": [], "eval": []}, {"id": "mn43:33.2", "en": "It’s when a mendicant has gone to a wilderness, or to the root of a tree, or to an empty hut, and reflects like this:", "pi": "Idhāvuso, bhikkhu araññagato vā rukkhamūlagato vā suññāgāragato vā iti paṭisañcikkhati:", "claims": [], "eval": []}, {"id": "mn43:33.3", "en": "‘This is empty of a self or what belongs to a self.’", "pi": "‘suññamidaṁ attena vā attaniyena vā’ti.", "claims": [], "eval": []}, {"id": "mn43:33.4", "en": "This is called the release of the heart through emptiness.", "pi": "Ayaṁ vuccatāvuso, suññatā cetovimutti.", "claims": [], "eval": []}, {"id": "mn43:34.1", "en": "And what is the signless release of the heart?", "pi": "Katamā cāvuso, animittā cetovimutti?", "claims": [], "eval": []}, {"id": "mn43:34.2", "en": "It’s when a mendicant, not focusing on any signs, enters and remains in the signless immersion of the heart.", "pi": "Idhāvuso, bhikkhu sabbanimittānaṁ amanasikārā animittaṁ cetosamādhiṁ upasampajja viharati.", "claims": [], "eval": []}, {"id": "mn43:34.3", "en": "This is called the signless release of the heart.", "pi": "Ayaṁ vuccatāvuso, animittā cetovimutti.", "claims": [], "eval": []}, {"id": "mn43:34.4", "en": "This is the way in which these things differ in both meaning and phrasing.", "pi": "Ayaṁ kho, āvuso, pariyāyo yaṁ pariyāyaṁ āgamma ime dhammā nānātthā ceva nānābyañjanā ca.", "claims": [], "eval": []}, {"id": "mn43:35.1", "en": "And what’s the way in which they mean the same thing, and differ only in the phrasing?", "pi": "Katamo cāvuso, pariyāyo yaṁ pariyāyaṁ āgamma ime dhammā ekatthā byañjanameva nānaṁ?", "claims": [], "eval": []}, {"id": "mn43:35.2", "en": "Greed, hate, and delusion are makers of limits.", "pi": "Rāgo kho, āvuso, pamāṇakaraṇo, doso pamāṇakaraṇo, moho pamāṇakaraṇo.", "claims": [], "eval": []}, {"id": "mn43:35.3", "en": "A mendicant who has ended the defilements has given these up, cut them off at the root, made them like a palm stump, and obliterated them, so they are unable to arise in the future.", "pi": "Te khīṇāsavassa bhikkhuno pahīnā ucchinnamūlā tālāvatthukatā anabhāvaṅkatā āyatiṁ anuppādadhammā.", "claims": [], "eval": []}, {"id": "mn43:35.4", "en": "The unshakable release of the heart is said to be the best kind of limitless release of the heart.", "pi": "Yāvatā kho, āvuso, appamāṇā cetovimuttiyo, akuppā tāsaṁ cetovimutti aggamakkhāyati.", "claims": [], "eval": []}, {"id": "mn43:35.5", "en": "That unshakable release of the heart is empty of greed, hate, and delusion.", "pi": "Sā kho panākuppā cetovimutti suññā rāgena, suññā dosena, suññā mohena.", "claims": [], "eval": []}, {"id": "mn43:36.1", "en": "Greed is something, hate is something, and delusion is something.", "pi": "Rāgo kho, āvuso, kiñcano, doso kiñcano, moho kiñcano.", "claims": [], "eval": []}, {"id": "mn43:36.2", "en": "A mendicant who has ended the defilements has given these up, cut them off at the root, made them like a palm stump, and obliterated them, so they are unable to arise in the future.", "pi": "Te khīṇāsavassa bhikkhuno pahīnā ucchinnamūlā tālāvatthukatā anabhāvaṅkatā āyatiṁ anuppādadhammā.", "claims": [], "eval": []}, {"id": "mn43:36.3", "en": "The unshakable release of the heart is said to be the best kind of release of the heart through nothingness.", "pi": "Yāvatā kho, āvuso, ākiñcaññā cetovimuttiyo, akuppā tāsaṁ cetovimutti aggamakkhāyati.", "claims": [], "eval": []}, {"id": "mn43:36.4", "en": "That unshakable release of the heart is empty of greed, hate, and delusion.", "pi": "Sā kho panākuppā cetovimutti suññā rāgena, suññā dosena, suññā mohena.", "claims": [], "eval": []}, {"id": "mn43:37.1", "en": "Greed, hate, and delusion are makers of signs.", "pi": "Rāgo kho, āvuso, nimittakaraṇo, doso nimittakaraṇo, moho nimittakaraṇo.", "claims": [], "eval": []}, {"id": "mn43:37.2", "en": "A mendicant who has ended the defilements has given these up, cut them off at the root, made them like a palm stump, and obliterated them, so they are unable to arise in the future.", "pi": "Te khīṇāsavassa bhikkhuno pahīnā ucchinnamūlā tālāvatthukatā anabhāvaṅkatā āyatiṁ anuppādadhammā.", "claims": [], "eval": []}, {"id": "mn43:37.3", "en": "The unshakable release of the heart is said to be the best kind of signless release of the heart.", "pi": "Yāvatā kho, āvuso, animittā cetovimuttiyo, akuppā tāsaṁ cetovimutti aggamakkhāyati.", "claims": [], "eval": []}, {"id": "mn43:37.4", "en": "That unshakable release of the heart is empty of greed, hate, and delusion.", "pi": "Sā kho panākuppā cetovimutti suññā rāgena, suññā dosena, suññā mohena.", "claims": [], "eval": []}, {"id": "mn43:37.5", "en": "This is the way in which they mean the same thing, and differ only in the phrasing.”", "pi": "Ayaṁ kho, āvuso, pariyāyo yaṁ pariyāyaṁ āgamma ime dhammā ekatthā byañjanameva nānan”ti.", "claims": [], "eval": []}, {"id": "mn43:37.6", "en": "That is what Venerable Sāriputta said.", "pi": "Idamavocāyasmā sāriputto.", "claims": [], "eval": []}, {"id": "mn43:37.7", "en": "Satisfied, Venerable Mahākoṭṭhita approved what Sāriputta said.", "pi": "Attamano āyasmā mahākoṭṭhiko āyasmato sāriputtassa bhāsitaṁ abhinandīti.", "claims": [], "eval": []}, {"id": "mn43:37.8", "en": "", "pi": "Mahāvedallasuttaṁ niṭṭhitaṁ tatiyaṁ.", "claims": [], "eval": []}], "cited": 5}, {"uid": "mn44", "title": "MN 44 Cūḷavedallasutta — The Shorter Elaboration", "layer": "Sutta (early discourses)", "coverage": "partly encoded", "review": "not yet reviewed", "encodes": "One definition: 'Unification of the mind is immersion' (12.2). Found while checking an eval answer; it corrected decision D4, which had wrongly called this equation an interpretation.", "leftOut": "The rest of Dhammadinnā's answers: substantial reality, its origin, cessation and the practice leading there (2-5); grasping and the aggregates (6); substantialist view (7-8); the noble eightfold path and the three spectrums of practice (9-11); the bases, prerequisites and development of immersion (12.3-12.5); the three processes (13-15); the cessation of perception and feeling (16-21); the three feelings, their underlying tendencies and their counterparts (22-29), ending with 'extinguishment is the objective, destination, and culmination of the spiritual life' (29.15); and the Buddha's endorsement of her answers (30.4-30.5), which gives the definition its authority.", "modelledBy": "project owner with Claude (AI assistant), from SuttaCentral's text", "modelledOn": "2026-11-14", "segments": [{"id": "mn44:0.1", "en": "Middle Discourses 44", "pi": "Majjhima Nikāya 44", "claims": [], "eval": []}, {"id": "mn44:0.2", "en": "The Shorter Elaboration", "pi": "Cūḷavedallasutta", "claims": [], "eval": []}, {"id": "mn44:1.1", "en": "So I have heard.", "pi": "Evaṁ me sutaṁ—", "claims": [], "eval": []}, {"id": "mn44:1.2", "en": "At one time the Buddha was staying near Rājagaha in the Bamboo Grove, the squirrels’ feeding ground.", "pi": "ekaṁ samayaṁ bhagavā rājagahe viharati veḷuvane kalandakanivāpe.", "claims": [], "eval": []}, {"id": "mn44:1.3", "en": "Then the layman Visākha went to see the nun Dhammadinnā, bowed, sat down to one side, and said to her:", "pi": "Atha kho visākho upāsako yena dhammadinnā bhikkhunī tenupasaṅkami; upasaṅkamitvā dhammadinnaṁ bhikkhuniṁ abhivādetvā ekamantaṁ nisīdi. Ekamantaṁ nisinno kho visākho upāsako dhammadinnaṁ bhikkhuniṁ etadavoca:", "claims": [], "eval": []}, {"id": "mn44:2.1", "en": "“Ma’am, they speak of this thing called ‘substantial reality’.", "pi": "“‘sakkāyo sakkāyo’ti, ayye, vuccati.", "claims": [], "eval": []}, {"id": "mn44:2.2", "en": "What is this substantial reality that the Buddha spoke of?”", "pi": "Katamo nu kho, ayye, sakkāyo vutto bhagavatā”ti?", "claims": [], "eval": []}, {"id": "mn44:2.3", "en": "“Visākha, the Buddha said that these five grasping aggregates are substantial reality.", "pi": "“Pañca kho ime, āvuso visākha, upādānakkhandhā sakkāyo vutto bhagavatā,", "claims": [], "eval": []}, {"id": "mn44:2.4", "en": "That is, the grasping aggregates of form, feeling, perception, choices, and consciousness.", "pi": "seyyathidaṁ—rūpupādānakkhandho, vedanupādānakkhandho, saññupādānakkhandho, saṅkhārupādānakkhandho, viññāṇupādānakkhandho.", "claims": [], "eval": []}, {"id": "mn44:2.5", "en": "The Buddha said that these five grasping aggregates are substantial reality.”", "pi": "Ime kho, āvuso visākha, pañcupādānakkhandhā sakkāyo vutto bhagavatā”ti.", "claims": [], "eval": []}, {"id": "mn44:2.6", "en": "Saying “Good, ma’am,” Visākha approved and agreed with what Dhammadinnā said. Then he asked another question:", "pi": "“Sādhayye”ti kho visākho upāsako dhammadinnāya bhikkhuniyā bhāsitaṁ abhinanditvā anumoditvā dhammadinnaṁ bhikkhuniṁ uttariṁ pañhaṁ apucchi:", "claims": [], "eval": []}, {"id": "mn44:3.1", "en": "“Ma’am, they speak of this thing called ‘the origin of substantial reality’.", "pi": "“‘sakkāyasamudayo sakkāyasamudayo’ti, ayye, vuccati.", "claims": [], "eval": []}, {"id": "mn44:3.2", "en": "What is the origin of substantial reality that the Buddha spoke of?”", "pi": "Katamo nu kho, ayye, sakkāyasamudayo vutto bhagavatā”ti?", "claims": [], "eval": []}, {"id": "mn44:3.3", "en": "“It’s the craving that leads to future lives, mixed up with relishing and greed, taking pleasure there wherever it alights. That is,", "pi": "“Yāyaṁ, āvuso visākha, taṇhā ponobbhavikā nandīrāgasahagatā tatratatrābhinandinī, seyyathidaṁ—", "claims": [], "eval": []}, {"id": "mn44:3.4", "en": "craving for sensual pleasures, craving for continued existence, and craving for nonexistence.", "pi": "kāmataṇhā bhavataṇhā vibhavataṇhā;", "claims": [], "eval": []}, {"id": "mn44:3.5", "en": "The Buddha said that this is the origin of substantial reality.”", "pi": "ayaṁ kho, āvuso visākha, sakkāyasamudayo vutto bhagavatā”ti.", "claims": [], "eval": []}, {"id": "mn44:4.1", "en": "“Ma’am, they speak of this thing called ‘the cessation of substantial reality’.", "pi": "“‘Sakkāyanirodho sakkāyanirodho’ti, ayye, vuccati.", "claims": [], "eval": []}, {"id": "mn44:4.2", "en": "What is the cessation of substantial reality that the Buddha spoke of?”", "pi": "Katamo nu kho, ayye, sakkāyanirodho vutto bhagavatā”ti?", "claims": [], "eval": []}, {"id": "mn44:4.3", "en": "“It’s the fading away and cessation of that very same craving with no residue left behind; giving it away, letting it go, releasing it, and not clinging to it.", "pi": "“Yo kho, āvuso visākha, tassāyeva taṇhāya asesavirāganirodho cāgo paṭinissaggo mutti anālayo;", "claims": [], "eval": []}, {"id": "mn44:4.4", "en": "The Buddha said that this is the cessation of substantial reality.”", "pi": "ayaṁ kho, āvuso visākha, sakkāyanirodho vutto bhagavatā”ti.", "claims": [], "eval": []}, {"id": "mn44:5.1", "en": "“Ma’am, they speak of the practice that leads to the cessation of substantial reality.", "pi": "“‘Sakkāyanirodhagāminī paṭipadā sakkāyanirodhagāminī paṭipadā’ti, ayye, vuccati.", "claims": [], "eval": []}, {"id": "mn44:5.2", "en": "What is the practice that leads to the cessation of substantial reality that the Buddha spoke of?”", "pi": "Katamā nu kho, ayye, sakkāyanirodhagāminī paṭipadā vuttā bhagavatā”ti?", "claims": [], "eval": []}, {"id": "mn44:5.3", "en": "“The practice that leads to the cessation of substantial reality that the Buddha spoke of is simply this noble eightfold path, that is:", "pi": "“Ayameva kho, āvuso visākha, ariyo aṭṭhaṅgiko maggo sakkāyanirodhagāminī paṭipadā vuttā bhagavatā, seyyathidaṁ—", "claims": [], "eval": []}, {"id": "mn44:5.4", "en": "right view, right purpose, right speech, right action, right livelihood, right effort, right mindfulness, and right immersion.”", "pi": "sammādiṭṭhi sammāsaṅkappo sammāvācā sammākammanto sammāājīvo sammāvāyāmo sammāsati sammāsamādhī”ti.", "claims": [], "eval": []}, {"id": "mn44:6.1", "en": "“But ma’am, is that grasping the exact same thing as the five grasping aggregates? Or is grasping one thing and the five grasping aggregates another?”", "pi": "“Taññeva nu kho, ayye, upādānaṁ te pañcupādānakkhandhā udāhu aññatra pañcahupādānakkhandhehi upādānan”ti?", "claims": [], "eval": []}, {"id": "mn44:6.2", "en": "“That grasping is not the exact same thing as the five grasping aggregates. Nor is grasping one thing and the five grasping aggregates another.", "pi": "“Na kho, āvuso visākha, taññeva upādānaṁ te pañcupādānakkhandhā, nāpi aññatra pañcahupādānakkhandhehi upādānaṁ.", "claims": [], "eval": []}, {"id": "mn44:6.3", "en": "The desire and greed for the five grasping aggregates is the grasping there.”", "pi": "Yo kho, āvuso visākha, pañcasu upādānakkhandhesu chandarāgo taṁ tattha upādānan”ti.", "claims": [], "eval": []}, {"id": "mn44:7.1", "en": "“But ma’am, how does substantialist view come about?”", "pi": "“Kathaṁ panāyye, sakkāyadiṭṭhi hotī”ti?", "claims": [], "eval": []}, {"id": "mn44:7.2", "en": "“It’s when an unlearned ordinary person has not seen the noble ones, and is neither skilled nor trained in the teaching of the noble ones. They’ve not seen true persons, and are neither skilled nor trained in the teaching of the true persons.", "pi": "“Idhāvuso visākha, assutavā puthujjano, ariyānaṁ adassāvī ariyadhammassa akovido ariyadhamme avinīto, sappurisānaṁ adassāvī sappurisadhammassa akovido sappurisadhamme avinīto,", "claims": [], "eval": []}, {"id": "mn44:7.3", "en": "They regard form as self, self as having form, form in self, or self in form.", "pi": "rūpaṁ attato samanupassati, rūpavantaṁ vā attānaṁ, attani vā rūpaṁ, rūpasmiṁ vā attānaṁ.", "claims": [], "eval": []}, {"id": "mn44:7.4", "en": "They regard feeling …", "pi": "Vedanaṁ …pe…", "claims": [], "eval": []}, {"id": "mn44:7.5", "en": "perception …", "pi": "saññaṁ …", "claims": [], "eval": []}, {"id": "mn44:7.6", "en": "choices …", "pi": "saṅkhāre …", "claims": [], "eval": []}, {"id": "mn44:7.7", "en": "consciousness as self, self as having consciousness, consciousness in self, or self in consciousness.", "pi": "viññāṇaṁ attato samanupassati, viññāṇavantaṁ vā attānaṁ, attani vā viññāṇaṁ, viññāṇasmiṁ vā attānaṁ.", "claims": [], "eval": []}, {"id": "mn44:7.8", "en": "That’s how substantialist view comes about.”", "pi": "Evaṁ kho, āvuso visākha, sakkāyadiṭṭhi hotī”ti.", "claims": [], "eval": []}, {"id": "mn44:8.1", "en": "“But ma’am, how does substantialist view not come about?”", "pi": "“Kathaṁ panāyye, sakkāyadiṭṭhi na hotī”ti?", "claims": [], "eval": []}, {"id": "mn44:8.2", "en": "“It’s when a learned noble disciple has seen the noble ones, and is skilled and trained in the teaching of the noble ones. They’ve seen true persons, and are skilled and trained in the teaching of the true persons.", "pi": "“Idhāvuso visākha, sutavā ariyasāvako, ariyānaṁ dassāvī ariyadhammassa kovido ariyadhamme suvinīto, sappurisānaṁ dassāvī sappurisadhammassa kovido sappurisadhamme suvinīto,", "claims": [], "eval": []}, {"id": "mn44:8.3", "en": "They don’t regard form as self, self as having form, form in self, or self in form.", "pi": "na rūpaṁ attato samanupassati, na rūpavantaṁ vā attānaṁ, na attani vā rūpaṁ, na rūpasmiṁ vā attānaṁ.", "claims": [], "eval": []}, {"id": "mn44:8.4", "en": "They don’t regard feeling …", "pi": "Na vedanaṁ …pe…", "claims": [], "eval": []}, {"id": "mn44:8.5", "en": "perception …", "pi": "na saññaṁ …", "claims": [], "eval": []}, {"id": "mn44:8.6", "en": "choices …", "pi": "na saṅkhāre …pe…", "claims": [], "eval": []}, {"id": "mn44:8.7", "en": "consciousness as self, self as having consciousness, consciousness in self, or self in consciousness.", "pi": "na viññāṇaṁ attato samanupassati, na viññāṇavantaṁ vā attānaṁ, na attani vā viññāṇaṁ, na viññāṇasmiṁ vā attānaṁ.", "claims": [], "eval": []}, {"id": "mn44:8.8", "en": "That’s how substantialist view does not come about.”", "pi": "Evaṁ kho, āvuso visākha, sakkāyadiṭṭhi na hotī”ti.", "claims": [], "eval": []}, {"id": "mn44:9.1", "en": "“But ma’am, what is the noble eightfold path?”", "pi": "“Katamo panāyye, ariyo aṭṭhaṅgiko maggo”ti?", "claims": [], "eval": []}, {"id": "mn44:9.2", "en": "“It is simply this noble eightfold path, that is:", "pi": "“Ayameva kho, āvuso visākha, ariyo aṭṭhaṅgiko maggo, seyyathidaṁ—", "claims": [], "eval": []}, {"id": "mn44:9.3", "en": "right view, right purpose, right speech, right action, right livelihood, right effort, right mindfulness, and right immersion.”", "pi": "sammādiṭṭhi sammāsaṅkappo sammāvācā sammākammanto sammāājīvo sammāvāyāmo sammāsati sammāsamādhī”ti.", "claims": [], "eval": []}, {"id": "mn44:10.1", "en": "“But ma’am, is the noble eightfold path conditioned or unconditioned?”", "pi": "“Ariyo panāyye, aṭṭhaṅgiko maggo saṅkhato udāhu asaṅkhato”ti?", "claims": [], "eval": []}, {"id": "mn44:10.2", "en": "“The noble eightfold path is conditioned.”", "pi": "“Ariyo kho, āvuso visākha, aṭṭhaṅgiko maggo saṅkhato”ti.", "claims": [], "eval": []}, {"id": "mn44:11.1", "en": "“Are the three spectrums of practice included in the noble eightfold path? Or is the noble eightfold path included in the three spectrums of practice?”", "pi": "“Ariyena nu kho, ayye, aṭṭhaṅgikena maggena tayo khandhā saṅgahitā udāhu tīhi khandhehi ariyo aṭṭhaṅgiko maggo saṅgahito”ti?", "claims": [], "eval": []}, {"id": "mn44:11.2", "en": "“The three spectrums of practice are not included in the noble eightfold path. Rather, the noble eightfold path is included in the three spectrums of practice.", "pi": "“Na kho, āvuso visākha, ariyena aṭṭhaṅgikena maggena tayo khandhā saṅgahitā; tīhi ca kho, āvuso visākha, khandhehi ariyo aṭṭhaṅgiko maggo saṅgahito.", "claims": [], "eval": []}, {"id": "mn44:11.3", "en": "Right speech, right action, and right livelihood: these things are included in the spectrum of ethics.", "pi": "Yā cāvuso visākha, sammāvācā yo ca sammākammanto yo ca sammāājīvo ime dhammā sīlakkhandhe saṅgahitā.", "claims": [], "eval": []}, {"id": "mn44:11.4", "en": "Right effort, right mindfulness, and right immersion: these things are included in the spectrum of immersion.", "pi": "Yo ca sammāvāyāmo yā ca sammāsati yo ca sammāsamādhi ime dhammā samādhikkhandhe saṅgahitā.", "claims": [], "eval": []}, {"id": "mn44:11.5", "en": "Right view and right purpose: these things are included in the spectrum of wisdom.”", "pi": "Yā ca sammādiṭṭhi yo ca sammāsaṅkappo, ime dhammā paññākkhandhe saṅgahitā”ti.", "claims": [], "eval": []}, {"id": "mn44:12.1", "en": "“But ma’am, what is immersion? What things are the bases of immersion? What things are the prerequisites for immersion? What is the development of immersion?”", "pi": "“Katamo panāyye, samādhi, katame dhammā samādhinimittā, katame dhammā samādhiparikkhārā, katamā samādhibhāvanā”ti?", "claims": [], "eval": []}, {"id": "mn44:12.2", "en": "“Unification of the mind is immersion.", "pi": "“Yā kho, āvuso visākha, cittassa ekaggatā ayaṁ samādhi;", "claims": [{"kind": "definition", "layer": "sutta", "text": "unification of mind is defined as immersion"}], "eval": ["Q24"]}, {"id": "mn44:12.3", "en": "The four kinds of mindfulness meditation are the bases for immersion.", "pi": "cattāro satipaṭṭhānā samādhinimittā;", "claims": [], "eval": []}, {"id": "mn44:12.4", "en": "The four right efforts are the prerequisites for immersion.", "pi": "cattāro sammappadhānā samādhiparikkhārā.", "claims": [], "eval": []}, {"id": "mn44:12.5", "en": "The cultivation, development, and making much of these very same things is the development of immersion.”", "pi": "Yā tesaṁyeva dhammānaṁ āsevanā bhāvanā bahulīkammaṁ, ayaṁ ettha samādhibhāvanā”ti.", "claims": [], "eval": []}, {"id": "mn44:13.1", "en": "“How many processes are there?”", "pi": "“Kati panāyye, saṅkhārā”ti?", "claims": [], "eval": []}, {"id": "mn44:13.2", "en": "“There are these three processes.", "pi": "“Tayome, āvuso visākha, saṅkhārā—", "claims": [], "eval": []}, {"id": "mn44:13.3", "en": "The physical process, the verbal process, and the mental process.”", "pi": "kāyasaṅkhāro, vacīsaṅkhāro, cittasaṅkhāro”ti.", "claims": [], "eval": []}, {"id": "mn44:14.1", "en": "“But ma’am, what is the physical process? What’s the verbal process? What’s the mental process?”", "pi": "“Katamo panāyye, kāyasaṅkhāro, katamo vacīsaṅkhāro, katamo cittasaṅkhāro”ti?", "claims": [], "eval": []}, {"id": "mn44:14.2", "en": "“Breathing is a physical process. Placing the mind and keeping it connected are a verbal process. Perception and feeling are a mental process.”", "pi": "“Assāsapassāsā kho, āvuso visākha, kāyasaṅkhāro, vitakkavicārā vacīsaṅkhāro, saññā ca vedanā ca cittasaṅkhāro”ti.", "claims": [], "eval": []}, {"id": "mn44:15.1", "en": "“But ma’am, why is breathing a physical process? Why are placing the mind and keeping it connected a verbal process? Why are perception and feeling a mental process?”", "pi": "“Kasmā panāyye, assāsapassāsā kāyasaṅkhāro, kasmā vitakkavicārā vacīsaṅkhāro, kasmā saññā ca vedanā ca cittasaṅkhāro”ti?", "claims": [], "eval": []}, {"id": "mn44:15.2", "en": "“Breathing is physical. It’s tied up with the body, that’s why breathing is a physical process.", "pi": "“Assāsapassāsā kho, āvuso visākha, kāyikā ete dhammā kāyappaṭibaddhā, tasmā assāsapassāsā kāyasaṅkhāro.", "claims": [], "eval": []}, {"id": "mn44:15.3", "en": "First you place the mind and keep it connected, then you break into speech. That’s why placing the mind and keeping it connected are a verbal process.", "pi": "Pubbe kho, āvuso visākha, vitakketvā vicāretvā pacchā vācaṁ bhindati, tasmā vitakkavicārā vacīsaṅkhāro.", "claims": [], "eval": []}, {"id": "mn44:15.4", "en": "Perception and feeling are mental. They’re tied up with the mind, that’s why perception and feeling are a mental process.”", "pi": "Saññā ca vedanā ca cetasikā ete dhammā cittappaṭibaddhā, tasmā saññā ca vedanā ca cittasaṅkhāro”ti.", "claims": [], "eval": []}, {"id": "mn44:16.1", "en": "“But ma’am, how does someone attain the cessation of perception and feeling?”", "pi": "“Kathaṁ panāyye, saññāvedayitanirodhasamāpatti hotī”ti?", "claims": [], "eval": []}, {"id": "mn44:16.2", "en": "“A mendicant who is entering such an attainment does not think:", "pi": "“Na kho, āvuso visākha, saññāvedayitanirodhaṁ samāpajjantassa bhikkhuno evaṁ hoti:", "claims": [], "eval": []}, {"id": "mn44:16.3", "en": "‘I will enter the cessation of perception and feeling’ or ‘I am entering the cessation of perception and feeling’ or ‘I have entered the cessation of perception and feeling.’", "pi": "‘ahaṁ saññāvedayitanirodhaṁ samāpajjissan’ti vā, ‘ahaṁ saññāvedayitanirodhaṁ samāpajjāmī’ti vā, ‘ahaṁ saññāvedayitanirodhaṁ samāpanno’ti vā.", "claims": [], "eval": []}, {"id": "mn44:16.4", "en": "Rather, their mind has been previously developed so as to lead to such a state.”", "pi": "Atha khvāssa pubbeva tathā cittaṁ bhāvitaṁ hoti yaṁ taṁ tathattāya upanetī”ti.", "claims": [], "eval": []}, {"id": "mn44:17.1", "en": "“But ma’am, which process ceases first for a mendicant who is entering the cessation of perception and feeling: physical, verbal, or mental?”", "pi": "“Saññāvedayitanirodhaṁ samāpajjantassa panāyye, bhikkhuno katame dhammā paṭhamaṁ nirujjhanti—yadi vā kāyasaṅkhāro, yadi vā vacīsaṅkhāro, yadi vā cittasaṅkhāro”ti?", "claims": [], "eval": []}, {"id": "mn44:17.2", "en": "“The verbal process ceases first, then physical, then mental.”", "pi": "“Saññāvedayitanirodhaṁ samāpajjantassa kho, āvuso visākha, bhikkhuno paṭhamaṁ nirujjhati vacīsaṅkhāro, tato kāyasaṅkhāro, tato cittasaṅkhāro”ti.", "claims": [], "eval": []}, {"id": "mn44:18.1", "en": "“But ma’am, how does someone emerge from the cessation of perception and feeling?”", "pi": "“Kathaṁ panāyye, saññāvedayitanirodhasamāpattiyā vuṭṭhānaṁ hotī”ti?", "claims": [], "eval": []}, {"id": "mn44:18.2", "en": "“A mendicant who is emerging from such an attainment does not think:", "pi": "“Na kho, āvuso visākha, saññāvedayitanirodhasamāpattiyā vuṭṭhahantassa bhikkhuno evaṁ hoti:", "claims": [], "eval": []}, {"id": "mn44:18.3", "en": "‘I will emerge from the cessation of perception and feeling’ or ‘I am emerging from the cessation of perception and feeling’ or ‘I have emerged from the cessation of perception and feeling.’", "pi": "‘ahaṁ saññāvedayitanirodhasamāpattiyā vuṭṭhahissan’ti vā, ‘ahaṁ saññāvedayitanirodhasamāpattiyā vuṭṭhahāmī’ti vā, ‘ahaṁ saññāvedayitanirodhasamāpattiyā vuṭṭhito’ti vā.", "claims": [], "eval": []}, {"id": "mn44:18.4", "en": "Rather, their mind has been previously developed so as to lead to such a state.”", "pi": "Atha khvāssa pubbeva tathā cittaṁ bhāvitaṁ hoti yaṁ taṁ tathattāya upanetī”ti.", "claims": [], "eval": []}, {"id": "mn44:19.1", "en": "“But ma’am, which process arises first for a mendicant who is emerging from the cessation of perception and feeling: physical, verbal, or mental?”", "pi": "“Saññāvedayitanirodhasamāpattiyā vuṭṭhahantassa panāyye, bhikkhuno katame dhammā paṭhamaṁ uppajjanti—yadi vā kāyasaṅkhāro, yadi vā vacīsaṅkhāro, yadi vā cittasaṅkhāro”ti?", "claims": [], "eval": []}, {"id": "mn44:19.2", "en": "“The mental process arises first, then physical, then verbal.”", "pi": "“Saññāvedayitanirodhasamāpattiyā vuṭṭhahantassa kho, āvuso visākha, bhikkhuno paṭhamaṁ uppajjati cittasaṅkhāro, tato kāyasaṅkhāro, tato vacīsaṅkhāro”ti.", "claims": [], "eval": []}, {"id": "mn44:20.1", "en": "“But ma’am, when a mendicant has emerged from the attainment of the cessation of perception and feeling, how many kinds of contact do they experience?”", "pi": "“Saññāvedayitanirodhasamāpattiyā vuṭṭhitaṁ panāyye, bhikkhuṁ kati phassā phusantī”ti?", "claims": [], "eval": []}, {"id": "mn44:20.2", "en": "“They experience three kinds of contact: emptiness, signless, and undirected contacts.”", "pi": "“Saññāvedayitanirodhasamāpattiyā vuṭṭhitaṁ kho, āvuso visākha, bhikkhuṁ tayo phassā phusanti—suññato phasso, animitto phasso, appaṇihito phasso”ti.", "claims": [], "eval": []}, {"id": "mn44:21.1", "en": "“But ma’am, when a mendicant has emerged from the attainment of the cessation of perception and feeling, what does their mind slant, slope, and incline to?”", "pi": "“Saññāvedayitanirodhasamāpattiyā vuṭṭhitassa panāyye, bhikkhuno kiṁninnaṁ cittaṁ hoti kiṁpoṇaṁ kiṁpabbhāran”ti?", "claims": [], "eval": []}, {"id": "mn44:21.2", "en": "“Their mind slants, slopes, and inclines to seclusion.”", "pi": "“Saññāvedayitanirodhasamāpattiyā vuṭṭhitassa kho, āvuso visākha, bhikkhuno vivekaninnaṁ cittaṁ hoti, vivekapoṇaṁ vivekapabbhāran”ti.", "claims": [], "eval": []}, {"id": "mn44:22.1", "en": "“But ma’am, how many feelings are there?”", "pi": "“Kati panāyye, vedanā”ti?", "claims": [], "eval": []}, {"id": "mn44:22.2", "en": "“There are three feelings:", "pi": "“Tisso kho imā, āvuso visākha, vedanā—", "claims": [], "eval": []}, {"id": "mn44:22.3", "en": "pleasant, painful, and neutral feeling.”", "pi": "sukhā vedanā, dukkhā vedanā, adukkhamasukhā vedanā”ti.", "claims": [], "eval": []}, {"id": "mn44:23.1", "en": "“What are these three feelings?”", "pi": "“Katamā panāyye, sukhā vedanā, katamā dukkhā vedanā, katamā adukkhamasukhā vedanā”ti?", "claims": [], "eval": []}, {"id": "mn44:23.2", "en": "“Anything felt physically or mentally as pleasant or enjoyable.", "pi": "“Yaṁ kho, āvuso visākha, kāyikaṁ vā cetasikaṁ vā sukhaṁ sātaṁ vedayitaṁ—", "claims": [], "eval": []}, {"id": "mn44:23.3", "en": "This is pleasant feeling.", "pi": "ayaṁ sukhā vedanā.", "claims": [], "eval": []}, {"id": "mn44:23.4", "en": "Anything felt physically or mentally as painful or unpleasant.", "pi": "Yaṁ kho, āvuso visākha, kāyikaṁ vā cetasikaṁ vā dukkhaṁ asātaṁ vedayitaṁ—", "claims": [], "eval": []}, {"id": "mn44:23.5", "en": "This is painful feeling.", "pi": "ayaṁ dukkhā vedanā.", "claims": [], "eval": []}, {"id": "mn44:23.6", "en": "Anything felt physically or mentally as neither pleasurable nor painful.", "pi": "Yaṁ kho, āvuso visākha, kāyikaṁ vā cetasikaṁ vā neva sātaṁ nāsātaṁ vedayitaṁ—", "claims": [], "eval": []}, {"id": "mn44:23.7", "en": "This is neutral feeling.”", "pi": "ayaṁ adukkhamasukhā vedanā”ti.", "claims": [], "eval": []}, {"id": "mn44:24.1", "en": "“What is pleasant and what is painful regarding each of the three feelings?”", "pi": "“Sukhā panāyye, vedanā kiṁsukhā kiṁdukkhā, dukkhā vedanā kiṁsukhā kiṁdukkhā, adukkhamasukhā vedanā kiṁsukhā kiṁdukkhā”ti?", "claims": [], "eval": []}, {"id": "mn44:24.2", "en": "“Pleasant feeling is pleasant when it remains and painful when it perishes.", "pi": "“Sukhā kho, āvuso visākha, vedanā ṭhitisukhā vipariṇāmadukkhā;", "claims": [], "eval": []}, {"id": "mn44:24.3", "en": "Painful feeling is painful when it remains and pleasant when it perishes.", "pi": "dukkhā vedanā ṭhitidukkhā vipariṇāmasukhā;", "claims": [], "eval": []}, {"id": "mn44:24.4", "en": "Neutral feeling is pleasant in the presence of knowledge, and painful in the presence of ignorance.”", "pi": "adukkhamasukhā vedanā ñāṇasukhā aññāṇadukkhā”ti.", "claims": [], "eval": []}, {"id": "mn44:25.1", "en": "“What underlying tendencies underlie each of the three feelings?”", "pi": "“Sukhāya panāyye, vedanāya kiṁ anusayo anuseti, dukkhāya vedanāya kiṁ anusayo anuseti, adukkhamasukhāya vedanāya kiṁ anusayo anusetī”ti?", "claims": [], "eval": []}, {"id": "mn44:25.2", "en": "“The underlying tendency for greed underlies pleasant feeling. The underlying tendency for aversion underlies painful feeling. The underlying tendency for ignorance underlies neutral feeling.”", "pi": "“Sukhāya kho, āvuso visākha, vedanāya rāgānusayo anuseti, dukkhāya vedanāya paṭighānusayo anuseti, adukkhamasukhāya vedanāya avijjānusayo anusetī”ti.", "claims": [], "eval": []}, {"id": "mn44:26.1", "en": "“Do these underlying tendencies always underlie these feelings?”", "pi": "“Sabbāya nu kho, ayye, sukhāya vedanāya rāgānusayo anuseti, sabbāya dukkhāya vedanāya paṭighānusayo anuseti, sabbāya adukkhamasukhāya vedanāya avijjānusayo anusetī”ti?", "claims": [], "eval": []}, {"id": "mn44:26.2", "en": "“No, they do not.”", "pi": "“Na kho, āvuso visākha, sabbāya sukhāya vedanāya rāgānusayo anuseti, na sabbāya dukkhāya vedanāya paṭighānusayo anuseti, na sabbāya adukkhamasukhāya vedanāya avijjānusayo anusetī”ti.", "claims": [], "eval": []}, {"id": "mn44:27.1", "en": "“What should be given up in regard to each of these three feelings?”", "pi": "“Sukhāya panāyye, vedanāya kiṁ pahātabbaṁ, dukkhāya vedanāya kiṁ pahātabbaṁ, adukkhamasukhāya vedanāya kiṁ pahātabban”ti?", "claims": [], "eval": []}, {"id": "mn44:27.2", "en": "“The underlying tendency to greed should be given up when it comes to pleasant feeling. The underlying tendency to aversion should be given up when it comes to painful feeling. The underlying tendency to ignorance should be given up when it comes to neutral feeling.”", "pi": "“Sukhāya kho, āvuso visākha, vedanāya rāgānusayo pahātabbo, dukkhāya vedanāya paṭighānusayo pahātabbo, adukkhamasukhāya vedanāya avijjānusayo pahātabbo”ti.", "claims": [], "eval": []}, {"id": "mn44:28.1", "en": "“Should these underlying tendencies be given up regarding all instances of these feelings?”", "pi": "“Sabbāya nu kho, ayye, sukhāya vedanāya rāgānusayo pahātabbo, sabbāya dukkhāya vedanāya paṭighānusayo pahātabbo, sabbāya adukkhamasukhāya vedanāya avijjānusayo pahātabbo”ti?", "claims": [], "eval": []}, {"id": "mn44:28.2", "en": "“No, not in all instances.", "pi": "“Na kho, āvuso visākha, sabbāya sukhāya vedanāya rāgānusayo pahātabbo, na sabbāya dukkhāya vedanāya paṭighānusayo pahātabbo, na sabbāya adukkhamasukhāya vedanāya avijjānusayo pahātabbo.", "claims": [], "eval": []}, {"id": "mn44:28.3", "en": "Take a mendicant who, quite secluded from sensual pleasures, secluded from unskillful qualities, enters and remains in the first absorption, which has the rapture and bliss born of seclusion, while placing the mind and keeping it connected.", "pi": "Idhāvuso visākha, bhikkhu vivicceva kāmehi vivicca akusalehi dhammehi savitakkaṁ savicāraṁ vivekajaṁ pītisukhaṁ paṭhamaṁ jhānaṁ upasampajja viharati.", "claims": [], "eval": []}, {"id": "mn44:28.4", "en": "With this they give up greed, and the underlying tendency to greed does not lie within that.", "pi": "Rāgaṁ tena pajahati, na tattha rāgānusayo anuseti.", "claims": [], "eval": []}, {"id": "mn44:28.5", "en": "And take a mendicant who reflects:", "pi": "Idhāvuso visākha, bhikkhu iti paṭisañcikkhati:", "claims": [], "eval": []}, {"id": "mn44:28.6", "en": "‘Oh, when will I enter and remain in the same dimension that the noble ones enter and remain in today?’", "pi": "‘kudāssu nāmāhaṁ tadāyatanaṁ upasampajja viharissāmi yadariyā etarahi āyatanaṁ upasampajja viharantī’ti?", "claims": [], "eval": []}, {"id": "mn44:28.7", "en": "Nursing such a longing for the supreme liberations gives rise to sadness due to longing.", "pi": "Iti anuttaresu vimokkhesu pihaṁ upaṭṭhāpayato uppajjati pihāppaccayā domanassaṁ.", "claims": [], "eval": []}, {"id": "mn44:28.8", "en": "With this they give up aversion, and the underlying tendency to aversion does not lie within that.", "pi": "Paṭighaṁ tena pajahati, na tattha paṭighānusayo anuseti.", "claims": [], "eval": []}, {"id": "mn44:28.9", "en": "Take a mendicant who, with the giving up of pleasure and pain and the disappearance of former happiness and sadness, enters and remains in the fourth absorption, without pleasure or pain, with pure equanimity and mindfulness.", "pi": "Idhāvuso visākha, bhikkhu sukhassa ca pahānā, dukkhassa ca pahānā, pubbeva somanassadomanassānaṁ atthaṅgamā, adukkhamasukhaṁ upekkhāsatipārisuddhiṁ catutthaṁ jhānaṁ upasampajja viharati.", "claims": [], "eval": []}, {"id": "mn44:28.10", "en": "With this they give up ignorance, and the underlying tendency to ignorance does not lie within that.”", "pi": "Avijjaṁ tena pajahati, na tattha avijjānusayo anusetī”ti.", "claims": [], "eval": []}, {"id": "mn44:29.1", "en": "“But ma’am, what is the counterpart of pleasant feeling?”", "pi": "“Sukhāya panāyye, vedanāya kiṁ paṭibhāgo”ti?", "claims": [], "eval": []}, {"id": "mn44:29.2", "en": "“Painful feeling.”", "pi": "“Sukhāya kho, āvuso visākha, vedanāya dukkhā vedanā paṭibhāgo”ti.", "claims": [], "eval": []}, {"id": "mn44:29.3", "en": "“What is the counterpart of painful feeling?”", "pi": "“Dukkhāya pannāyye, vedanāya kiṁ paṭibhāgo”ti?", "claims": [], "eval": []}, {"id": "mn44:29.4", "en": "“Pleasant feeling.”", "pi": "“Dukkhāya kho, āvuso visākha, vedanāya sukhā vedanā paṭibhāgo”ti.", "claims": [], "eval": []}, {"id": "mn44:29.5", "en": "“What is the counterpart of neutral feeling?”", "pi": "“Adukkhamasukhāya panāyye, vedanāya kiṁ paṭibhāgo”ti?", "claims": [], "eval": []}, {"id": "mn44:29.6", "en": "“Ignorance.”", "pi": "“Adukkhamasukhāya kho, āvuso visākha, vedanāya avijjā paṭibhāgo”ti.", "claims": [], "eval": []}, {"id": "mn44:29.7", "en": "“What is the counterpart of ignorance?”", "pi": "“Avijjāya panāyye, kiṁ paṭibhāgo”ti?", "claims": [], "eval": []}, {"id": "mn44:29.8", "en": "“Knowledge.”", "pi": "“Avijjāya kho, āvuso visākha, vijjā paṭibhāgo”ti.", "claims": [], "eval": []}, {"id": "mn44:29.9", "en": "“What is the counterpart of knowledge?”", "pi": "“Vijjāya panāyye, kiṁ paṭibhāgo”ti?", "claims": [], "eval": []}, {"id": "mn44:29.10", "en": "“Freedom.”", "pi": "“Vijjāya kho, āvuso visākha, vimutti paṭibhāgo”ti.", "claims": [], "eval": []}, {"id": "mn44:29.11", "en": "“What is the counterpart of freedom?”", "pi": "“Vimuttiyā panāyye, kiṁ paṭibhāgo”ti?", "claims": [], "eval": []}, {"id": "mn44:29.12", "en": "“Extinguishment.”", "pi": "“Vimuttiyā kho, āvuso visākha, nibbānaṁ paṭibhāgo”ti.", "claims": [], "eval": []}, {"id": "mn44:29.13", "en": "“What is the counterpart of extinguishment?”", "pi": "“Nibbānassa panāyye, kiṁ paṭibhāgo”ti?", "claims": [], "eval": []}, {"id": "mn44:29.14", "en": "“Your question goes too far, Visākha. You weren’t able to grasp the limit of questioning.", "pi": "“Accayāsi, āvuso visākha, pañhaṁ, nāsakkhi pañhānaṁ pariyantaṁ gahetuṁ.", "claims": [], "eval": []}, {"id": "mn44:29.15", "en": "For extinguishment is the objective, destination, and culmination of the spiritual life.", "pi": "Nibbānogadhañhi, āvuso visākha, brahmacariyaṁ, nibbānaparāyanaṁ nibbānapariyosānaṁ.", "claims": [], "eval": []}, {"id": "mn44:29.16", "en": "If you wish, go to the Buddha and ask him this question. You should remember it in line with his answer.”", "pi": "Ākaṅkhamāno ca tvaṁ, āvuso visākha, bhagavantaṁ upasaṅkamitvā etamatthaṁ puccheyyāsi, yathā ca te bhagavā byākaroti tathā naṁ dhāreyyāsī”ti.", "claims": [], "eval": []}, {"id": "mn44:30.1", "en": "And then the layman Visākha approved and agreed with what the nun Dhammadinnā said. He rose from his seat, bowed, and respectfully circled her, keeping her on his right. Then he went up to the Buddha, bowed, sat down to one side,", "pi": "Atha kho visākho upāsako dhammadinnāya bhikkhuniyā bhāsitaṁ abhinanditvā anumoditvā uṭṭhāyāsanā dhammadinnaṁ bhikkhuniṁ abhivādetvā padakkhiṇaṁ katvā yena bhagavā tenupasaṅkami; upasaṅkamitvā bhagavantaṁ abhivādetvā ekamantaṁ nisīdi.", "claims": [], "eval": []}, {"id": "mn44:30.2", "en": "and informed the Buddha of all they had discussed.", "pi": "Ekamantaṁ nisinno kho visākho upāsako yāvatako ahosi dhammadinnāya bhikkhuniyā saddhiṁ kathāsallāpo taṁ sabbaṁ bhagavato ārocesi.", "claims": [], "eval": []}, {"id": "mn44:30.3", "en": "When he had spoken, the Buddha said to him,", "pi": "Evaṁ vutte, bhagavā visākhaṁ upāsakaṁ etadavoca:", "claims": [], "eval": []}, {"id": "mn44:30.4", "en": "“The nun Dhammadinnā is astute, Visākha, she has great wisdom.", "pi": "“paṇḍitā, visākha, dhammadinnā bhikkhunī, mahāpaññā, visākha, dhammadinnā bhikkhunī.", "claims": [], "eval": []}, {"id": "mn44:30.5", "en": "If you came to me and asked this question, I would answer it in exactly the same way as the nun Dhammadinnā.", "pi": "Mañcepi tvaṁ, visākha, etamatthaṁ puccheyyāsi, ahampi taṁ evamevaṁ byākareyyaṁ, yathā taṁ dhammadinnāya bhikkhuniyā byākataṁ.", "claims": [], "eval": []}, {"id": "mn44:30.6", "en": "That is what it means, and that’s how you should remember it.”", "pi": "Eso cevetassa attho. Evañca naṁ dhārehī”ti.", "claims": [], "eval": []}, {"id": "mn44:30.7", "en": "That is what the Buddha said.", "pi": "Idamavoca bhagavā.", "claims": [], "eval": []}, {"id": "mn44:30.8", "en": "Satisfied, the layman Visākha approved what the Buddha said.", "pi": "Attamano visākho upāsako bhagavato bhāsitaṁ abhinandīti.", "claims": [], "eval": []}, {"id": "mn44:30.9", "en": "", "pi": "Cūḷavedallasuttaṁ niṭṭhitaṁ catutthaṁ.", "claims": [], "eval": []}], "cited": 1}, {"uid": "sn46.1", "title": "SN 46.1 Himavantasutta — The Himalaya", "layer": "Sutta (early discourses)", "coverage": "partly encoded", "review": "not yet reviewed", "encodes": "The seven factors developed depending on and grounded on ethics (1.4), and the stock formula for each factor (relies on seclusion, fading away and cessation; ripens as letting go) (1.6, 1.12).", "leftOut": "The simile of dragons growing strong on the Himalayas and reaching the ocean (1.2-1.3), and the result 'acquiring great and abundant good qualities' (1.4, 1.13). No simile pattern yet.", "mod , {"id": "sn46.29:3.9", "en": "", "pi": "Navamaṁ.", "claims": [], "eval": []}], "cited": 4}, {"uid": "sn46.3", "title": "SN 46.3 Sīlasutta — Ethics", "layer": "Sutta (early discourses)", "coverage": "partly encoded", "review": "not yet reviewed", "encodes": "The awakening factors arising in sequence, each step a condition with its own words: recollecting and thinking about the teaching gives rise to mindfulness, then investigation, energy, rapture (not of the flesh), tranquility, immersion (with bliss) and equanimity (1.9-8.1); and the seven fruits and benefits they lead to, from enlightenment early in this life to heading upstream to the Akaniṭṭha realm (9.1-9.10).", "leftOut": "Why it matters to see, hear, approach, pay homage to, recollect and go forth following mendicants accomplished in ethics, immersion, knowledge, freedom, and the knowledge and vision of freedom: 'very helpful' (1.1-1.6); and living withdrawn in body and mind after hearing their teaching (1.8). Needs a pattern for what is called helpful, and the link from hearing to withdrawal is not modelled. Within the sequence, each factor is 'initiated', 'developed' and 'perfected' (e.g. 2.2-2.3); only its arising is modelled. Fruits 3-7 come 'with the ending of the five lower fetters' (9.5-9.9): kept in a note, not modelled.", "modelledBy": "project owner with Claude (AI assistant), from SuttaCentral's text", "modelledOn": "2026-11-14", "segments": [{"id": "sn46.3:0.1", "en": "Linked Discourses 46.3", "pi": "Saṁyutta Nikāya 46.3", "claims": [], "eval": []}, {"id": "sn46.3:0.2", "en": "1. Mountains", "pi": "1. Pabbatavagga", "claims": [], "eval": []}, {"id": "sn46.3:0.3", "en": "Ethics", "pi": "Sīlasutta", "claims": [], "eval": []}, {"id": "sn46.3:1.1", "en": "“Mendicants, when a mendicant is accomplished in ethics, immersion, knowledge, freedom, or the knowledge and vision of freedom, even the sight of them is very helpful, I say.", "pi": "“Ye te, bhikkhave, bhikkhū sīlasampannā samādhisampannā ñāṇasampa ?", "pi": "Pariyāyasutta", "claims": [], "eval": []}, {"id": "sn46.52:1.1", "en": "Then several mendicants robed up in the morning and, taking their bowls and robes, entered Sāvatthī for alms.", "pi": "Atha kho sambahulā bhikkhū pubbaṇhasamayaṁ nivāsetvā pattacīvaramādāya sāvatthiṁ piṇḍāya pavisiṁsu.", "claims": [], "eval": []}, {"id": "sn46.52:1.2", "en": "Then it occurred to him,", "pi": "Atha kho tesaṁ bhikkhūnaṁ etadahosi:", "claims": [], "eval": []}, {"id": "sn46.52:1.3", "en": "“It’s too early to wander for alms in Sāvatthī.", "pi": "“atippago kho tāva sāvatthiyaṁ piṇḍāya carituṁ.", "claims": [], "eval": []}, {"id": "sn46.52:1.4", "en": "Why don’t we visit the monastery for the wanderers of other religions?”", "pi": "Yannūna mayaṁ yena aññatitthiyānaṁ paribbājakānaṁ ārāmo tenupasaṅkameyyāmā”ti.", "claims": [], "eval": []}, {"id": "sn46.52:2.1", "en": "Then they went to the monastery for the wanderers of other religions and exchanged greetings with the wanderers there.", "pi": "Atha kho te bhikkhū yena aññatitthiyānaṁ paribbājakānaṁ ārāmo tenupasaṅkamiṁsu; upasaṅkamitvā tehi aññatitthiyehi paribbājakehi saddhiṁ sammodiṁsu.", "claims": [], "eval": []}, {"id": "sn46.52:2.2", "en": "When the greetings and polite conversation were over, they sat down to one side. The wanderers said to them:", "pi": "Sammodanīyaṁ kathaṁ sāraṇīyaṁ vītisāretvā ekamantaṁ nisīdiṁsu. Ekamantaṁ nisinne kho te bhikkhū aññatitthiyā paribbājakā etadavocuṁ:", "claims": [], "eval": []}, {"id": "sn46.52:3.1", "en": "“Reverends, the ascetic Gotama teaches his disciples like this:", "pi": "“Samaṇo, āvuso, gotamo sāvakānaṁ evaṁ dhammaṁ deseti:", "claims": [], "eval": ["Q47"]}, {"id": "sn46.52:3.2", "en": "‘Mendicants, please give up the five hindrances—corruptions of the heart that weaken wisdom—and truly develop the seven awakening factors.’", "pi": "‘etha tumhe, bhikkhave, pañca nīvaraṇe pahāya cetaso upakkilese paññāya dubbalīkaraṇe satta bojjhaṅge yathābhūtaṁ bhāvethā’ti.", "claims": [], "eval": ["Q47"]}, {"id": "sn46.52:3.3", "en": "We too teach our disciples:", "pi": "Mayampi kho, āvuso, sāvakānaṁ evaṁ dhammaṁ desema:", "claims": [], "eval": []}, {"id": "sn46.52:3.4", "en": "‘Reverends, please give up the five hindrances—corruptions of the heart that weaken wisdom—and truly develop the seven awakening factors.’", "pi": "‘etha tumhe, āvuso, pañca nīvaraṇe pahāya cetaso upakkilese paññāya dubbalīkaraṇe satta bojjhaṅge yathābhūtaṁ bhāvethā’ti.", "claims": [], "eval": []}, {"id": "sn46.52:3.5", "en": "What, then, is the difference between the ascetic Gotama’s teaching and instruction and ours?”", "pi": "Idha no, āvuso, ko viseso, ko adhippayāso, kiṁ nānākaraṇaṁ samaṇassa vā gotamassa amhākaṁ vā, yadidaṁ—dhammadesanāya vā dhammadesanaṁ, anusāsaniyā vā anusāsanin”ti?", "claims": [], "eval": []}, {"id": "sn46.52:4.1", "en": "Those mendicants neither approved nor rejected that statement of the wanderers of other religions.", "pi": "Atha kho te bhikkhū tesaṁ aññatitthiyānaṁ paribbājakānaṁ bhāsitaṁ neva abhinandiṁsu nappaṭikkosiṁsu;", "claims": [], "eval": []}, {"id": "sn46.52:4.2", "en": "They rose from their seats, thinking:", "pi": "anabhinanditvā appaṭikkositvā uṭṭhāyāsanā pakkamiṁsu:", "claims": [], "eval": []}, {"id": "sn46.52:4.3", "en": "“We will learn the meaning of this statement from the Buddha himself.”", "pi": "“bhagavato santike etassa bhāsitassa atthaṁ ājānissāmā”ti.", "claims": [], "eval": []}, {"id": "sn46.52:4.4", "en": "Then, after the meal, when they returned from almsround, they went up to the Buddha, bowed, sat down to one side, and told him what had happened.", "pi": "Atha kho te bhikkhū sāvatthiṁ piṇḍāya caritvā pacchābhattaṁ piṇḍapātapaṭikkantā yena bhagavā tenupasaṅkamiṁsu; upasaṅkamitvā bhagavantaṁ abhivādetvā ekamantaṁ nisīdiṁsu. Ekamantaṁ nisinnā kho te bhikkhū bhagavantaṁ etadavocuṁ:", "claims": [], "eval": []}, {"id": "sn46.52:5.1", "en": "", "pi": "“Idha mayaṁ, bhante, pubbaṇhasamayaṁ nivāsetvā pattacīvaramādāya sāvatthiṁ piṇḍāya
