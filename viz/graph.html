1:15.2", "contested": null, "sense": null}, "p-sn46.51-15.3": {"segment": "sn46.51:15.3", "en": "Frequent rational application of mind to them", "pi": "Tattha yonisomanasikārabahulīkāro—", "url": "https://suttacentral.net/sn46.51/en/sujato#sn46.51:15.3", "contested": null, "sense": null}, "p-sn46.51-16.2": {"segment": "sn46.51:16.2", "en": "There is the settled mind.", "pi": "Atthi, bhikkhave, cetaso vūpasamo.", "url": "https://suttacentral.net/sn46.51/en/sujato#sn46.51:16.2", "contested": null, "sense": null}, "p-sn46.51-16.3": {"segment": "sn46.51:16.3", "en": "Frequent rational application of mind to that", "pi": "Tattha yonisomanasikārabahulīkāro—", "url": "https://suttacentral.net/sn46.51/en/sujato#sn46.51:16.3", "contested": null, "sense": null}, "p-sn46.51-17.2": {"segment": "sn46.51:17.2", "en": "There are qualities that are skillful and unskillful, blameworthy and blameless, inferior and superior, and those with a portion of dark or bright.", "pi": "Atthi, bhikkhave, kusalākusalā dhammā sāvajjānavajjā dhammā hīnapaṇītā dhammā kaṇhasukkasappaṭibhāgā dhammā.", "url": "https://suttacentral.net/sn46.51/en/sujato#sn46.51:17.2", "contested": null, "sense": null}, "p-sn46.51-17.3": {"segment": "sn46.51:17.3", "en": "Frequent rational application of mind to them", "pi": "Tattha yonisomanasikārabahulīkāro—", "url": "https://suttacentral.net/sn46.51/en/sujato#sn46.51:17.3", "contested": null, "sense": null}, "p-sn46.51-18.2": {"segment": "sn46.51:18.2", "en": "There are things that are grounds for the awakening factor of mindfulness.", "pi": "Atthi, bhikkhave, satisambojjhaṅgaṭṭhānīyā dhammā.", "url": "https://suttacentral.net/sn46.51/en/sujato#sn46.51:18.2", "contested": null, "sense": null}, "p-sn46.51-18.3": {"segment": "sn46.51:18.3", "en": "Not frequently applying the mind to that", "pi": "Tattha amanasikārabahulīkāro—", "url": "https://suttacentral.net/sn46.51/en/sujato#sn46.51:18.3", "contested": null, "sense": null}, "p-sn46.51-19.2": {"segment": "sn46.51:19.2", "en": "There are qualities that are skillful and unskillful, blameworthy and blameless, inferior and superior, and those with a portion of dark or bright.", "pi": "Atthi, bhikkhave, kusalākusalā dhammā sāvajjānavajjā dhammā hīnapaṇītā dhammā kaṇhasukkasappaṭibhāgā dhammā.", "url": "https://suttacentral.net/sn46.51/en/sujato#sn46.51:19.2", "contested": null, "sense": null}, "p-sn46.51-19.3": {"segment": "sn46.51:19.3", "en": "Not frequently applying the mind to that", "pi": "Tattha amanasikārabahulīkāro—", "url": "https://suttacentral.net/sn46.51/en/sujato#sn46.51:19.3", "contested": null, "sense": null}, "p-sn46.51-2.2": {"segment": "sn46.51:2.2", "en": "There is the feature of aversion.", "pi": "Atthi, bhikkhave, paṭighanimittaṁ.", "url": "https://suttacentral.net/sn46.51/en/sujato#sn46.51:2.2", "contested": null, "sense": null}, "p-sn46.51-2.3": {"segment": "sn46.51:2.3", "en": "Frequent irrational application of mind to that", "pi": "Tattha ayonisomanasikārabahulīkāro—", "url": "https://suttacentral.net/sn46.51/en/sujato#sn46.51:2.3", "contested": null, "sense": null}, "p-sn46.51-20.2": {"segment": "sn46.51:20.2", "en": "There are the elements of initiative, persistence, and exertion.", "pi": "Atthi, bhikkhave, ārambhadhātu nikkamadhātu parakkamadhātu.", "url": "https://suttacentral.net/sn46.51/en/sujato#sn46.51:20.2", "contested": null, "sense": null}, "p-sn46.51-20.3": {"segment": "sn46.51:20.3", "en": "Not frequently applying the mind to that", "pi": "Tattha amanasikārabahulīkāro—", "url": "https://suttacentral.net/sn46.51/en/sujato#sn46.51:20.3", "contested": null, "sense": null}, "p-sn46.51-21.2": {"segment": "sn46.51:21.2", "en": "There are things that are grounds for the awakening factor of rapture.", "pi": "Atthi, bhikkhave, pītisambojjhaṅgaṭṭhānīyā dhammā.", "url": "https://suttacentral.net/sn46.51/en/sujato#sn46.51:21.2", "contested": null, "sense": null}, "p-sn46.51-21.3": {"segment": "sn46.51:21.3", "en": "Not frequently applying the mind to that", "pi": "Tattha amanasikārabahulīkāro—", "url": "https://suttacentral.net/sn46.51/en/sujato#sn46.51:21.3", "contested": null, "sense": null}, "p-sn46.51-22.2": {"segment": "sn46.51:22.2", "en": "There is tranquility of the body and of the mind.", "pi": "Atthi, bhikkhave, kāyappassaddhi cittappassaddhi.", "url": "https://suttacentral.net/sn46.51/en/sujato#sn46.51:22.2", "contested": null, "sense": null}, "p-sn46.51-22.3": {"segment": "sn46.51:22.3", "en": "Not frequently applying the mind to that", "pi": "Tattha amanasikārabahulīkāro—", "url": "https://suttacentral.net/sn46.51/en/sujato#sn46.51:22.3", "contested": null, "sense": null}, "p-sn46.51-23.2": {"segment": "sn46.51:23.2", "en": "There are things that are the basis of serenity and freedom from distraction.", "pi": "Atthi, bhikkhave, samathanimittaṁ abyagganimittaṁ.", "url": "https://suttacentral.net/sn46.51/en/sujato#sn46.51:23.2", "contested": null, "sense": null}, "p-sn46.51-23.3": {"segment": "sn46.51:23.3", "en": "Not frequently applying the mind to that", "pi": "Tattha amanasikārabahulīkāro—", "url": "https://suttacentral.net/sn46.51/en/sujato#sn46.51:23.3", "contested": null, "sense": null}, "p-sn46.51-24.2": {"segment": "sn46.51:24.2", "en": "There are things that are grounds for the awakening factor of equanimity.", "pi": "Atthi, bhikkhave, upekkhāsambojjhaṅgaṭṭhānīyā dhammā.", "url": "https://suttacentral.net/sn46.51/en/sujato#sn46.51:24.2", "contested": null, "sense": null}, "p-sn46.51-24.3": {"segment": "sn46.51:24.3", "en": "Not frequently applying the mind to that", "pi": "Tattha amanasikārabahulīkāro—", "url": "https://suttacentral.net/sn46.51/en/sujato#sn46.51:24.3", "contested": null, "sense": null}, "p-sn46.51-3.2": {"segment": "sn46.51:3.2", "en": "There is discontent, sloth, yawning, sleepiness after eating, and mental sluggishness.", "pi": "Atthi, bhikkhave, arati tandi vijambhitā bhattasammado cetaso ca līnattaṁ.", "url": "https://suttacentral.net/sn46.51/en/sujato#sn46.51:3.2", "contested": null, "sense": null}, "p-sn46.51-3.3": {"segment": "sn46.51:3.3", "en": "Frequent irrational application of mind to that", "pi": "Tattha ayonisomanasikārabahulīkāro—", "url": "https://suttacentral.net/sn46.51/en/sujato#sn46.51:3.3", "contested": null, "sense": null}, "p-sn46.51-4.2": {"segment": "sn46.51:4.2", "en": "There is the unsettled mind.", "pi": "Atthi, bhikkhave, cetaso avūpasamo.", "url": "https://suttacentral.net/sn46.51/en/sujato#sn46.51:4.2", "contested": null, "sense": null}, "p-sn46.51-4.3": {"segment": "sn46.51:4.3", "en": "Frequent irrational application of mind to that", "pi": "Tattha ayonisomanasikārabahulīkāro—", "url": "https://suttacentral.net/sn46.51/en/sujato#sn46.51:4.3", "contested": null, "sense": null}, "p-sn46.51-5.2": {"segment": "sn46.51:5.2", "en": "There are things that are grounds for doubt.", "pi": "Atthi, bhikkhave, vicikicchāṭṭhānīyā dhammā.", "url": "https://suttacentral.net/sn46.51/en/sujato#sn46.51:5.2", "contested": null, "sense": null}, "p-sn46.51-5.3": {"segment": "sn46.51:5.3", "en": "Frequent irrational application of mind to them", "pi": "Tattha ayonisomanasikārabahulīkāro—", "url": "https://suttacentral.net/sn46.51/en/sujato#sn46.51:5.3", "contested": null, "sense": null}, "p-sn46.51-6.2": {"segment": "sn46.51:6.2", "en": "There are things that are grounds for the awakening factor of mindfulness.", "pi": "Atthi, bhikkhave, satisambojjhaṅgaṭṭhānīyā dhammā.", "url": "https://suttacentral.net/sn46.51/en/sujato#sn46.51:6.2", "contested": null, "sense": null}, "p-sn46.51-6.3": {"segment": "sn46.51:6.3", "en": "Frequent rational application of mind to them", "pi": "Tattha yonisomanasikārabahulīkāro—", "url": "https://suttacentral.net/sn46.51/en/sujato#sn46.51:6.3", "contested": null, "sense": null}, "p-sn46.51-7.2": {"segment": "sn46.51:7.2", "en": "There are qualities that are skillful and unskillful, blameworthy and blameless, inferior and superior, and those with a portion of dark or bright.", "pi": "Atthi, bhikkhave, kusalākusalā dhammā sāvajjānavajjā dhammā hīnapaṇītā dhammā kaṇhasukkasappaṭibhāgā dhammā.", "url": "https://suttacentral.net/sn46.51/en/sujato#sn46.51:7.2", "contested": null, "sense": "DhammaQuality"}, "p-sn46.51-7.3": {"segment": "sn46.51:7.3", "en": "Frequent rational application of mind to them", "pi": "Tattha yonisomanasikārabahulīkāro—", "url": "https://suttacentral.net/sn46.51/en/sujato#sn46.51:7.3", "contested": null, "sense": null}, "p-sn46.51-8.2": {"segment": "sn46.51:8.2", "en": "There are the elements of initiative, persistence, and exertion.", "pi": "Atthi, bhikkhave, ārambhadhātu nikkamadhātu parakkamadhātu.", "url": "https://suttacentral.net/sn46.51/en/sujato#sn46.51:8.2", "contested": null, "sense": null}, "p-sn46.51-8.3": {"segment": "sn46.51:8.3", "en": "Frequent rational application of mind to them", "pi": "Tattha yonisomanasikārabahulīkāro—", "url": "https://suttacentral.net/sn46.51/en/sujato#sn46.51:8.3", "contested": null, "sense": null}, "p-sn46.51-9.2": {"segment": "sn46.51:9.2", "en": "There are things that are grounds for the awakening factor of rapture.", "pi": "Atthi, bhikkhave, pītisambojjhaṅgaṭṭhānīyā dhammā.", "url": "https://suttacentral.net/sn46.51/en/sujato#sn46.51:9.2", "contested": null, "sense": null}, "p-sn46.51-9.3": {"segment": "sn46.51:9.3", "en": "Frequent rational application of mind to them", "pi": "Tattha yonisomanasikārabahulīkāro—", "url": "https://suttacentral.net/sn46.51/en/sujato#sn46.51:9.3", "contested": null, "sense": null}, "p-sn46.53-10.1": {"segment": "sn46.53:10.1", "en": "When the mind is restless, it’s the wrong time to develop the awakening factors of investigation of principles, energy, and rapture.", "pi": "Yasmiṁ, bhikkhave, samaye uddhataṁ cittaṁ hoti, akālo tasmiṁ samaye dhammavicayasambojjhaṅgassa bhāvanāya, akālo vīriyasambojjhaṅgassa bhāvanāya, akālo pītisambojjhaṅgassa bhāvanāya.", "url": "https://suttacentral.net/sn46.53/en/sujato#sn46.53:10.1", "contested": null, "sense": null}, "p-sn46.53-10.3": {"segment": "sn46.53:10.3", "en": "Because it’s hard to settle a restless mind with these things.", "pi": "Uddhataṁ, bhikkhave, cittaṁ taṁ etehi dhammehi duvūpasamayaṁ hoti.", "url": "https://suttacentral.net/sn46.53/en/sujato#sn46.53:10.3", "contested": null, "sense": null}, "p-sn46.53-13.1": {"segment": "sn46.53:13.1", "en": "When the mind is restless, it’s the right time to develop the awakening factors of tranquility, immersion, and equanimity.", "pi": "Yasmiñca kho, bhikkhave, samaye uddhataṁ cittaṁ hoti, kālo tasmiṁ samaye passaddhisambojjhaṅgassa bhāvanāya, kālo samādhisambojjhaṅgassa bhāvanāya, kālo upekkhāsambojjhaṅgassa bhāvanāya.", "url": "https://suttacentral.net/sn46.53/en/sujato#sn46.53:13.1", "contested": null, "sense": null}, "p-sn46.53-13.3": {"segment": "sn46.53:13.3", "en": "Because it’s easy to settle a restless mind with these things.", "pi": "Uddhataṁ, bhikkhave, cittaṁ taṁ etehi dhammehi suvūpasamayaṁ hoti.", "url": "https://suttacentral.net/sn46.53/en/sujato#sn46.53:13.3", "contested": null, "sense": null}, "p-sn46.53-15.4": {"segment": "sn46.53:15.4", "en": "But mindfulness is always useful, I say.”", "pi": "Satiñca khvāhaṁ, bhikkhave, sabbatthikaṁ vadāmī”ti.", "url": "https://suttacentral.net/sn46.53/en/sujato#sn46.53:15.4", "contested": null, "sense": null}, "p-sn46.53-4.1": {"segment": "sn46.53:4.1", "en": "When the mind is sluggish, it’s the wrong time to develop the awakening factors of tranquility, immersion, and equanimity.", "pi": "Yasmiṁ, bhikkhave, samaye līnaṁ cittaṁ hoti, akālo tasmiṁ samaye passaddhisambojjhaṅgassa bhāvanāya, akālo samādhisambojjhaṅgassa bhāvanāya, akālo upekkhāsambojjhaṅgassa bhāvanāya.", "url": "https://suttacentral.net/sn46.53/en/sujato#sn46.53:4.1", "contested": null, "sense": null}, "p-sn46.53-4.3": {"segment": "sn46.53:4.3", "en": "Because it’s hard to stimulate a sluggish mind with these things.", "pi": "Līnaṁ, bhikkhave, cittaṁ taṁ etehi dhammehi dussamuṭṭhāpayaṁ hoti.", "url": "https://suttacentral.net/sn46.53/en/sujato#sn46.53:4.3", "contested": null, "sense": null}, "p-sn46.53-7.1": {"segment": "sn46.53:7.1", "en": "When the mind is sluggish, it’s the right time to develop the awakening factors of investigation of principles, energy, and rapture.", "pi": "Yasmiñca kho, bhikkhave, samaye līnaṁ cittaṁ hoti, kālo tasmiṁ samaye dhammavicayasambojjhaṅgassa bhāvanāya, kālo vīriyasambojjhaṅgassa bhāvanāya, kālo pītisambojjhaṅgassa bhāvanāya.", "url": "https://suttacentral.net/sn46.53/en/sujato#sn46.53:7.1", "contested": null, "sense": null}, "p-sn46.53-7.3": {"segment": "sn46.53:7.3", "en": "Because it’s easy to stimulate a sluggish mind with these things.", "pi": "Līnaṁ, bhikkhave, cittaṁ taṁ etehi dhammehi susamuṭṭhāpayaṁ hoti.", "url": "https://suttacentral.net/sn46.53/en/sujato#sn46.53:7.3", "contested": null, "sense": null}, "p-sn46.56-2.3": {"segment": "sn46.56:2.3", "en": "“There’s a time when the heart is overcome and mired in sensual desire, without truly knowing and seeing the escape from sensual desire that has arisen.", "pi": "“Yasmiṁ kho, rājakumāra, samaye kāmarāgapariyuṭṭhitena cetasā viharati kāmarāgaparetena, uppannassa ca kāmarāgassa nissaraṇaṁ yathābhūtaṁ na jānāti na passati—", "url": "https://suttacentral.net/sn46.56/en/sujato#sn46.56:2.3", "contested": null, "sense": null}, "p-sn46.56-2.4": {"segment": "sn46.56:2.4", "en": "This is a cause and reason for not knowing and not seeing.", "pi": "ayampi kho, rājakumāra, hetu, ayaṁ paccayo aññāṇāya adassanāya.", "url": "https://suttacentral.net/sn46.56/en/sujato#sn46.56:2.4", "contested": null, "sense": null}, "p-sn46.56-3.4": {"segment": "sn46.56:3.4", "en": "doubt, without truly knowing and seeing the escape from doubt that has arisen.", "pi": "vicikicchāpariyuṭṭhitena cetasā viharati vicikicchāparetena, uppannāya ca vicikicchāya nissaraṇaṁ yathābhūtaṁ na jānāti na passati—", "url": "https://suttacentral.net/sn46.56/en/sujato#sn46.56:3.4", "contested": null, "sense": null}, "p-sn46.56-3.5": {"segment": "sn46.56:3.5", "en": "This is a cause and reason for not knowing and not seeing.", "pi": "ayampi kho, rājakumāra, hetu, ayaṁ paccayo aññāṇāya adassanāya.", "url": "https://suttacentral.net/sn46.56/en/sujato#sn46.56:3.5", "contested": null, "sense": null}, "p-sn46.56-5.3": {"segment": "sn46.56:5.3", "en": "“It’s when a mendicant develops the awakening factor of mindfulness, which relies on seclusion, fading away, and cessation, and ripens as letting go.", "pi": "“Idha, rājakumāra, bhikkhu satisambojjhaṅgaṁ bhāveti vivekanissitaṁ virāganissitaṁ nirodhanissitaṁ vossaggapariṇāmiṁ.", "url": "https://suttacentral.net/sn46.56/en/sujato#sn46.56:5.3", "contested": null, "sense": null}, "p-sn46.56-5.4": {"segment": "sn46.56:5.4", "en": "They truly know and see with a mind that has developed the awakening factor of mindfulness.", "pi": "So satisambojjhaṅgaṁ bhāvitena cittena yathābhūtaṁ jānāti passati—", "url": "https://suttacentral.net/sn46.56/en/sujato#sn46.56:5.4", "contested": null, "sense": null}, "p-sn46.56-5.5": {"segment": "sn46.56:5.5", "en": "This is a cause and reason for knowing and seeing.", "pi": "ayampi kho, rājakumāra, hetu, ayaṁ paccayo ñāṇāya dassanāya.", "url": "https://suttacentral.net/sn46.56/en/sujato#sn46.56:5.5", "contested": null, "sense": null}, "p-sn46.56-6.2": {"segment": "sn46.56:6.2", "en": "equanimity, which rely on seclusion, fading away, and cessation, and ripen as letting go.", "pi": "upekkhāsambojjhaṅgaṁ bhāveti vivekanissitaṁ virāganissitaṁ nirodhanissitaṁ vossaggapariṇāmiṁ.", "url": "https://suttacentral.net/sn46.56/en/sujato#sn46.56:6.2", "contested": null, "sense": null}, "p-sn46.56-6.3": {"segment": "sn46.56:6.3", "en": "They truly know and see with a mind that has developed the awakening factor of equanimity.", "pi": "So upekkhāsambojjhaṅgaṁ bhāvitena cittena yathābhūtaṁ jānāti passati—", "url": "https://suttacentral.net/sn46.56/en/sujato#sn46.56:6.3", "contested": null, "sense": null}, "p-sn46.56-6.4": {"segment": "sn46.56:6.4", "en": "This is a cause and reason for knowing and seeing.", "pi": "ayampi kho, rājakumāra, hetu, ayaṁ paccayo ñāṇāya dassanāya.", "url": "https://suttacentral.net/sn46.56/en/sujato#sn46.56:6.4", "contested": null, "sense": null}, "p-sn46.57-1.2": {"segment": "sn46.57:1.2", "en": "“Mendicants, when the perception of a skeleton is developed and cultivated it’s very fruitful and beneficial.", "pi": "“Aṭṭhikasaññā, bhikkhave, bhāvitā bahulīkatā mahapphalā hoti mahānisaṁsā.", "url": "https://suttacentral.net/sn46.57/en/sujato#sn46.57:1.2", "contested": null, "sense": null}, "p-sn46.57-1.4": {"segment": "sn46.57:1.4", "en": "It’s when a mendicant develops the perception of a skeleton together with the awakening factors of mindfulness, investigation of principles, energy, rapture, tranquility, immersion,", "pi": "Idha, bhikkhave, bhikkhu aṭṭhikasaññāsahagataṁ satisambojjhaṅgaṁ bhāveti vivekanissitaṁ virāganissitaṁ nirodhanissitaṁ vossaggapariṇāmiṁ …pe…", "url": "https://suttacentral.net/sn46.57/en/sujato#sn46.57:1.4", "contested": null, "sense": null}, "p-sn46.57-1.5": {"segment": "sn46.57:1.5", "en": "and equanimity, which rely on seclusion, fading away, and cessation, and ripen as letting go.", "pi": "aṭṭhikasaññāsahagataṁ upekkhāsambojjhaṅgaṁ bhāveti vivekanissitaṁ virāganissitaṁ nirodhanissitaṁ vossaggapariṇāmiṁ.", "url": "https://suttacentral.net/sn46.57/en/sujato#sn46.57:1.5", "contested": null, "sense": null}, "p-sn46.57-1.6": {"segment": "sn46.57:1.6", "en": "That’s how the perception of a skeleton, when developed and cultivated, is very fruitful and beneficial.”", "pi": "Evaṁ bhāvitā kho, bhikkhave, aṭṭhikasaññā evaṁ bahulīkatā mahapphalā hoti mahānisaṁsā”ti.", "url": "https://suttacentral.net/sn46.57/en/sujato#sn46.57:1.6", "contested": null, "sense": null}, "p-sn46.57-2.1": {"segment": "sn46.57:2.1", "en": "“When the perception of a skeleton is developed and cultivated you can expect one of two results: enlightenment in this very life, or if there’s residue left behind, non-return.", "pi": "“Aṭṭhikasaññāya, bhikkhave, bhāvitāya bahulīkatāya dvinnaṁ phalānaṁ aññataraṁ phalaṁ pāṭikaṅkhaṁ—diṭṭheva dhamme aññā, sati vā upādisese anāgāmitā.", "url": "https://suttacentral.net/sn46.57/en/sujato#sn46.57:2.1", "contested": null, "sense": null}, "p-sn46.57-3.1": {"segment": "sn46.57:3.1", "en": "“Mendicants, when the perception of a skeleton is developed and cultivated it leads to great benefit.", "pi": "“Aṭṭhikasaññā, bhikkhave, bhāvitā bahulīkatā mahato atthāya saṁvattati.", "url": "https://suttacentral.net/sn46.57/en/sujato#sn46.57:3.1", "contested": null, "sense": null}, "p-sn46.57-4.1": {"segment": "sn46.57:4.1", "en": "“Mendicants, when the perception of a skeleton is developed and cultivated it leads to great sanctuary from the yoke.", "pi": "“Aṭṭhikasaññā, bhikkhave, bhāvitā bahulīkatā mahato yogakkhemāya saṁvattati.", "url": "https://suttacentral.net/sn46.57/en/sujato#sn46.57:4.1", "contested": null, "sense": null}, "p-sn46.57-5.1": {"segment": "sn46.57:5.1", "en": "“Mendicants, when the perception of a skeleton is developed and cultivated it leads to great inspiration.", "pi": "“Aṭṭhikasaññā, bhikkhave, bhāvitā bahulīkatā mahato saṁvegāya saṁvattati.", "url": "https://suttacentral.net/sn46.57/en/sujato#sn46.57:5.1", "contested": null, "sense": null}, "p-sn46.57-6.1": {"segment": "sn46.57:6.1", "en": "“Mendicants, when the perception of a skeleton is developed and cultivated it leads to dwelling in great ease.", "pi": "“Aṭṭhikasaññā, bhikkhave, bhāvitā bahulīkatā mahato phāsuvihārāya saṁvattati.", "url": "https://suttacentral.net/sn46.57/en/sujato#sn46.57:6.1", "contested": null, "sense": null}, "p-sn46.58-1.1": {"segment": "sn46.58:1.1", "en": "“Mendicants, when the perception of a worm-infested corpse is developed and cultivated it’s very fruitful and beneficial. …”", "pi": "“Puḷavakasaññā, bhikkhave, bhāvitā …pe…”", "url": "https://suttacentral.net/sn46.58/en/sujato#sn46.58:1.1", "contested": null, "sense": null}, "p-sn46.59-1.1": {"segment": "sn46.59:1.1", "en": "“Mendicants, when the perception of a livid corpse is developed and cultivated it’s very fruitful and beneficial. …”", "pi": "“Vinīlakasaññā, bhikkhave …pe…”", "url": "https://suttacentral.net/sn46.59/en/sujato#sn46.59:1.1", "contested": null, "sense": null}, "p-sn46.60-1.1": {"segment": "sn46.60:1.1", "en": "“Mendicants, when the perception of a split open corpse is developed and cultivated it’s very fruitful and beneficial. …”", "pi": "“Vicchiddakasaññā, bhikkhave …pe…”", "url": "https://suttacentral.net/sn46.60/en/sujato#sn46.60:1.1", "contested": null, "sense": null}, "p-sn46.61-1.1": {"segment": "sn46.61:1.1", "en": "“Mendicants, when the perception of a bloated corpse is developed and cultivated it’s very fruitful and beneficial. …”", "pi": "“Uddhumātakasaññā, bhikkhave …pe…”", "url": "https://suttacentral.net/sn46.61/en/sujato#sn46.61:1.1", "contested": null, "sense": null}, "p-sn46.62-1.1": {"segment": "sn46.62:1.1", "en": "“Mendicants, when love is developed and cultivated it’s very fruitful and beneficial. …”", "pi": "“Mettā, bhikkhave, bhāvitā …pe…”", "url": "https://suttacentral.net/sn46.62/en/sujato#sn46.62:1.1", "contested": null, "sense": null}, "p-sn46.63-1.1": {"segment": "sn46.63:1.1", "en": "“Mendicants, when compassion is developed and cultivated it’s very fruitful and beneficial. …”", "pi": "“Karuṇā, bhikkhave, bhāvitā …pe…”", "url": "https://suttacentral.net/sn46.63/en/sujato#sn46.63:1.1", "contested": null, "sense": null}, "p-sn46.64-1.1": {"segment": "sn46.64:1.1", "en": "“Mendicants, when rejoicing is developed and cultivated it’s very fruitful and beneficial. …”", "pi": "“Muditā, bhikkhave, bhāvitā …pe…”", "url": "https://suttacentral.net/sn46.64/en/sujato#sn46.64:1.1", "contested": null, "sense": null}, "p-sn46.65-1.1": {"segment": "sn46.65:1.1", "en": "“Mendicants, when equanimity is developed and cultivated it’s very fruitful and beneficial. …”", "pi": "“Upekkhā, bhikkhave, bhāvitā …pe…”", "url": "https://suttacentral.net/sn46.65/en/sujato#sn46.65:1.1", "contested": null, "sense": null}, "p-sn46.66-1.1": {"segment": "sn46.66:1.1", "en": "“Mendicants, when mindfulness of breathing is developed and cultivated it’s very fruitful and beneficial. …”", "pi": "“Ānāpānassati, bhikkhave, bhāvitā …pe…”", "url": "https://suttacentral.net/sn46.66/en/sujato#sn46.66:1.1", "contested": null, "sense": null}, "p-sn46.67-1.1": {"segment": "sn46.67:1.1", "en": "“Mendicants, when the perception of ugliness is developed and cultivated it’s very fruitful and beneficial. …”", "pi": "“Asubhasaññā, bhikkhave …pe…”", "url": "https://suttacentral.net/sn46.67/en/sujato#sn46.67:1.1", "contested": null, "sense": null}, "p-sn46.68-1.1": {"segment": "sn46.68:1.1", "en": "“Mendicants, when the perception of death is developed and cultivated it’s very fruitful and beneficial. …”", "pi": "“Maraṇasaññā, bhikkhave …pe…”", "url": "https://suttacentral.net/sn46.68/en/sujato#sn46.68:1.1", "contested": null, "sense": null}, "p-sn46.69-1.1": {"segment": "sn46.69:1.1", "en": "“Mendicants, when the perception of repulsiveness of food is developed and cultivated it’s very fruitful and beneficial. …”", "pi": "“Āhāre paṭikūlasaññā, bhikkhave …pe…”", "url": "https://suttacentral.net/sn46.69/en/sujato#sn46.69:1.1", "contested": null, "sense": null}, "p-sn46.7-1.2": {"segment": "sn46.7:1.2", "en": "In the same way, a mendicant who develops and cultivates the seven awakening factors slants, slopes, and inclines to extinguishment.", "pi": "evameva kho, bhikkhave, bhikkhu satta bojjhaṅge bhāvento satta bojjhaṅge bahulīkaronto nibbānaninno hoti nibbānapoṇo nibbānapabbhāro.", "url": "https://suttacentral.net/sn46.7/en/sujato#sn46.7:1.2", "contested": null, "sense": null}, "p-sn46.7-2.3": {"segment": "sn46.7:2.3", "en": "and equanimity, which rely on seclusion, fading away, and cessation, and ripen as letting go.", "pi": "upekkhāsambojjhaṅgaṁ bhāveti vivekanissitaṁ virāganissitaṁ nirodhanissitaṁ vossaggapariṇāmiṁ.", "url": "https://suttacentral.net/sn46.7/en/sujato#sn46.7:2.3", "contested": null, "sense": null}, "p-sn46.7-2.4": {"segment": "sn46.7:2.4", "en": "That’s how a mendicant who develops and cultivates the seven awakening factors slants, slopes, and inclines to extinguishment.”", "pi": "Evaṁ kho, bhikkhave, bhikkhu satta bojjhaṅge bhāvento satta bojjhaṅge bahulīkaronto nibbānaninno hoti nibbānapoṇo nibbānapabbhāro”ti.", "url": "https://suttacentral.net/sn46.7/en/sujato#sn46.7:2.4", "contested": null, "sense": null}, "p-sn46.70-1.1": {"segment": "sn46.70:1.1", "en": "“Mendicants, when the perception of dissatisfaction with the whole world is developed and cultivated it’s very fruitful and beneficial. …”", "pi": "“Sabbaloke anabhiratisaññā, bhikkhave …pe…”", "url": "https://suttacentral.net/sn46.70/en/sujato#sn46.70:1.1", "contested": null, "sense": null}, "p-sn46.71-1.1": {"segment": "sn46.71:1.1", "en": "“Mendicants, when the perception of impermanence is developed and cultivated it’s very fruitful and beneficial. …”", "pi": "“Aniccasaññā, bhikkhave …pe…”", "url": "https://suttacentral.net/sn46.71/en/sujato#sn46.71:1.1", "contested": null, "sense": null}, "p-sn46.72-1.1": {"segment": "sn46.72:1.1", "en": "“Mendicants, when the perception of suffering in impermanence is developed and cultivated it’s very fruitful and beneficial. …”", "pi": "“Anicce dukkhasaññā, bhikkhave …pe…”", "url": "https://suttacentral.net/sn46.72/en/sujato#sn46.72:1.1", "contested": null, "sense": null}, "p-sn46.73-1.1": {"segment": "sn46.73:1.1", "en": "“Mendicants, when the perception of not-self in suffering is developed and cultivated it’s very fruitful and beneficial. …”", "pi": "“Dukkhe anattasaññā, bhikkhave …pe…”", "url": "https://suttacentral.net/sn46.73/en/sujato#sn46.73:1.1", "contested": null, "sense": null}, "p-sn46.74-1.1": {"segment": "sn46.74:1.1", "en": "“Mendicants, when the perception of giving up is developed and cultivated it’s very fruitful and beneficial. …”", "pi": "“P // ------------------------------------------------------------------ elements
function allEdges() {
  const out = DATA.edges.map(e => ({ ...e, group: groupOf(e) }));
  for (const n of DATA.nutriments) {
    if (state.mode === "arrow") {
      out.push({ id: n.id, source: n.object, target: n.target, rel: n.effect, layer: "sutta", cites: n.cites,
        attention: n.attention, attentionId: n.attentionId, group: "nutriment", nutriment: n.id });
    } else {
      out.push({ id: n.id + "-o", source: n.object, target: n.id, rel: "object", layer: "sutta", cites: [], group: "nutriment", nutriment: n.id });
      out.push({ id: n.id + "-t", source: n.id, target: n.target, rel: n.effect, layer: "sutta", cites: n.cites,
        attention: n.attention, attentionId: n.attentionId, group: "nutriment", nutriment: n.id });
    }
  }
  return out;
}

function elements() {
  const edges = allEdges().filter(e => state.groups[e.group]);
  const nodes = DATA.nodes.map(n => ({ ...n }));
  if (state.mode === "node" && state.groups.nutriment) {
    for (const n of DATA.nutriments) nodes.push({ id: n.id, kind: "nutriment", en: n.id, nutrimentOf: n });
  }
  // Hide nodes with nothing visible attached, except the core qualities.
  const used = new Set(edges.flatMap(e => [e.source, e.target]));
  const core = new Set(["hindrance", "factor", "jhana", "mindstate"]);
  return [
    ...nodes.filter(n => core.has(n.kind) || used.has(n.id)).map(n => ({ data: {
      id: n.id, label: n.kind === "nutriment" ? "" : (n.en || n.pi), kind: n.kind,
      both: (n.classes || []).length > 1 ? "yes" : "no" } })),
    ...edges.map(e => ({ data: { ...e, label: e.rel === "counters" ? "counters" : "" } })),
  ];
}

// ------------------------------------------------------------------ graph
const cy = cytoscape({ container: document.getElementById("cy"), elements: elements(), style: style(),
  wheelSensitivity: 0.25, minZoom: 0.2, maxZoom: 3 });

function layout() {
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  cy.layout({ name: "cose", animate: !reduce, animationDuration: 600, nodeDimensionsIncludeLabels: true,
    idealEdgeLength: e => e.data("group") === "lists" ? 140 : 90, nodeRepulsion: () => 14000,
    edgeElasticity: e => e.data("group") === "lists" ? 40 : 100, gravity: 0.6, numIter: 2500, padding: 24,
    randomize: true, componentSpacing: 90, stop: () => focus(state.selected, false) }).run();
}

function render(relayout) {
  const pos = {};
  cy.nodes().forEach(n => { pos[n.id()] = { ...n.position() }; });
  cy.elements().remove();
  cy.add(elements());
  let missing = false;
  cy.nodes().forEach(n => { if (pos[n.id()]) n.position(pos[n.id()]); else missing = true; });
  if (relayout || missing) layout(); else focus(state.selected, false);
}

function focus(id, center = true) {
  cy.elements().removeClass("dim focus hot");
  const node = cy.getElementById(id);
  if (!node.length) return;
  const hood = node.closedNeighborhood();
  cy.elements().not(hood).addClass("dim");
  node.addClass("focus");
  node.connectedEdges().addClass("hot");
  if (center) cy.animate({ center: { eles: node }, duration: 300 });
}

cy.on("tap", "node", ev => {
  const d = ev.target.data();
  if (d.kind === "nutriment") return showNutriment(d.id);
  select(d.id, false);
});
cy.on("tap", "edge", ev => showEdge(ev.target.data()));
cy.on("tap", ev => { if (ev.target === cy) { cy.elements().removeClass("dim focus hot"); } });

function select(id, center = true) {
  state.selected = id;
  focus(id, center);
  showNode(id);
}

    <div class="quotes"></div>`;
}
panel.addEventListener("click", ev => {
  const b = ev.target.closest(".cite");
  if (b) {
    const box = b.closest(".claim, .block").querySelector(".quotes");
    const p = DATA.passages[b.dataset.p];
    const open = b.getAttribute("aria-expanded") === "true";
    b.setAttribute("aria-expanded", String(!open));
    b.setAttribute("aria-pressed", String(!open));
    const existing = box.querySelector(`[data-q="${b.dataset.p}"]`);
    if (open && existing) existing.remove();
    else if (p && !existing) box.insertAdjacentHTML("beforeend",
      `<div class="quote" data-q="${esc(b.dataset.p)}">“${esc(p.en)}”<span class="pi">${esc(p.pi)}</span>
       <a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.segment)} on SuttaCentral ↗</a></div>`);
    return;
  }
  const a = ev.target.closest("a.node");
  if (a) { ev.preventDefault(); select(a.dataset.id); }
});
const link = id => `<a class="node" data-id="${esc(id)}" href="#">${esc(name(id))}</a>`;
const layerTag = l => `<span class="layer l-${l}">${LAYER_NAME[l] || l}</span>`;

function header(n) {
  const kindChips = (n.classes || []).map(c => {
    const k = c.startsWith("Hindrance") ? "hindrance" : c.startsWith("Awakening") ? "factor" : "jhana";
    return `<span class="chip k-${k}">${esc(c)}</span>`;
  }).join("");
  const other = { concept: "Concept", attention: "Kind of attention", mindstate: "Mind state", object: "Object of attention", list: "Numbered list", attainment: "Attainment",
    word: "Word (lexical entry)", sense: "Word sense" }[n.kind];
  return `<h2>${esc(n.en || n.pi)}</h2>
    <div class="names">${n.pi && n.pi !== n.en ? `<i>${esc(n.pi)}</i>` : ""}${n.zh ? ` · ${esc(n.zh)}` : ""}</div>
    <div class="chips">${kindChips}${other ? `<span class="chip">${other}</span>` : ""}</div>
    ${n.inferred ? `<div class="small">Type inferred by the OWL reasoner from list membership, never written by hand.</div>` : ""}
    ${n.alt?.length ? `<div class="small">Also: ${n.alt.map(esc).join(", ")}</div>` : ""}
    ${n.hidden?.length ? `<div class="small">Search words: ${n.hidden.map(esc).join(", ")}</div>` : ""}
    ${n.definition ? `<p class="def">${esc(n.definition)}</p>` : ""}
    ${n.note ? `<p class="small">${esc(n.note)}</p>` : ""}
    ${n.cites?.length ? `<div class="block"><div class="small">Stated in:</div>${citeHtml(n.cites)}</div>` : ""}`;
}

function showNode(id) {
  const n = byId[id];
  if (!n) return;
  const groups = {};
  const add = (title, html) => (groups[title] ||= []).push(html);
  for (const e of allEdges()) {
    const out = e.source === id, inc = e.target === id;
    if ((!out && !inc) || e.rel === "object") continue;
    const other = out ? e.target : e.source;
    if (byId[other] === undefined && !e.nutriment) continue;
    let title = out ? e.rel : (e.inv || INVERSE[e.rel] || e.rel);
    let what = link(other);
    if (e.nutriment) {
      const nu = DATA.nutriments.find(x => x.id === e.nutriment);
      if (out && byId[id].kind === "object") what = `${link(nu.target)} <span class="small">with ${esc(nu.attention)}</span>`;
      else what = `${esc(nu.attention)} to ${link(nu.object)}`;
      title = out ? nu.effect : INVERSE[nu.effect];
    }
    add(title, `<div class="claim">${what}${layerTag(e.layer)}${e.note ? `<div class="note">${esc(e.note)}</div>` : ""}${citeHtml(e.cites)}</div>`);
  }
  for (const t of DATA.timing.filter(t => !t.state && t.factor === id)) {
    add("timing", `<div class="claim">${esc(t.timing)}${layerTag("sutta")}${citeHtml(t.cites)}</div>`);
  }
  for (const [pid, p] of Object.entries(DATA.passages)) {
    if (p.sense === id) add("passages using this sense", `<div class="claim">${esc(p.segment)}${citeHtml([pid])}</div>`);
  }
  if (n.kind === "word") {
    for (const [pid, p] of Object.entries(DATA.passages)) if (p.contested)
      add("contested, left unassigned", `<div class="claim">${esc(p.segment)} <span class="small">rendered “${esc(p.contested)}”</span>${citeHtml([pid])}</div>`);
  }
  panel.innerHTML = header(n) + Object.entries(groups).map(([t, rows]) =>
    `<section class="rel"><h3>${esc(t)}</h3>${rows.join("")}</section>`).join("");
}

function showNutriment(id) {
  const n = DATA.nutriments.find(x => x.id === id);
  state.selected = id;
  focus(id, false);
  panel.innerHTML = `<h2>Nutriment ${esc(id)}</h2>
    <p class="small">One of SN 46.51's 24 statements, stored as its own node (an n-ary relation) so the attention isn't lost.</p>
    <div class="block claim">${esc(n.attention)} to ${link(n.object)} <b>${esc(n.effect)}</b> ${link(n.target)}${layerTag("sutta")}${citeHtml(n.cites)}</div>`;
}

function showEdge(e) {
  if (e.nutriment) return showNutriment(e.nutriment);
  panel.innerHTML = `<h2>${esc(name(e.source))} <span class="small">${esc(e.rel)}</span> ${esc(name(e.target))}</h2>
    <div class="block claim">${link(e.source)} → ${link(e.target)}${layerTag(e.layer)}
    ${e.note ? `<div class="note">${esc(e.note)}</div>` : ""}${citeHtml(e.cites)}</div>`;
}

// ------------------------------------------------------------------ search
const q = document.getElementById("q");
q.addEventListener("input", () => {
  cy.nodes().removeClass("match");
  const t = fold(q.value);
  if (t.length < 2) return;
  const hits = DATA.nodes.filter(n => [n.en, n.pi, n.zh, ...(n.alt || []), ...(n.hidden || [])]
    .some(l => l && fold(l).includes(t)));
  hits.forEach(h => cy.getElementById(h.id).addClass("match"));
  if (hits.length) {
    const best = hits.find(h => ["hindrance", "factor", "jhana", "mindstate"].includes(h.kind)) || hits[0];
    select(best.id);
  }
});

// ------------------------------------------------------------------ theme changes
const restyle = () => cy.style(style());
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", restyle);
new MutationObserver(restyle).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
document.fonts?.ready.then(restyle);

layout();
showNode(state.selected);
</script>
