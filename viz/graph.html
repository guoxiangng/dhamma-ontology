<style>
/* Layout: a working instrument. Graph canvas left, a reading panel right that cites the text for every link.
   Palette: palm-leaf neutrals, with one colour per kind of quality (hindrance, awakening factor, jhāna factor). */
:root {
  --bg: #f4f3ee;
  --surface: #fbfaf6;
  --fg: #22231f;
  --muted: #6c6d63;
  --line: #d9d7cc;
  --accent: #8a5a12;
  --hindrance: #b04a35;
  --factor: #2c7a68;
  --jhana: #5a5aa6;
  --mind: #7b7f8c;
  --object: #9c9a8c;
  --list: #3d3e37;
  --derived: #c08a14;
  --commentary: #8a5aa6;
  --editor: #8f8f86;
  --fuel: #b04a35;
  --starve: #2c7a68;
  --font-ui: "Noto Sans", "Segoe UI", system-ui, sans-serif;
  --font-text: "Noto Serif", Georgia, "Songti SC", serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #171815; --surface: #1f201c; --fg: #e8e6dc; --muted: #a2a294; --line: #35362f; --accent: #e0a94a;
    --hindrance: #e07a62; --factor: #5cbfa6; --jhana: #9d9df0; --mind: #a3a7b4; --object: #7d7c70; --list: #d6d4c8;
    --derived: #f0bb3c; --commentary: #c69be0; --editor: #8a8a80; --fuel: #e07a62; --starve: #5cbfa6;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #171815; --surface: #1f201c; --fg: #e8e6dc; --muted: #a2a294; --line: #35362f; --accent: #e0a94a;
  --hindrance: #e07a62; --factor: #5cbfa6; --jhana: #9d9df0; --mind: #a3a7b4; --object: #7d7c70; --list: #d6d4c8;
  --derived: #f0bb3c; --commentary: #c69be0; --editor: #8a8a80; --fuel: #e07a62; --starve: #5cbfa6;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 14px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 14px 16px; display: flex; flex-direction: column; gap: 10px;
}
header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 20px; }
h1 { margin: 0; font-size: 1.25rem; font-weight: 700; letter-spacing: -0.01em; text-wrap: balance; }
h1 span { font-weight: 400; color: var(--muted); font-size: 0.95rem; margin-left: 6px; }
.stats { display: flex; flex-wrap: wrap; gap: 4px 14px; color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; }
.stats b { color: var(--fg); font-weight: 600; }
.stats .pass b { color: var(--factor); }

.toolbar { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
.search { position: relative; flex: 0 1 260px; min-width: 0; }
.search input {
  width: 100%; font: inherit; color: var(--fg); background: var(--surface); border: 1px solid var(--line);
  border-radius: 6px; padding: 6px 10px;
}
.search input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.group { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.group > span { font-size: 11px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); margin-right: 2px; }
button {
  font: inherit; font-size: 12.5px; color: var(--fg); background: transparent; border: 1px solid var(--line);
  border-radius: 999px; padding: 3px 10px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
}
button:hover { border-color: var(--muted); }
button[aria-pressed="true"] { background: var(--surface); border-color: var(--fg); }
button[aria-pressed="false"] { color: var(--muted); }
button[aria-pressed="false"] i { opacity: 0.35; }
button i { display: inline-block; width: 16px; height: 0; border-top: 2px solid currentColor; }

main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 12px; }
#cy { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; min-height: 420px; position: relative; }
.legend {
  position: absolute; left: 10px; bottom: 8px; z-index: 2; display: flex; flex-wrap: wrap; gap: 4px 12px;
  font-size: 11.5px; color: var(--muted); pointer-events: none; max-width: calc(100% - 20px);
}
.legend em { font-style: normal; display: inline-flex; align-items: center; gap: 5px; }
.dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }

aside { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow-y: auto; padding: 14px 16px; min-width: 0; }
aside h2 { margin: 0 0 2px; font-size: 1.15rem; line-height: 1.3; text-wrap: balance; }
.names { font-family: var(--font-text); color: var(--muted); font-size: 0.95rem; }
.names i { color: var(--fg); }
.chips { display: flex; flex-wrap: wrap; gap: 4px; margin: 8px 0 4px; }
.chip { font-size: 11.5px; border-radius: 4px; padding: 1px 7px; border: 1px solid var(--line); color: var(--muted); }
.chip.k-hindrance { color: var(--hindrance); border-color: var(--hindrance); }
.chip.k-factor { color: var(--factor); border-color: var(--factor); }
.chip.k-jhana { color: var(--jhana); border-color: var(--jhana); }
.small { font-size: 12.5px; color: var(--muted); }
.def { font-family: var(--font-text); margin: 8px 0; }
section.rel { margin-top: 14px; }
section.rel h3 { margin: 0 0 4px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); font-weight: 600; }
.claim { padding: 6px 0; border-top: 1px solid var(--line); }
.claim:first-of-type { border-top: 0; }
.claim a.node { color: var(--fg); font-weight: 600; text-decoration: none; border-bottom: 1px dotted var(--muted); cursor: pointer; }
.layer { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600; border-radius: 3px; padding: 0 5px; margin-left: 4px; white-space: nowrap; }
.l-sutta { color: var(--fg); background: var(--line); }
.l-derived { color: var(--surface); background: var(--derived); }
.l-commentary { color: var(--surface); background: var(--commentary); }
.l-editor { color: var(--surface); background: var(--editor); }
.l-lexicon { color: var(--fg); background: var(--line); }
.cites { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 3px; }
.cite { font-size: 11.5px; font-variant-numeric: tabular-nums; padding: 0 6px; border-radius: 3px; }
.quote { font-family: var(--font-text); font-size: 13px; margin: 6px 0 2px; padding-left: 10px; border-left: 2px solid var(--line); }
.quote .pi { color: var(--muted); font-style: italic; display: block; margin-top: 2px; }
.quote a { font-family: var(--font-ui); font-size: 11.5px; color: var(--accent); }
.note { font-size: 12.5px; color: var(--muted); margin-top: 3px; }

@media (max-width: 820px) {
  main { grid-template-columns: minmax(0, 1fr); }
  #cy { height: 62vh; min-height: 360px; }
  aside { overflow: visible; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

-sn46.53-10.1", "p-sn46.53-10.3"]}, {"id": "ta-08", "state": "RestlessMind", "factor": "Energy", "timing": "wrong time to develop", "timingId": "WrongTime", "cites": ["p-sn46.53-10.1", "p-sn46.53-10.3"]}, {"id": "ta-09", "state": "RestlessMind", "factor": "Rapture", "timing": "wrong time to develop", "timingId": "WrongTime", "cites": ["p-sn46.53-10.1", "p-sn46.53-10.3"]}, {"id": "ta-10", "state": "RestlessMind", "factor": "Tranquility", "timing": "right time to develop", "timingId": "RightTime", "cites": ["p-sn46.53-13.1", "p-sn46.53-13.3"]}, {"id": "ta-11", "state": "RestlessMind", "factor": "Immersion", "timing": "right time to develop", "timingId": "RightTime", "cites": ["p-sn46.53-13.1", "p-sn46.53-13.3"]}, {"id": "ta-12", "state": "RestlessMind", "factor": "Equanimity", "timing": "right time to develop", "timingId": "RightTime", "cites": ["p-sn46.53-13.1", "p-sn46.53-13.3"]}, {"id": "ta-13", "state": null, "factor": "Mindfulness", "timing": "always useful", "timingId": "AlwaysUseful", "cites": ["p-sn46.53-15.4"]}], "passages": {"p-dhp279-1": {"segment": "dhp279:1", "en": "All things are not-self—", "pi": "“Sabbe dhammā anattā”ti,", "url": "https://suttacentral.net/dhp279/en/sujato#dhp279:1", "contested": null, "sense": null}, "p-mn10-36.2": {"segment": "mn10:36.2", "en": "It’s when a mendicant meditates by observing an aspect of principles with respect to the five hindrances.", "pi": "Idha, bhikkhave, bhikkhu dhammesu dhammānupassī viharati pañcasu nīvaraṇesu.", "url": "https://suttacentral.net/mn10/en/sujato#mn10:36.2", "contested": "principles (Sujato)", "sense": null}, "p-mn148-5.3": {"segment": "mn148:5.3", "en": "There are the sense fields of sights, sounds, smells, tastes, touches, and ideas.", "pi": "Rūpāyatanaṁ, saddāyatanaṁ, gandhāyatanaṁ, rasāyatanaṁ, phoṭṭhabbāyatanaṁ, dhammāyatanaṁ.", "url": "https://suttacentral.net/mn148/en/sujato#mn148:5.3", "contested": null, "sense": null}, "p-mn148-6.8": {"segment": "mn148:6.8", "en": "Mind consciousness arises dependent on the mind and ideas.", "pi": "manañca paṭicca dhamme ca uppajjati manoviññāṇaṁ.", "url": "https://suttacentral.net/mn148/en/sujato#mn148:6.8", "contested": null, "sense": null}, "p-mn43-19.2": {"segment": "mn43:19.2", "en": "“The first absorption has five factors.", "pi": "“Paṭhamaṁ kho, āvuso, jhānaṁ pañcaṅgikaṁ.", "url": "https://suttacentral.net/mn43/en/sujato#mn43:19.2", "contested": null, "sense": null}, "p-mn43-19.3": {"segment": "mn43:19.3", "en": "When a mendicant has entered the first absorption, placing the mind, keeping it connected, rapture, bliss, and unification of mind are present.", "pi": "Idhāvuso, paṭhamaṁ jhānaṁ samāpannassa bhikkhuno vitakko ca vattati, vicāro ca pīti ca sukhañca cittekaggatā ca.", "url": "https://suttacentral.net/mn43/en/sujato#mn43:19.3", "contested": null, "sense": null}, "p-mn43-20.2": {"segment": "mn43:20.2", "en": "“The first absorption has given up five factors and possesses five factors.", "pi": "“Paṭhamaṁ kho, āvuso, jhānaṁ pañcaṅgavippahīnaṁ, pañcaṅgasamannāgataṁ.", "url": "https://suttacentral.net/mn43/en/sujato#mn43:20.2", "contested": null, "sense": null}, "p-mn43-20.3": {"segment": "mn43:20.3", "en": "When a mendicant has entered the first absorption, sensual desire, ill will, dullness and drowsiness, restlessness and remorse, and doubt are given up.", "pi": "Idhāvuso, paṭhamaṁ jhānaṁ samāpannassa bhikkhuno kāmacchando pahīno hoti, byāpādo pahīno hoti, thinamiddhaṁ pahīnaṁ hoti, uddhaccakukkuccaṁ pahīnaṁ hoti, vicikicchā pahīnā hoti;", "url": "https://suttacentral.net/mn43/en/sujato#mn43:20.3", "contested": null, "sense": null}, "p-mn43-20.4": {"segment": "mn43:20.4", "en": "Placing the mind, keeping it connected, rapture, bliss, and unification of mind are present.", "pi": "vitakko ca vattati, vicāro ca pīti ca sukhañca cittekaggatā ca.", "url": "https://suttacentral.net/mn43/en/sujato#mn43:20.4", "contested": null, "sense": null}, "p-mn44-12.2": {"segment": "mn44:12.2", "en": "“Unification of the mind is immersion.", "pi": "“Yā kho, āvuso visākha, cittassa ekaggatā ayaṁ samādhi;", "url": "https://suttacentral.net/mn44/en/sujato#mn44:12.2", "contested": null, "sense": null}, "p-sn11.3-10.2": {"segment": "sn11.3:10.2", "en": "‘The teaching is well explained by the Buddha—apparent in the present life, immediately effective, inviting inspection, relevant, so that sensible people can know it for themselves.’", "pi": "“svākkhāto bhagavatā dhammo sandiṭṭhiko akāliko ehipassiko opaneyyiko paccattaṁ veditabbo viññūhī”ti.", "url": "https://suttacentral.net/sn11.3/en/sujato#sn11.3:10.2", "contested": null, "sense": null}, "p-sn46.1-1.12": {"segment": "sn46.1:1.12", "en": "They develop the awakening factor of equanimity, which relies on seclusion, fading away, and cessation, and ripens as letting go.", "pi": "upekkhāsambojjhaṅgaṁ bhāveti vivekanissitaṁ virāganissitaṁ nirodhanissitaṁ vossaggapariṇāmiṁ.", "url": "https://suttacentral.net/sn46.1/en/sujato#sn46.1:1.12", "contested": null, "sense": null}, "p-sn46.1-1.4": {"segment": "sn46.1:1.4", "en": "In the same way, a mendicant develops and cultivates the seven awakening factors depending on and grounded on ethics, acquiring great and abundant good qualities.", "pi": "evameva kho, bhikkhave, bhikkhu sīlaṁ nissāya sīle patiṭṭhāya satta bojjhaṅge bhāvento satta bojjhaṅge bahulīkaronto mahantattaṁ vepullattaṁ pāpuṇāti dhammesu.", "url": "https://suttacentral.net/sn46.1/en/sujato#sn46.1:1.4", "contested": null, "sense": null}, "p-sn46.1-1.6": {"segment": "sn46.1:1.6", "en": "It’s when a mendicant develops the awakening factor of mindfulness, which relies on seclusion, fading away, and cessation, and ripens as letting go.", "pi": "Idha, bhikkhave, bhikkhu satisambojjhaṅgaṁ bhāveti vivekanissitaṁ virāganissitaṁ nirodhanissitaṁ vossaggapariṇāmiṁ;", "url": "https://suttacentral.net/sn46.1/en/sujato#sn46.1:1.6", "contested": null, "sense": null}, "p-sn46.11-1.3": {"segment": "sn46.11:1.3", "en": "In the same way, a mendicant develops and cultivates the seven awakening factors depending on and grounded on ethics.", "pi": "evameva kho, bhikkhave, bhikkhu sīlaṁ nissāya sīle patiṭṭhāya satta bojjhaṅge bhāveti, satta bojjhaṅge bahulīkaroti.", "url": "https://suttacentral.net/sn46.11/en/sujato#sn46.11:1.3", "contested": null, "sense": null}, "p-sn46.11-2.3": {"segment": "sn46.11:2.3", "en": "and equanimity, which rely on seclusion, fading away, and cessation, and ripen as letting go.", "pi": "upekkhāsambojjhaṅgaṁ bhāveti vivekanissitaṁ virāganissitaṁ nirodhanissitaṁ vossaggapariṇāmiṁ.", "url": "https://suttacentral.net/sn46.11/en/sujato#sn46.11:2.3", "contested": null, "sense": null}, "p-sn46.12-1.2": {"segment": "sn46.12:1.2", "en": "In the same way, for a mendicant good friendship is the forerunner and harbinger of the arising of the seven awakening factors.", "pi": "evameva kho, bhikkhave, bhikkhuno sattannaṁ bojjhaṅgānaṁ uppādāya etaṁ pubbaṅgamaṁ etaṁ nimittaṁ, yadidaṁ—kalyāṇamittatā.", "url": "https://suttacentral.net/sn46.12/en/sujato#sn46.12:1.2", "contested": null, "sense": null}, "p-sn46.12-1.3": {"segment": "sn46.12:1.3", "en": "A mendicant with good friends can expect to develop and cultivate the seven awakening factors.", "pi": "Kalyāṇamittassetaṁ, bhikkhave, bhikkhuno pāṭikaṅkhaṁ—satta bojjhaṅge bhāvessati, satta bojjhaṅge bahulīkarissati.", "url": "https://suttacentral.net/sn46.12/en/sujato#sn46.12:1.3", "contested": null, "sense": null}, "p-sn46.12-2.3": {"segment": "sn46.12:2.3", "en": "and equanimity, which rely on seclusion, fading away, and cessation, and ripen as letting go.", "pi": "upekkhāsambojjhaṅgaṁ bhāveti vivekanissitaṁ virāganissitaṁ nirodhanissitaṁ vossaggapariṇāmiṁ.", "url": "https://suttacentral.net/sn46.12/en/sujato#sn46.12:2.3", "contested": null, "sense": null}, "p-sn46.13-1.2": {"segment": "sn46.13:1.2", "en": "In the same way, for a mendicant rational application of mind is the forerunner and harbinger of the arising of the seven awakening factors.", "pi": "evameva kho, bhikkhave, bhikkhuno sattannaṁ bojjhaṅgānaṁ uppādāya etaṁ pubbaṅgamaṁ etaṁ pubbanimittaṁ, yadidaṁ—yonisomanasikāro.", "url": "https://suttacentral.net/sn46.13/en/sujato#sn46.13:1.2", "contested": null, "sense": null}, "p-sn46.13-1.3": {"segment": "sn46.13:1.3", "en": "A mendicant accomplished in rational application of mind can expect to develop and cultivate the seven awakening factors.", "pi": "Yonisomanasikārasampannassetaṁ, bhikkhave, bhikkhuno pāṭikaṅkhaṁ—satta bojjhaṅge bhāvessati, satta bojjhaṅge bahulīkarissati.", "url": "https://suttacentral.net/sn46.13/en/sujato#sn46.13:1.3", "contested": null, "sense": null}, "p-sn46.13-2.3": {"segment": "sn46.13:2.3", "en": "and equanimity, which rely on seclusion, fading away, and cessation, and ripen as letting go.", "pi": "upekkhāsambojjhaṅgaṁ bhāveti vivekanissitaṁ virāganissitaṁ nirodhanissitaṁ vossaggapariṇāmiṁ.", "url": "https://suttacentral.net/sn46.13/en/sujato#sn46.13:2.3", "contested": null, "sense": null}, "p-sn46.130-1.10": {"segment": "sn46.130:1.10", "en": "“… which have freedom from death as their objective, destination, and culmination …”", "pi": "amatogadhaṁ amataparāyanaṁ amatapariyosānaṁ …", "url": "https://suttacentral.net/sn46.130/en/sujato#sn46.130:1.10", "contested": null, "sense": null}, "p-sn46.130-1.11": {"segment": "sn46.130:1.11", "en": "“… which slant, slope, and incline to extinguishment …", "pi": "nibbānaninnaṁ nibbānapoṇaṁ nibbānapabbhāraṁ.", "url": "https://suttacentral.net/sn46.130/en/sujato#sn46.130:1.11", "contested": null, "sense": null}, "p-sn46.130-1.12": {"segment": "sn46.130:1.12", "en": "The seven awakening factors should be developed for the direct knowledge, complete understanding, finishing, and giving up of these five higher fetters.”", "pi": "Imesaṁ kho, bhikkhave, bhikkhu pañcannaṁ uddhambhāgiyānaṁ saṁyojanānaṁ abhiññāya pariññāya parikkhayāya pahānāya ime satta bojjhaṅgā bhāvetabbā”ti.", "url": "https://suttacentral.net/sn46.130/en/sujato#sn46.130:1.12", "contested": null, "sense": null}, "p-sn46.130-1.2": {"segment": "sn46.130:1.2", "en": "“Mendicants, there are five higher fetters.", "pi": "“Pañcimāni, bhikkhave, uddhambhāgiyāni saṁyojanāni.", "url": "https://suttacentral.net/sn46.130/en/sujato#sn46.130:1.2", "contested": null, "sense": null}, "p-sn46.130-1.4": {"segment": "sn46.130:1.4", "en": "Desire for rebirth in the realm of luminous form, desire for rebirth in the formless realm, conceit, restlessness, and ignorance.", "pi": "Rūparāgo, arūparāgo, māno, uddhaccaṁ, avijjā—", "url": "https://suttacentral.net/sn46.130/en/sujato#sn46.130:1.4", "contested": null, "sense": null}, "p-sn46.130-1.6": {"segment": "sn46.130:1.6", "en": "The seven awakening factors should be developed for the direct knowledge, complete understanding, finishing, and giving up of these five higher fetters.", "pi": "Imesaṁ kho, bhikkhave, pañcannaṁ uddhambhāgiyānaṁ saṁyojanānaṁ abhiññāya pariññāya parikkhayāya pahānāya satta bojjhaṅgā bhāvetabbā.", "url": "https://suttacentral.net/sn46.130/en/sujato#sn46.130:1.6", "contested": null, "sense": null}, "p-sn46.130-1.9": {"segment": "sn46.130:1.9", "en": "and equanimity, which culminate in the removal of greed, hate, and delusion. …”", "pi": "upekkhāsambojjhaṅgaṁ bhāveti rāgavinayapariyosānaṁ dosavinayapariyosānaṁ mohavinayapariyosānaṁ …", "url": "https://suttacentral.net/sn46.130/en/sujato#sn46.130:1.9", "contested": null, "sense": null}, "p-sn46.17-1.1": {"segment": "sn46.17:1.1", "en": "“Mendicants, when these seven awakening factors are developed and cultivated they lead to going from the near shore to the far shore.", "pi": "“Sattime, bhikkhave, bojjhaṅgā bhāvitā bahulīkatā apārā pāraṁ gamanāya saṁvattanti.", "url": "https://suttacentral.net/sn46.17/en/sujato#sn46.17:1.1", "contested": null, "sense": null}, "p-sn46.17-1.3": {"segment": "sn46.17:1.3", "en": "The awakening factors of mindfulness, investigation of principles, energy, rapture, tranquility, immersion, and equanimity.", "pi": "Satisambojjhaṅgo …pe… upekkhāsambojjhaṅgo—", "url": "https://suttacentral.net/sn46.17/en/sujato#sn46.17:1.3", "contested": null, "sense": null}, "p-sn46.17-1.4": {"segment": "sn46.17:1.4", "en": "These seven awakening factors, when developed and cultivated, lead to going from the near shore to the far shore.", "pi": "ime kho, bhikkhave, satta bojjhaṅgā bhāvitā bahulīkatā apārā pāraṁ gamanāya saṁvattantīti.", "url": "https://suttacentral.net/sn46.17/en/sujato#sn46.17:1.4", "contested": null, "sense": null}, "p-sn46.19-1.1": {"segment": "sn46.19:1.1", "en": "“Mendicants, when these seven awakening factors are developed and cultivated they are noble and emancipating, and bring one who practices them to the complete ending of suffering.", "pi": "“Sattime, bhikkhave, bojjhaṅgā bhāvitā bahulīkatā ariyā niyyānikā nīyanti takkarassa sammā dukkhakkhayāya.", "url": "https://suttacentral.net/sn46.19/en/sujato#sn46.19:1.1", "contested": null, "sense": null}, "p-sn46.19-1.3": {"segment": "sn46.19:1.3", "en": "The awakening factors of mindfulness, investigation of principles, energy, rapture, tranquility, immersion, and equanimity.", "pi": "Satisambojjhaṅgo …pe… upekkhāsambojjhaṅgo—", "url": "https://suttacentral.net/sn46.19/en/sujato#sn46.19:1.3", "contested": null, "sense": null}, "p-sn46.19-1.4": {"segment": "sn46.19:1.4", "en": "When these seven awakening factors are developed and cultivated they are noble and emancipating, and bring one who practices them to the complete ending of suffering.”", "pi": "ime kho, bhikkhave, satta bojjhaṅgā bhāvitā bahulīkatā ariyā niyyānikā nīyanti takkarassa sammā dukkhakkhayāyā”ti.", "url": "https://suttacentral.net/sn46.19/en/sujato#sn46.19:1.4", "contested": null, "sense": null}, "p-sn46.2-10.2": {"segment": "sn46.2:10.2", "en": "There are qualities that are skillful and unskillful, blameworthy and blameless, inferior and superior, and those with a portion of dark or bright.", "pi": "Atthi, bhikkhave, kusalākusalā dhammā, sāvajjānavajjā dhammā, hīnapaṇītā dhammā, kaṇhasukkasappaṭibhāgā dhammā.", "url": "https://suttacentral.net/sn46.2/en/sujato#sn46.2:10.2", "contested": null, "sense": null}, "p-sn46.2-10.3": {"segment": "sn46.2:10.3", "en": "Frequent rational application of mind to them", "pi": "Tattha yonisomanasikārabahulīkāro—", "url": "https://suttacentral.net/sn46.2/en/sujato#sn46.2:10.3", "contested": null, "sense": null}, "p-sn46.2-11.2": {"segment": "sn46.2:11.2", "en": "There are the elements of initiative, persistence, and exertion.", "pi": "Atthi, bhikkhave, ārambhadhātu nikkamadhātu parakkamadhātu.", "url": "https://suttacentral.net/sn46.2/en/sujato#sn46.2:11.2", "contested": null, "sense": null}, "p-sn46.2-11.3": {"segment": "sn46.2:11.3", "en": "Frequent rational application of mind to them", "pi": "Tattha yonisomanasikārabahulīkāro—", "url": "https://suttacentral.net/sn46.2/en/sujato#sn46.2:11.3", "contested": null, "sense": null}, "p-sn46.2-12.2": {"segment": "sn46.2:12.2", "en": "There are things that are grounds for the awakening factor of rapture.", "pi": "Atthi, bhikkhave, pītisambojjhaṅgaṭṭhānīyā dhammā.", "url": "https://suttacentral.net/sn46.2/en/sujato#sn46.2:12.2", "contested": null, "sense": null}, "p-sn46.2-12.3": {"segment": "sn46.2:12.3", "en": "Frequent rational application of mind to them", "pi": "Tattha yonisomanasikārabahulīkāro—", "url": "https://suttacentral.net/sn46.2/en/sujato#sn46.2:12.3", "contested": null, "sense": null}, "p-sn46.2-13.2": {"segment": "sn46.2:13.2", "en": "There is tranquility of the body and of the mind.", "pi": "Atthi, bhikkhave, kāyapassaddhi, cittapassaddhi.", "url": "https://suttacentral.net/sn46.2/en/sujato#sn46.2:13.2", "contested": null, "sense": null}, "p-sn46.2-13.3": {"segment": "sn46.2:13.3", "en": "Frequent rational application of mind to that", "pi": "Tattha yonisomanasikārabahulīkāro—", "url": "https://suttacentral.net/sn46.2/en/sujato#sn46.2:13.3", "contested": null, "sense": null}, "p-sn46.2-14.2": {"segment": "sn46.2:14.2", "en": "There are things that are the basis of serenity and freedom from distraction.", "pi": "Atthi, bhikkhave, samathanimittaṁ abyagganimittaṁ.", "url": "https://suttacentral.net/sn46.2/en/sujato#sn46.2:14.2", "contested": null, "sense": null}, "p-sn46.2-14.3": {"segment": "sn46.2:14.3", "en": "Frequent rational application of mind to them", "pi": "Tattha yonisomanasikārabahulīkāro—", "url": "https://suttacentral.net/sn46.2/en/sujato#sn46.2:14.3", "contested": null, "sense": null}, "p-sn46.2-15.2": {"segment": "sn46.2:15.2", "en": "There are things that are grounds for the awakening factor of equanimity.", "pi": "Atthi, bhikkhave, upekkhāsambojjhaṅgaṭṭhānīyā dhammā.", "url": "https://suttacentral.net/sn46.2/en/sujato#sn46.2:15.2", "contested": null, "sense": null}, "p-sn46.2-15.3": {"segment": "sn46.2:15.3", "en": "Frequent rational application of mind to them", "pi": "Tattha yonisomanasikārabahulīkāro—", "url": "https://suttacentral.net/sn46.2/en/sujato#sn46.2:15.3", "contested": null, "sense": null}, "p-sn46.2-2.2": {"segment": "sn46.2:2.2", "en": "There is the feature of beauty.", "pi": "Atthi, bhikkhave, subhanimittaṁ.", "url": "https://suttacentral.net/sn46.2/en/sujato#sn46.2:2.2", "contested": null, "sense": null}, "p-sn46.2-2.3": {"segment": "sn46.2:2.3", "en": "Frequent irrational application of mind to that", "pi": "Tattha ayonisomanasikārabahulīkāro—", "url": "https://suttacentral.net/sn46.2/en/sujato#sn46.2:2.3", "contested": null, "sense": null}, "p-sn46.2-3.2": {"segment": "sn46.2:3.2", "en": "There is the feature of aversion.", "pi": "Atthi, bhikkhave, paṭighanimittaṁ.", "url": "https://suttacentral.net/sn46.2/en/sujato#sn46.2:3.2", "contested": null, "sense": null}, "p-sn46.2-3.3": {"segment": "sn46.2:3.3", "en": "Frequent irrational application of mind to that", "pi": "Tattha ayonisomanasikārabahulīkāro—", "url": "https://suttacentral.net/sn46.2/en/sujato#sn46.2:3.3", "contested": null, "sense": null}, "p-sn46.2-4.2": {"segment": "sn46.2:4.2", "en": "There is discontent, sloth, yawning, sleepiness after eating, and mental sluggishness.", "pi": "Atthi, bhikkhave, arati tandi vijambhitā bhattasammado cetaso ca līnattaṁ.", "url": "https://suttacentral.net/sn46.2/en/sujato#sn46.2:4.2", "contested": null, "sense": null}, "p-sn46.2-4.3": {"segment": "sn46.2:4.3", "en": "Frequent irrational application of mind to them", "pi": "Tattha ayonisomanasikārabahulīkāro—", "url": "https://suttacentral.net/sn46.2/en/sujato#sn46.2:4.3", "contested": null, "sense": null}, "p-sn46.2-5.2": {"segment": "sn46.2:5.2", "en": "There is the unsettled mind.", "pi": "Atthi, bhikkhave, cetaso avūpasamo.", "url": "https://suttacentral.net/sn46.2/en/sujato#sn46.2:5.2", "contested": null, "sense": null}, "p-sn46.2-5.3": {"segment": "sn46.2:5.3", "en": "Frequent irrational application of mind to that", "pi": "Tattha ayonisomanasikārabahulīkāro—", "url": "https://suttacentral.net/sn46.2/en/sujato#sn46.2:5.3", "contested": null, "sense": null}, "p-sn46.2-6.2": {"segment": "sn46.2:6.2", "en": "There are things that are grounds for doubt.", "pi": "Atthi, bhikkhave, vicikicchāṭṭhānīyā dhammā.", "url": "https://suttacentral.net/sn46.2/en/sujato#sn46.2:6.2", "contested": null, "sense": null}, "p-sn46.2-6.3": {"segment": "sn46.2:6.3", "en": "Frequent irrational application of mind to them", "pi": "Tattha ayonisomanasikārabahulīkāro—", "url": "https://suttacentral.net/sn46.2/en/sujato#sn46.2:6.3", "contested": null, "sense": null}, "p-sn46.2-9.2": {"segment": "sn46.2:9.2", "en": "There are things that are grounds for the awakening factor of mindfulness.", "pi": "Atthi, bhikkhave, satisambojjhaṅgaṭṭhānīyā dhammā.", "url": "https://suttacentral.net/sn46.2/en/sujato#sn46.2:9.2", "contested": null, "sense": null}, "p-sn46.2-9.3": {"segment": "sn46.2:9.3", "en": "Frequent rational application of mind to them", "pi": "Tattha yonisomanasikārabahulīkāro—", "url": "https://suttacentral.net/sn46.2/en/sujato#sn46.2:9.3", "contested": null, "sense": null}, "p-sn46.20-1.1": {"segment": "sn46.20:1.1", "en": "“Mendicants, the seven awakening factors, when developed and cultivated, lead solely to disillusionment, dispassion, cessation, peace, insight, awakening, and extinguishment.", "pi": "“Sattime, bhikkhave, bojjhaṅgā bhāvitā bahulīkatā ekantanibbidāya virāgāya nirodhāya upasamāya abhiññāya sambodhāya nibbānāya saṁvattanti.", "url": "https://suttacentral.net/sn46.20/en/sujato#sn46.20:1.1", "contested": null, "sense": null}, "p-sn46.20-1.3": {"segment": "sn46.20:1.3", "en": "The awakening factors of mindfulness, investigation of principles, energy, rapture, tranquility, immersion, and equanimity.", "pi": "Satisambojjhaṅgo …pe… upekkhāsambojjhaṅgo—", "url": "https://suttacentral.net/sn46.20/en/sujato#sn46.20:1.3", "contested": null, "sense": null}, "p-sn46.20-1.4": {"segment": "sn46.20:1.4", "en": "These seven awakening factors, when developed and cultivated, lead solely to disillusionment, dispassion, cessation, peace, insight, awakening, and extinguishment.”", "pi": "ime kho, bhikkhave, satta bojjhaṅgā bhāvitā bahulīkatā ekantanibbidāya virāgāya nirodhāya upasamāya abhiññāya sambodhāya nibbānāya saṁvattantī”ti.", "url": "https://suttacentral.net/sn46.20/en/sujato#sn46.20:1.4", "contested": null, "sense": null}, "p-sn46.21-2.3": {"segment": "sn46.21:2.3", "en": "“Mendicant, they’re called awakening factors because they lead to awakening.", "pi": "“‘Bodhāya saṁvattantī’ti kho, bhikkhu, tasmā bojjhaṅgāti vuccanti.", "url": "https://suttacentral.net/sn46.21/en/sujato#sn46.21:2.3", "contested": null, "sense": null}, "p-sn46.21-2.4": {"segment": "sn46.21:2.4", "en": "A mendicant develops the awakening factors of mindfulness, investigation of principles, energy, rapture, tranquility, immersion,", "pi": "Idha, bhikkhu, satisambojjhaṅgaṁ bhāveti vivekanissitaṁ …pe…", "url": "https://suttacentral.net/sn46.21/en/sujato#sn46.21:2.4", "contested": null, "sense": null}, "p-sn46.21-2.5": {"segment": "sn46.21:2.5", "en": "and equanimity, which rely on seclusion, fading away, and cessation, and ripen as letting go.", "pi": "upekkhāsambojjhaṅgaṁ bhāveti vivekanissitaṁ virāganissitaṁ nirodhanissitaṁ vossaggapariṇāmiṁ.", "url": "https://suttacentral.net/sn46.21/en/sujato#sn46.21:2.5", "contested": null, "sense": null}, "p-sn46.21-2.6": {"segment": "sn46.21:2.6", "en": "They’re called awakening factors because they lead to awakening.”", "pi": "‘Bodhāya saṁvattantī’ti kho, bhikkhu, tasmā ‘bojjhaṅgā’ti vuccantī”ti.", "url": "https://suttacentral.net/sn46.21/en/sujato#sn46.21:2.6", "contested": null, "sense": null}, "p-sn46.22-1.1": {"segment": "sn46.22:1.1", "en": "“Mendicants, I will teach you the seven awakening factors.", "pi": "“Satta vo, bhikkhave, bojjhaṅge desessāmi;", "url": "https://suttacentral.net/sn46.22/en/sujato#sn46.22:1.1", "contested": null, "sense": null}, "p-sn46.22-1.3": {"segment": "sn46.22:1.3", "en": "And what are the seven awakening factors?", "pi": "Katame ca, bhikkhave, satta bojjhaṅgā?", "url": "https://suttacentral.net/sn46.22/en/sujato#sn46.22:1.3", "contested": null, "sense": null}, "p-sn46.22-1.4": {"segment": "sn46.22:1.4", "en": "The awakening factors of mindfulness, investigation of principles, energy, rapture, tranquility, immersion, and equanimity.", "pi": "Satisambojjhaṅgo …pe… upekkhāsambojjhaṅgo—", "url": "https://suttacentral.net/sn46.22/en/sujato#sn46.22:1.4", "contested": null, "sense": null}, "p-sn46.24-1.1": {"segment": "sn46.24:1.1", "en": "“Mendicants, when you apply the mind irrationally, sensual desire,", "pi": "“Ayoniso, bhikkhave, manasikaroto anuppanno ceva kāmacchando uppajjati, uppanno ca kāmacchando bhiyyobhāvāya vepullāya saṁvattati;", "url": "https://suttacentral.net/sn46.24/en/sujato#sn46.24:1.1", "contested": null, "sense": null}, "p-sn46.24-1.2": {"segment": "sn46.24:1.2", "en": "ill will,", "pi": "anuppanno ceva byāpādo uppajjati, uppanno ca byāpādo bhiyyobhāvāya vepullāya saṁvattati;", "url": "https://suttacentral.net/sn46.24/en/sujato#sn46.24:1.2", "contested": null, "sense": null}, "p-sn46.24-1.3": {"segment": "sn46.24:1.3", "en": "dullness and drowsiness,", "pi": "anuppannañceva thinamiddhaṁ uppajjati, uppannañca thinamiddhaṁ bhiyyobhāvāya vepullāya saṁvattati;", "url": "https://suttacentral.net/sn46.24/en/sujato#sn46.24:1.3", "contested": null, "sense": null}, "p-sn46.24-1.4": {"segment": "sn46.24:1.4", "en": "restlessness and remorse,", "pi": "anuppannañceva uddhaccakukkuccaṁ uppajjati, uppannañca uddhaccakukkuccaṁ bhiyyobhāvāya vepullāya saṁvattati;", "url": "https://suttacentral.net/sn46.24/en/sujato#sn46.24:1.4", "contested": null, "sense": null}, "p-sn46.24-1.5": {"segment": "sn46.24:1.5", "en": "and doubt arise, and once arisen they increase and grow.", "pi": "anuppannā ceva vicikicchā uppajjati, uppannā ca vicikicchā bhiyyobhāvāya vepullāya saṁvattati;", "url": "https://suttacentral.net/sn46.24/en/sujato#sn46.24:1.5", "contested": null, "sense": null}, "p-sn46.24-1.6": {"segment": "sn46.24:1.6", "en": "And the awakening factors of mindfulness, investigation of principles, energy, rapture, tranquility, immersion, and equanimity don’t arise, or if they’ve already arisen, they cease.", "pi": "anuppanno ceva satisambojjhaṅgo nuppajjati, uppanno ca satisambojjhaṅgo nirujjhati …pe… anuppanno ceva upekkhāsambojjhaṅgo nuppajjati, uppanno ca upekkhāsambojjhaṅgo nirujjhati.", "url": "https://suttacentral.net/sn46.24/en/sujato#sn46.24:1.6", "contested": null, "sense": null}, "p-sn46.24-2.1": {"segment": "sn46.24:2.1", "en": "When you apply the mind rationally, sensual desire,", "pi": "Yoniso ca kho, bhikkhave, manasikaroto anuppanno ceva kāmacchando nuppajjati, uppanno ca kāmacchando pahīyati;", "url": "https://suttacentral.net/sn46.24/en/sujato#sn46.24:2.1", "contested": null, "sense": null}, "p-sn46.24-2.5": {"segment": "sn46.24:2.5", "en": "and doubt don’t arise, or if they’ve already arisen they’re given up.", "pi": "anuppannā ceva vicikicchā nuppajjati, uppannā ca vicikicchā pahīyati.", "url": "https://suttacentral.net/sn46.24/en/sujato#sn46.24:2.5", "contested": null, "sense": null}, "p-sn46.24-3.1": {"segment": "sn46.24:3.1", "en": "And the awakening factors of mindfulness, investigation of principles, energy, rapture, tranquility, immersion, and equanimity arise, and once they’ve arisen, they’re fully developed.”", "pi": "Anuppanno ceva satisambojjhaṅgo uppajjati, uppanno ca satisambojjhaṅgo bhāvanāpāripūriṁ gacchati …pe… anuppanno ceva upekkhāsambojjhaṅgo uppajjati, uppanno ca upekkhāsambojjhaṅgo bhāvanāpāripūriṁ gacchatī”ti.", "url": "https://suttacentral.net/sn46.24/en/sujato#sn46.24:3.1", "contested": null, "sense": null}, "p-sn46.25-1.7": {"segment": "sn46.25:1.7", "en": "The awakening factors of mindfulness, investigation of principles, energy, rapture, tranquility, immersion, and equanimity.", "pi": "Satisambojjhaṅgo …pe… upekkhāsambojjhaṅgo—", "url": "https://suttacentral.net/sn46.25/en/sujato#sn46.25:1.7", "contested": null, "sense": null}, "p-sn46.26-1.1": {"segment": "sn46.26:1.1", "en": "“Mendicants, you should develop the path and the practice that leads to the ending of craving.", "pi": "“Yo, bhikkhave, maggo yā paṭipadā taṇhakkhayāya saṁvattati, taṁ maggaṁ taṁ paṭipadaṁ bhāvetha.", "url": "https://suttacentral.net/sn46.26/en/sujato#sn46.26:1.1", "contested": null, "sense": null}, "p-sn46.26-1.4": {"segment": "sn46.26:1.4", "en": "It is the seven awakening factors.", "pi": "satta bojjhaṅgā.", "url": "https://suttacentral.net/sn46.26/en/sujato#sn46.26:1.4", "contested": null, "sense": null}, "p-sn46.26-1.6": {"segment": "sn46.26:1.6", "en": "The awakening factors of mindfulness, investigation of principles, energy, rapture, tranquility, immersion, and equanimity.”", "pi": "Satisambojjhaṅgo …pe… upekkhāsambojjhaṅgo”ti.", "url": "https://suttacentral.net/sn46.26/en/sujato#sn46.26:1.6", "contested": null, "sense": null}, "p-sn46.26-2.1": {"segment": "sn46.26:2.1", "en": "“Udāyī, it’s when a mendicant develops the awakening factor of mindfulness, which relies on seclusion, fading away, and cessation, and ripens as letting go. And it is abundant, expansive, limitless, and free of ill will.", "pi": "“Idha, udāyi, bhikkhu satisambojjhaṅgaṁ bhāveti vivekanissitaṁ virāganissitaṁ nirodhanissitaṁ vossaggapariṇāmiṁ vipulaṁ mahaggataṁ appamāṇaṁ abyāpajjaṁ.", "url": "https://suttacentral.net/sn46.26/en/sujato#sn46.26:2.1", "contested": null, "sense": null}, "p-sn46.26-2.5": {"segment": "sn46.26:2.5", "en": "A mendicant develops the awakening factor of equanimity, which relies on seclusion, fading away, and cessation, and ripens as letting go. And it is abundant, expansive, limitless, and free of ill will.", "pi": "upekkhāsambojjhaṅgaṁ bhāveti vivekanissitaṁ virāganissitaṁ nirodhanissitaṁ vossaggapariṇāmiṁ vipulaṁ mahaggataṁ appamāṇaṁ abyāpajjaṁ.", "url": "https://suttacentral.net/sn46.26/en/sujato#sn46.26:2.5", "contested": null, "sense": null}, "p-sn46.27-1.1": {"segment": "sn46.27:1.1", "en": "“Mendicants, you should develop the path and the practice that leads to the cessation of craving.", "pi": "“Yo, bhikkhave, maggo yā paṭipadā taṇhānirodhāya saṁvattati, taṁ maggaṁ taṁ paṭipadaṁ bhāvetha.", "url": "https://suttacentral.net/sn46.27/en/sujato#sn46.27:1.1", "contested": null, "sense": null}, "p-sn46.27-1.4": {"segment": "sn46.27:1.4", "en": "It is the seven awakening factors.", "pi": "satta bojjhaṅgā.", "url": "https://suttacentral.net/sn46.27/en/sujato#sn46.27:1.4", "contested": null, "sense": null}, "p-sn46.27-1.6": {"segment": "sn46.27:1.6", "en": "The awakening factors of mindfulness, investigation of principles, energy, rapture, tranquility, immersion, and equanimity.", "pi": "Satisambojjhaṅgo …pe… upekkhāsambojjhaṅgo.", "url": "https://suttacentral.net/sn46.27/en/sujato#sn46.27:1.6", "contested": null, "sense": null}, "p-sn46.27-2.2": {"segment": "sn46.27:2.2", "en": "and equanimity, which rely on seclusion, fading away, and cessation, and ripen as letting go.", "pi": "upekkhāsambojjhaṅgaṁ bhāveti vivekanissitaṁ virāganissitaṁ nirodhanissitaṁ vossaggapariṇāmiṁ.", "url": "https://suttacentral.net/sn46.27/en/sujato#sn46.27:2.2", "contested": null, "sense": null}, "p-sn46.27-2.3": {"segment": "sn46.27:2.3", "en": "This is how the seven awakening factors are developed and cultivated so as to lead to the cessation of craving.”", "pi": "Evaṁ bhāvitā kho, bhikkhave, satta bojjhaṅgā evaṁ bahulīkatā taṇhānirodhāya saṁvattantī”ti.", "url": "https://suttacentral.net/sn46.27/en/sujato#sn46.27:2.3", "contested": null, "sense": null}, "p-sn46.28-1.1": {"segment": "sn46.28:1.1", "en": "“Mendicants, I will teach you a path that helps penetration.", "pi": "“Nibbedhabhāgiyaṁ vo, bhikkhave, maggaṁ desessāmi;", "url": "https://suttacentral.net/sn46.28/en/sujato#sn46.28:1.1", "contested": null, "sense": null}, "p-sn46.28-1.5": {"segment": "sn46.28:1.5", "en": "It is the seven awakening factors.", "pi": "satta bojjhaṅgā.", "url": "https://suttacentral.net/sn46.28/en/sujato#sn46.28:1.5", "contested": null, "sense": null}, "p-sn46.28-1.7": {"segment": "sn46.28:1.7", "en": "The awakening factors of mindfulness, investigation of principles, energy, rapture, tranquility, immersion, and equanimity.”", "pi": "Satisambojjhaṅgo …pe… upekkhāsambojjhaṅgo”ti.", "url": "https://suttacentral.net/sn46.28/en/sujato#sn46.28:1.7", "contested": null, "sense": null}, "p-sn46.28-1.9": {"segment": "sn46.28:1.9", "en": "“Sir, how are the seven awakening factors developed and cultivated so as to lead to penetration?”", "pi": "“kathaṁ bhāvitā nu kho, bhante, satta bojjhaṅgā kathaṁ bahulīkatā nibbedhāya saṁvattantī”ti?", "url": "https://suttacentral.net/sn46.28/en/sujato#sn46.28:1.9", "contested": null, "sense": null}, "p-sn46.28-2.1": {"segment": "sn46.28:2.1", "en": "“Udāyī, it’s when a mendicant develops the awakening factor of mindfulness, which relies on seclusion, fading away, and cessation, and ripens as letting go. And it is abundant, expansive, limitless, and free of ill will.", "pi": "“Idha, udāyi, bhikkhu satisambojjhaṅgaṁ bhāveti vivekanissitaṁ virāganissitaṁ nirodhanissitaṁ vossaggapariṇāmiṁ vipulaṁ mahaggataṁ appamāṇaṁ abyāpajjaṁ.", "url": "https://suttacentral.net/sn46.28/en/sujato#sn46.28:2.1", "contested": null, "sense": null}, "p-sn46.28-2.5": {"segment": "sn46.28:2.5", "en": "A mendicant develops the awakening factor of equanimity, which relies on seclusion, fading away, and cessation, and ripens as letting go. And it is abundant, expansive, limitless, and free of ill will.", "pi": "upekkhāsambojjhaṅgaṁ bhāveti vivekanissitaṁ virāganissitaṁ nirodhanissitaṁ vossaggapariṇāmiṁ vipulaṁ mahaggataṁ appamāṇaṁ abyāpajjaṁ.", "url": "https://suttacentral.net/sn46.28/en/sujato#sn46.28:2.5", "contested": null, "sense": null}, "p-sn46.28-2.9": {"segment": "sn46.28:2.9", "en": "This is how are the seven awakening factors are developed and cultivated so as to lead to penetration.”", "pi": "Evaṁ bhāvitā kho, udāyi, satta bojjhaṅgā evaṁ bahulīkatā nibbedhāya saṁvattantī”ti.", "url": "https://suttacentral.net/sn46.28/en/sujato#sn46.28:2.9", "contested": null, "sense": null}, "p-sn46.29-1.1": {"segment": "sn46.29:1.1", "en": "“Mendicants, I do not see a single thing that, when it is developed and cultivated like this, leads to giving up the things that tighten the fetters like the seven awakening factors.", "pi": "“Nāhaṁ, bhikkhave, aññaṁ ekadhammampi samanupassāmi, yo evaṁ bhāvito bahulīkato saṁyojanīyānaṁ dhammānaṁ pahānāya saṁvattati, yathayidaṁ, bhikkhave, satta bojjhaṅgā.", "url": "https://suttacentral.net/sn46.29/en/sujato#sn46.29:1.1", "contested": null, "sense": null}, "p-sn46.29-1.3": {"segment": "sn46.29:1.3", "en": "The awakening factors of mindfulness, investigation of principles, energy, rapture, tranquility, immersion, and equanimity.", "pi": "Satisambojjhaṅgo …pe… upekkhāsambojjhaṅgo.", "url": "https://suttacentral.net/sn46.29/en/sujato#sn46.29:1.3", "contested": null, "sense": null}, "p-sn46.29-2.2": {"segment": "sn46.29:2.2", "en": "and equanimity, which rely on seclusion, fading away, and cessation, and ripen as letting go.", "pi": "upekkhāsambojjhaṅgaṁ bhāveti vivekanissitaṁ virāganissitaṁ nirodhanissitaṁ vossaggapariṇāmiṁ.", "url": "https://suttacentral.net/sn46.29/en/sujato#sn46.29:2.2", "contested": null, "sense": null}, "p-sn46.29-2.3": {"segment": "sn46.29:2.3", "en": "That’s how the seven awakening factors are developed and cultivated so as to lead to giving up the things that tighten the fetters.", "pi": "Evaṁ bhāvitā kho, bhikkhave, satta bojjhaṅgā evaṁ bahulīkatā saṁyojanīyānaṁ dhammānaṁ pahānāya saṁvattanti.", "url": "https://suttacentral.net/sn46.29/en/sujato#sn46.29:2.3", "contested": null, "sense": null}, "p-sn46.3-1.9": {"segment": "sn46.3:1.9", "en": "as they recollect and think about that teaching.", "pi": "So tathā vūpakaṭṭho viharanto taṁ dhammaṁ anussarati anuvitakketi.", "url": "https://suttacentral.net/sn46.3/en/sujato#sn46.3:1.9", "contested": null, "sense": null}, "p-sn46.3-2.1": {"segment": "sn46.3:2.1", "en": "At such a time, a mendicant has initiated the awakening factor of mindfulness;", "pi": "Yasmiṁ samaye, bhikkhave, bhikkhu tathā vūpakaṭṭho viharanto taṁ dhammaṁ anussarati anuvitakketi, satisambojjhaṅgo tasmiṁ samaye bhikkhuno āraddho hoti;", "url": "https://suttacentral.net/sn46.3/en/sujato#sn46.3:2.1", "contested": null, "sense": null}, "p-sn46.3-2.4": {"segment": "sn46.3:2.4", "en": "As they live mindfully in this way they investigate, explore, and inquire into that teaching with wisdom.", "pi": "So tathā sato viharanto taṁ dhammaṁ paññāya pavicinati pavicarati parivīmaṁsamāpajjati.", "url": "https://suttacentral.net/sn46.3/en/sujato#sn46.3:2.4", "contested": null, "sense": null}, "p-sn46.3-3.1": {"segment": "sn46.3:3.1", "en": "At such a time, a mendicant has initiated the awakening factor of investigation of principles;", "pi": "Yasmiṁ samaye, bhikkhave, bhikkhu tathā sato viharanto taṁ dhammaṁ paññāya pavicinati pavicarati parivīmaṁsamāpajjati, dhammavicayasambojjhaṅgo tasmiṁ samaye bhikkhuno āraddho hoti;", "url": "https://suttacentral.net/sn46.3/en/sujato#sn46.3:3.1", "contested": null, "sense": null}, "p-sn46.3-3.4": {"segment": "sn46.3:3.4", "en": "As they investigate principles with wisdom in this way their energy is roused up and unflagging.", "pi": "Tassa taṁ dhammaṁ paññāya pavicinato pavicarato parivīmaṁsamāpajjato āraddhaṁ hoti vīriyaṁ asallīnaṁ.", "url": "https://suttacentral.net/sn46.3/en/sujato#sn46.3:3.4", "contested": null, "sense": null}, "p-sn46.3-4.1": {"segment": "sn46.3:4.1", "en": "At such a time, a mendicant has initiated the awakening factor of energy; they develop it and perfect it.", "pi": "Yasmiṁ samaye, bhikkhave, bhikkhuno taṁ dhammaṁ paññāya pavicinato pavicarato parivīmaṁsamāpajjato āraddhaṁ hoti vīriyaṁ asallīnaṁ, vīriyasambojjhaṅgo tasmiṁ samaye bhikkhuno āraddho hoti; vīriyasambojjhaṅgaṁ tasmiṁ samaye bhikkhu bhāveti; vīriyasambojjhaṅgo tasmiṁ samaye bhikkhuno bhāvanāpāripūriṁ gacchati.", "url": "https://suttacentral.net/sn46.3/en/sujato#sn46.3:4.1", "contested": null, "sense": null}, "p-sn46.3-4.2": {"segment": "sn46.3:4.2", "en": "When they’re energetic, rapture not of the flesh arises.", "pi": "Āraddhavīriyassa uppajjati pīti nirāmisā.", "url": "https://suttacentral.net/sn46.3/en/sujato#sn46.3:4.2", "contested": null, "sense": null}, "p-sn46.3-5.1": {"segment": "sn46.3:5.1", "en": "At such a time, a mendicant has initiated the awakening factor of rapture; they develop it and perfect it.", "pi": "Yasmiṁ samaye, bhikkhave, bhikkhuno āraddhavīriyassa uppajjati pīti nirāmisā, pītisambojjhaṅgo tasmiṁ samaye bhikkhuno āraddho hoti; pītisambojjhaṅgaṁ tasmiṁ samaye bhikkhu bhāveti; pītisambojjhaṅgo tasmiṁ samaye bhikkhuno bhāvanāpāripūriṁ gacchati.", "url": "https://suttacentral.net/sn46.3/en/sujato#sn46.3:5.1", "contested": null, "sense": null}, "p-sn46.3-5.2": {"segment": "sn46.3:5.2", "en": "When the mind is full of rapture, the body and mind become tranquil.", "pi": "Pītimanassa kāyopi passambhati, cittampi passambhati.", "url": "https://suttacentral.net/sn46.3/en/sujato#sn46.3:5.2", "contested": null, "sense": null}, "p-sn46.3-6.1": {"segment": "sn46.3:6.1", "en": "At such a time, a mendicant has initiated the awakening factor of tranquility; they develop it and perfect it.", "pi": "Yasmiṁ samaye, bhikkhave, bhikkhuno pītimanassa kāyopi passambhati cittampi passambhati, passaddhisambojjhaṅgo tasmiṁ samaye bhikkhuno āraddho hoti; passaddhisambojjhaṅgaṁ tasmiṁ samaye bhikkhu bhāveti; passaddhisambojjhaṅgo tasmiṁ samaye bhikkhuno bhāvanāpāripūriṁ gacchati.", "url": "https://suttacentral.net/sn46.3/en/sujato#sn46.3:6.1", "contested": null, "sense": null}, "p-sn46.3-6.2": {"segment": "sn46.3:6.2", "en": "When the body is tranquil and one feels bliss, the mind becomes immersed in samādhi.", "pi": "Passaddhakāyassa sukhino cittaṁ samādhiyati.", "url": "https://suttacentral.net/sn46.3/en/sujato#sn46.3:6.2", "contested": null, "sense": null}, "p-sn46.3-7.1": {"segment": "sn46.3:7.1", "en": "At such a time, a mendicant has initiated the awakening factor of immersion; they develop it and perfect it.", "pi": "Yasmiṁ samaye, bhikkhave, bhikkhuno passaddhakāyassa sukhino cittaṁ samādhiyati, samādhisambojjhaṅgo tasmiṁ samaye bhikkhuno āraddho hoti; samādhisambojjhaṅgaṁ tasmiṁ samaye bhikkhu bhāveti; samādhisambojjhaṅgo tasmiṁ samaye bhikkhuno bhāvanāpāripūriṁ gacchati.", "url": "https://suttacentral.net/sn46.3/en/sujato#sn46.3:7.1", "contested": null, "sense": null}, "p-sn46.3-7.2": {"segment": "sn46.3:7.2", "en": "They closely watch over that mind immersed in samādhi.", "pi": "So tathāsamāhitaṁ cittaṁ sādhukaṁ ajjhupekkhitā hoti.", "url": "https://suttacentral.net/sn46.3/en/sujato#sn46.3:7.2", "contested": null, "sense": null}, "p-sn46.3-8.1": {"segment": "sn46.3:8.1", "en": "At such a time, a mendicant has initiated the awakening factor of equanimity; they develop it and perfect it.", "pi": "Yasmiṁ samaye, bhikkhave, bhikkhu tathāsamāhitaṁ cittaṁ sādhukaṁ ajjhupekkhitā hoti, upekkhāsambojjhaṅgo tasmiṁ samaye bhikkhuno āraddho hoti; upekkhāsambojjhaṅgaṁ tasmiṁ samaye bhikkhu bhāveti; upekkhāsambojjhaṅgo tasmiṁ samaye bhikkhuno bhāvanāpāripūriṁ gacchati.", "url": "https://suttacentral.net/sn46.3/en/sujato#sn46.3:8.1", "contested": null, "sense": null}, "p-sn46.3-9.1": {"segment": "sn46.3:9.1", "en": "When the seven awakening factors are developed and cultivated in this way they can expect seven fruits and benefits.", "pi": "Evaṁ bhāvitesu kho, bhikkhave, sattasu sambojjhaṅgesu evaṁ bahulīkatesu satta phalā sattānisaṁsā pāṭikaṅkhā.", "url": "https://suttacentral.net/sn46.3/en/sujato#sn46.3:9.1", "contested": null, "sense": null}, "p-sn46.3-9.10": {"segment": "sn46.3:9.10", "en": "When the seven awakening factors are developed and cultivated in this way these are the seven fruits and benefits they can expect.”", "pi": "Evaṁ bhāvitesu kho, bhikkhave, sattasu bojjhaṅgesu evaṁ bahulīkatesu ime satta phalā sattānisaṁsā pāṭikaṅkhā”ti.", "url": "https://suttacentral.net/sn46.3/en/sujato#sn46.3:9.10", "contested": null, "sense": null}, "p-sn46.3-9.2": {"segment": "sn46.3:9.2", "en": "What seven?", "pi": "Katame satta phalā sattānisaṁsā?", "url": "https://suttacentral.net/sn46.3/en/sujato#sn46.3:9.2", "contested": null, "sense": null}, "p-sn46.3-9.3": {"segment": "sn46.3:9.3", "en": "They attain enlightenment early on in this very life.", "pi": "Diṭṭheva dhamme paṭikacca aññaṁ ārādheti.", "url": "https://suttacentral.net/sn46.3/en/sujato#sn46.3:9.3", "contested": null, "sense": null}, "p-sn46.3-9.4": {"segment": "sn46.3:9.4", "en": "If not, they attain enlightenment at the time of death.", "pi": "No ce diṭṭheva dhamme paṭikacca aññaṁ ārādheti, atha maraṇakāle aññaṁ ārādheti.", "url": "https://suttacentral.net/sn46.3/en/sujato#sn46.3:9.4", "contested": null, "sense": null}, "p-sn46.3-9.5": {"segment": "sn46.3:9.5", "en": "If not, with the ending of the five lower fetters, they’re extinguished between one life and the next.", "pi": "No ce diṭṭheva dhamme paṭikacca aññaṁ ārādheti, no ce maraṇakāle aññaṁ ārādheti, atha pañcannaṁ orambhāgiyānaṁ saṁyojanānaṁ parikkhayā antarāparinibbāyī hoti.", "url": "https://suttacentral.net/sn46.3/en/sujato#sn46.3:9.5", "contested": null, "sense": null}, "p-sn46.3-9.6": {"segment": "sn46.3:9.6", "en": "If not, with the ending of the five lower fetters they’re extinguished upon landing.", "pi": "No ce diṭṭheva dhamme paṭikacca aññaṁ ārādheti, no ce maraṇakāle aññaṁ ārādheti, no ce pañcannaṁ orambhāgiyānaṁ saṁyojanānaṁ parikkhayā antarāparinibbāyī hoti, atha pañcannaṁ orambhāgiyānaṁ saṁyojanānaṁ parikkhayā upahaccaparinibbāyī hoti.", "url": "https://suttacentral.net/sn46.3/en/sujato#sn46.3:9.6", "contested": null, "sense": null}, "p-sn46.3-9.7": {"segment": "sn46.3:9.7", "en": "If not, with the ending of the five lower fetters they’re extinguished without extra effort.", "pi": "No ce diṭṭheva dhamme paṭikacca aññaṁ ārādheti, no ce maraṇakāle aññaṁ ārādheti, no ce pañcannaṁ orambhāgiyānaṁ saṁyojanānaṁ parikkhayā antarāparinibbāyī hoti, no ce pañcannaṁ orambhāgiyānaṁ saṁyojanānaṁ parikkhayā upahaccaparinibbāyī hoti, atha pañcannaṁ orambhāgiyānaṁ saṁyojanānaṁ parikkhayā asaṅkhāraparinibbāyī hoti.", "url": "https://suttacentral.net/sn46.3/en/sujato#sn46.3:9.7", "contested": null, "sense": null}, "p-sn46.3-9.8": {"segment": "sn46.3:9.8", "en": "If not, with the ending of the five lower fetters they’re extinguished with extra effort.", "pi": "No ce diṭṭheva dhamme paṭikacca aññaṁ ārādheti, no ce maraṇakāle aññaṁ ārādheti, no ce pañcannaṁ orambhāgiyānaṁ saṁyojanānaṁ parikkhayā antarāparinibbāyī hoti, no ce pañcannaṁ orambhāgiyānaṁ saṁyojanānaṁ parikkhayā upahaccaparinibbāyī hoti, no ce pañcannaṁ orambhāgiyānaṁ saṁyojanānaṁ parikkhayā asaṅkhāraparinibbāyī hoti, atha pañcannaṁ orambhāgiyānaṁ saṁyojanānaṁ parikkhayā sasaṅkhāraparinibbāyī hoti.", "url": "https://suttacentral.net/sn46.3/en/sujato#sn46.3:9.8", "contested": null, "sense": null}, "p-sn46.3-9.9": {"segment": "sn46.3:9.9", "en": "If not, with the ending of the five lower fetters they head upstream, going to the Akaniṭṭha realm.", "pi": "No ce diṭṭheva dhamme paṭikacca aññaṁ ārādheti, no ce maraṇakāle aññaṁ ārādheti, no ce pañcannaṁ orambhāgiyānaṁ saṁyojanānaṁ parikkhayā antarāparinibbāyī hoti, no ce pañcannaṁ orambhāgiyānaṁ saṁyojanānaṁ parikkhayā upahaccaparinibbāyī hoti, no ce pañcannaṁ orambhāgiyānaṁ saṁyojanānaṁ parikkhayā asaṅkhāraparinibbāyī hoti, no ce pañcannaṁ orambhāgiyānaṁ saṁyojanānaṁ parikkhayā sasaṅkhāraparinibbāyī hoti, atha pañcannaṁ orambhāgiyānaṁ saṁyojanānaṁ parikkhayā uddhaṁsoto hoti akaniṭṭhagāmī.", "url": "https://suttacentral.net/sn46.3/en/sujato#sn46.3:9.9", "contested": null, "sense": null}, "p-sn46.31-1.1": {"segment": "sn46.31:1.1", "en": "“Mendicants, whatever qualities are skillful, part of the skillful, on the side of the skillful, all of them are rooted in diligence and meet at diligence, and diligence is said to be the best of them.", "pi": "“Ye keci, bhikkhave, dhammā kusalā kusalabhāgiyā kusalapakkhikā, sabbe te appamādamūlakā appamādasamosaraṇā; appamādo tesaṁ dhammānaṁ aggamakkhāyati.", "url": "https://suttacentral.net/sn46.31/en/sujato#sn46.31:1.1", "contested": null, "sense": null}, "p-sn46.31-1.2": {"segment": "sn46.31:1.2", "en": "A mendicant who is diligent can expect to develop and cultivate the seven awakening factors.", "pi": "Appamattassetaṁ, bhikkhave, bhikkhuno pāṭikaṅkhaṁ—satta bojjhaṅge bhāvessati, satta bojjhaṅge bahulīkarissati.", "url": "https://suttacentral.net/sn46.31/en/sujato#sn46.31:1.2", "contested": null, "sense": null}, "p-sn46.31-2.3": {"segment": "sn46.31:2.3", "en": "and equanimity, which rely on seclusion, fading away, and cessation, and ripen as letting go.", "pi": "upekkhāsambojjhaṅgaṁ bhāveti vivekanissitaṁ virāganissitaṁ nirodhanissitaṁ vossaggapariṇāmiṁ.", "url": "https://suttacentral.net/sn46.31/en/sujato#sn46.31:2.3", "contested": null, "sense": null}, "p-sn46.32-1.1": {"segment": "sn46.32:1.1", "en": "“Mendicants, whatever qualities are skillful, part of the skillful, on the side of the skillful, all of them are rooted in rational application of mind and meet at rational application of mind, and rational application of mind is said to be the best of them.", "pi": "“Ye keci, bhikkhave, dhammā kusalā kusalabhāgiyā kusalapakkhikā, sabbe te yonisomanasikāramūlakā yonisomanasikārasamosaraṇā; yonisomanasikāro tesaṁ dhammānaṁ aggamakkhāyati.", "url": "https://suttacentral.net/sn46.32/en/sujato#sn46.32:1.1", "contested": null, "sense": null}, "p-sn46.32-1.2": {"segment": "sn46.32:1.2", "en": "A mendicant accomplished in rational application of mind can expect to develop and cultivate the seven awakening factors.", "pi": "Yonisomanasikārasampannassetaṁ, bhikkhave, bhikkhuno pāṭikaṅkhaṁ—satta bojjhaṅge bhāvessati, satta bojjhaṅge bahulīkarissati.", "url": "https://suttacentral.net/sn46.32/en/sujato#sn46.32:1.2", "contested": null, "sense": null}, "p-sn46.32-2.3": {"segment": "sn46.32:2.3", "en": "and equanimity, which rely on seclusion, fading away, and cessation, and ripen as letting go.", "pi": "upekkhāsambojjhaṅgaṁ bhāveti vivekanissitaṁ virāganissitaṁ nirodhanissitaṁ vossaggapariṇāmiṁ.", "url": "https://suttacentral.net/sn46.32/en/sujato#sn46.32:2.3", "contested": null, "sense": null}, "p-sn46.33-2.1": {"segment": "sn46.33:2.1", "en": "In the same way, there are these five corruptions of the mind. When the mind is corrupted by these it’s not pliable, workable, or radiant. It’s brittle, and not rightly immersed in samādhi for the ending of defilements.", "pi": "Evameva kho, bhikkhave, pañcime cittassa upakkilesā, yehi upakkilesehi upakkiliṭṭhaṁ cittaṁ na ceva mudu hoti na ca kammaniyaṁ, na ca pabhassaraṁ pabhaṅgu ca, na ca sammā samādhiyati āsavānaṁ khayāya.", "url": "https://suttacentral.net/sn46.33/en/sujato#sn46.33:2.1", "contested": null, "sense": null}, "p-sn46.33-2.3": {"segment": "sn46.33:2.3", "en": "Sensual desire, ill will, dullness and drowsiness, restlessness and remorse, and doubt.", "pi": "Kāmacchando, bhikkhave, cittassa upakkileso, yena upakkilesena upakkiliṭṭhaṁ cittaṁ na ceva mudu hoti na ca kammaniyaṁ, na ca pabhassaraṁ pabhaṅgu ca, na ca sammā samādhiyati āsavānaṁ khayāya …pe…", "url": "https://suttacentral.net/sn46.33/en/sujato#sn46.33:2.3", "contested": null, "sense": null}, "p-sn46.33-2.4": {"segment": "sn46.33:2.4", "en": "These are the five corruptions of the mind. When the mind is corrupted by these it’s not pliable, workable, or radiant. It’s brittle, and not rightly immersed in samādhi for the ending of defilements.”", "pi": "ime kho, bhikkhave, pañca cittassa upakkilesā, yehi upakkilesehi upakkiliṭṭhaṁ cittaṁ na ceva mudu hoti na ca kammaniyaṁ, na ca pabhassaraṁ pabhaṅgu ca, na ca sammā samādhiyati āsavānaṁ khayāyā”ti.", "url": "https://suttacentral.net/sn46.33/en/sujato#sn46.33:2.4", "contested": null, "sense": null}, "p-sn46.34-1.1": {"segment": "sn46.34:1.1", "en": "“Mendicants, these seven awakening factors are not obstacles, hindrances, or corruptions of the mind. When developed and cultivated they lead to the realization of the fruit of knowledge and freedom.", "pi": "“Sattime, bhikkhave, bojjhaṅgā anāvaraṇā anīvaraṇā cetaso anupakkilesā bhāvitā bahulīkatā vijjāvimuttiphalasacchikiriyāya saṁvattanti.", "url": "https://suttacentral.net/sn46.34/en/sujato#sn46.34:1.1", "contested": null, "sense": null}, "p-sn46.34-1.3": {"segment": "sn46.34:1.3", "en": "The awakening factors of mindfulness, investigation of principles, energy, rapture, tranquility, immersion, and equanimity.", "pi": "Satisambojjhaṅgo, bhikkhave, anāvaraṇo anīvaraṇo cetaso anupakkileso bhāvito bahulīkato vijjāvimuttiphalasacchikiriyāya saṁvattati …pe… upekkhāsambojjhaṅgo, bhikkhave, anāvaraṇo anīvaraṇo cetaso anupakkileso bhāvito bahulīkato vijjāvimuttiphalasacchikiriyāya saṁvattati.", "url": "https://suttacentral.net/sn46.34/en/sujato#sn46.34:1.3", "contested": null, "sense": null}, "p-sn46.34-1.4": {"segment": "sn46.34:1.4", "en": "These seven awakening factors are not obstacles, hindrances, or corruptions of the mind. When developed and cultivated they lead to the realization of the fruit of knowledge and freedom.”", "pi": "Ime kho, bhikkhave, satta bojjhaṅgā anāvaraṇā anīvaraṇā cetaso anupakkilesā bhāvitā bahulīkatā vijjāvimuttiphalasacchikiriyāya saṁvattantī”ti.", "url": "https://suttacentral.net/sn46.34/en/sujato#sn46.34:1.4", "contested": null, "sense": null}, "p-sn46.35-1.1": {"segment": "sn46.35:1.1", "en": "“Mendicants, when you apply the mind irrationally, sensual desire, ill will, dullness and drowsiness, restlessness and remorse, and doubt arise, and once arisen they increase and grow.”", "pi": "“Ayoniso, bhikkhave, manasikaroto anuppanno ceva kāmacchando uppajjati, uppanno ca kāmacchando bhiyyobhāvāya vepullāya saṁvattati; anuppanno ceva byāpādo uppajjati, uppanno ca byāpādo bhiyyobhāvāya vepullāya saṁvattati; anuppannañceva thinamiddhaṁ uppajjati, uppannañca thinamiddhaṁ bhiyyobhāvāya vepullāya saṁvattati; anuppannañceva uddhaccakukkuccaṁ uppajjati, uppannañca uddhaccakukkuccaṁ bhiyyobhāvāya vepullāya saṁvattati; anuppannā ceva vicikicchā uppajjati, uppannā ca vicikicchā bhiyyobhāvāya vepullāya saṁvattatī”ti.", "url": "https://suttacentral.net/sn46.35/en/sujato#sn46.35:1.1", "contested": null, "sense": null}, "p-sn46.35-2.1": {"segment": "sn46.35:2.1", "en": "“Mendicants, when you apply the mind rationally, the awakening factors of mindfulness, investigation of principles, energy, rapture, tranquility, immersion, and equanimity arise, and once they’ve arisen, they’re fully developed.”", "pi": "“Yoniso ca kho, bhikkhave, manasikaroto anuppanno ceva satisambojjhaṅgo uppajjati, uppanno ca satisambojjhaṅgo bhāvanāpāripūriṁ gacchati …pe… anuppanno ceva upekkhāsambojjhaṅgo uppajjati, uppanno ca upekkhāsambojjhaṅgo bhāvanāpāripūriṁ gacchatī”ti.", "url": "https://suttacentral.net/sn46.35/en/sujato#sn46.35:2.1", "contested": null, "sense": null}, "p-sn46.36-1.1": {"segment": "sn46.36:1.1", "en": "“Mendicants, when the seven awakening factors are developed and cultivated they lead to growth and progress.", "pi": "“Sattime, bhikkhave, bojjhaṅgā bhāvitā bahulīkatā buddhiyā aparihānāya saṁvattanti.", "url": "https://suttacentral.net/sn46.36/en/sujato#sn46.36:1.1", "contested": null, "sense": null}, "p-sn46.36-1.3": {"segment": "sn46.36:1.3", "en": "The awakening factors of mindfulness, investigation of principles, energy, rapture, tranquility, immersion, and equanimity.", "pi": "Satisambojjhaṅgo …pe… upekkhāsambojjhaṅgo.", "url": "https://suttacentral.net/sn46.36/en/sujato#sn46.36:1.3", "contested": null, "sense": null}, "p-sn46.36-1.4": {"segment": "sn46.36:1.4", "en": "When these seven awakening factors are developed and cultivated they lead to growth and progress.”", "pi": "Ime kho, bhikkhave, satta bojjhaṅgā bhāvitā bahulīkatā buddhiyā aparihānāya saṁvattantī”ti.", "url": "https://suttacentral.net/sn46.36/en/sujato#sn46.36:1.4", "contested": null, "sense": null}, "p-sn46.37-1.1": {"segment": "sn46.37:1.1", "en": "“Mendicants, there are these five obstacles and hindrances, corruptions of the heart that weaken wisdom.", "pi": "“Pañcime, bhikkhave, āvaraṇā nīvaraṇā cetaso upakkilesā paññāya dubbalīkaraṇā.", "url": "https://suttacentral.net/sn46.37/en/sujato#sn46.37:1.1", "contested": null, "sense": null}, "p-sn46.37-1.3": {"segment": "sn46.37:1.3", "en": "Sensual desire,", "pi": "Kāmacchando, bhikkhave, āvaraṇo nīvaraṇo cetaso upakkileso paññāya dubbalīkaraṇo.", "url": "https://suttacentral.net/sn46.37/en/sujato#sn46.37:1.3", "contested": null, "sense": null}, "p-sn46.37-1.4": {"segment": "sn46.37:1.4", "en": "ill will,", "pi": "Byāpādo, bhikkhave, āvaraṇo nīvaraṇo cetaso upakkileso paññāya dubbalīkaraṇo.", "url": "https://suttacentral.net/sn46.37/en/sujato#sn46.37:1.4", "contested": null, "sense": null}, "p-sn46.37-1.5": {"segment": "sn46.37:1.5", "en": "dullness and drowsiness,", "pi": "Thinamiddhaṁ, bhikkhave, āvaraṇaṁ nīvaraṇaṁ cetaso upakkilesaṁ paññāya dubbalīkaraṇaṁ.", "url": "https://suttacentral.net/sn46.37/en/sujato#sn46.37:1.5", "contested": null, "sense": null}, "p-sn46.37-1.6": {"segment": "sn46.37:1.6", "en": "restlessness and remorse,", "pi": "Uddhaccakukkuccaṁ, bhikkhave, āvaraṇaṁ nīvaraṇaṁ cetaso upakkilesaṁ paññāya dubbalīkaraṇaṁ.", "url": "https://suttacentral.net/sn46.37/en/sujato#sn46.37:1.6", "contested": null, "sense": null}, "p-sn46.37-1.7": {"segment": "sn46.37:1.7", "en": "and doubt.", "pi": "Vicikicchā, bhikkhave, āvaraṇā nīvaraṇā cetaso upakkilesā paññāya dubbalīkaraṇā.", "url": "https://suttacentral.net/sn46.37/en/sujato#sn46.37:1.7", "contested": null, "sense": null}, "p-sn46.37-1.8": {"segment": "sn46.37:1.8", "en": "These are the five obstacles and hindrances, corruptions of the heart that weaken wisdom.", "pi": "Ime kho, bhikkhave, pañca āvaraṇā nīvaraṇā cetaso upakkilesā paññāya dubbalīkaraṇā.", "url": "https://suttacentral.net/sn46.37/en/sujato#sn46.37:1.8", "contested": null, "sense": null}, "p-sn46.37-2.1": {"segment": "sn46.37:2.1", "en": "There are these seven awakening factors that are not obstacles, hindrances, or corruptions of the mind. When developed and cultivated they lead to the realization of the fruit of knowledge and freedom.", "pi": "Sattime, bhikkhave, bojjhaṅgā anāvaraṇā anīvaraṇā cetaso anupakkilesā bhāvitā bahulīkatā vijjāvimuttiphalasacchikiriyāya saṁvattanti.", "url": "https://suttacentral.net/sn46.37/en/sujato#sn46.37:2.1", "contested": null, "sense": null}, "p-sn46.37-2.3": {"segment": "sn46.37:2.3", "en": "The awakening factors of mindfulness, investigation of principles, energy, rapture, tranquility, immersion, and equanimity.", "pi": "Satisambojjhaṅgo, bhikkhave, anāvaraṇo anīvaraṇo cetaso anupakkileso bhāvito bahulīkato vijjāvimuttiphalasacchikiriyāya saṁvattati …pe… upekkhāsambojjhaṅgo, bhikkhave, anāvaraṇo anīvaraṇo cetaso anupakkileso bhāvito bahulīkato vijjāvimuttiphalasacchikiriyāya saṁvattati.", "url": "https://suttacentral.net/sn46.37/en/sujato#sn46.37:2.3", "contested": null, "sense": null}, "p-sn46.37-2.4": {"segment": "sn46.37:2.4", "en": "These seven awakening factors are not obstacles, hindrances, or corruptions of the mind. When developed and cultivated they lead to the realization of the fruit of knowledge and freedom.”", "pi": "Ime kho, bhikkhave, satta bojjhaṅgā anāvaraṇā anīvaraṇā cetaso anupakkilesā bhāvitā bahulīkatā vijjāvimuttiphalasacchikiriyāya saṁvattantīti.", "url": "https://suttacentral.net/sn46.37/en/sujato#sn46.37:2.4", "contested": null, "sense": null}, "p-sn46.38-1.1": {"segment": "sn46.38:1.1", "en": "“Mendicants, sometimes a noble disciple pays attention, applies the mind, concentrates wholeheartedly, and actively listens to the teaching. At such a time the five hindrances are absent, and the seven awakening factors are fully developed.", "pi": "Yasmiṁ, bhikkhave, samaye ariyasāvako aṭṭhiṁ katvā manasi katvā sabbaṁ cetaso samannāharitvā ohitasoto dhammaṁ suṇāti, imassa pañca nīvaraṇā tasmiṁ samaye na honti. Satta bojjhaṅgā tasmiṁ samaye bhāvanāpāripūriṁ gacchanti.", "url": "https://suttacentral.net/sn46.38/en/sujato#sn46.38:1.1", "contested": null, "sense": null}, "p-sn46.38-2.1": {"segment": "sn46.38:2.1", "en": "What are the five hindrances that are absent?", "pi": "Katame pañca nīvaraṇā tasmiṁ samaye na honti?", "url": "https://suttacentral.net/sn46.38/en/sujato#sn46.38:2.1", "contested": null, "sense": null}, "p-sn46.38-2.2": {"segment": "sn46.38:2.2", "en": "Sensual desire, ill will, dullness and drowsiness, restlessness and remorse, and doubt.", "pi": "Kāmacchandanīvaraṇaṁ tasmiṁ samaye na hoti, byāpādanīvaraṇaṁ tasmiṁ samaye na hoti, thinamiddhanīvaraṇaṁ tasmiṁ samaye na hoti, uddhaccakukkuccanīvaraṇaṁ tasmiṁ samaye na hoti, vicikicchānīvaraṇaṁ tasmiṁ samaye na hoti.", "url": "https://suttacentral.net/sn46.38/en/sujato#sn46.38:2.2", "contested": null, "sense": null}, "p-sn46.38-3.1": {"segment": "sn46.38:3.1", "en": "And what are the seven awakening factors that are fully developed?", "pi": "Katame satta bojjhaṅgā tasmiṁ samaye bhāvanāpāripūriṁ gacchanti?", "url": "https://suttacentral.net/sn46.38/en/sujato#sn46.38:3.1", "contested": null, "sense": null}, "p-sn46.38-3.2": {"segment": "sn46.38:3.2", "en": "The awakening factors of mindfulness, investigation of principles, energy, rapture, tranquility, immersion, and equanimity.", "pi": "Satisambojjhaṅgo tasmiṁ samaye bhāvanāpāripūriṁ gacchati …pe… upekkhāsambojjhaṅgo tasmiṁ samaye bhāvanāpāripūriṁ gacchati.", "url": "https://suttacentral.net/sn46.38/en/sujato#sn46.38:3.2", "contested": null, "sense": null}, "p-sn46.38-3.4": {"segment": "sn46.38:3.4", "en": "Sometimes a noble disciple pays attention, applies the mind, concentrates wholeheartedly, and actively listens to the teaching. At such a time the five hindrances are absent, and the seven awakening factors are fully developed.”", "pi": "Yasmiṁ, bhikkhave, samaye ariyasāvako aṭṭhiṁ katvā manasi katvā sabbaṁ cetaso samannāharitvā ohitasoto dhammaṁ suṇāti, imassa pañca nīvaraṇā tasmiṁ samaye na honti. Ime satta bojjhaṅgā tasmiṁ samaye bhāvanāpāripūriṁ gacchantī”ti.", "url": "https://suttacentral.net/sn46.38/en/sujato#sn46.38:3.4", "contested": null, "sense": null}, "p-sn46.40-1.1": {"segment": "sn46.40:1.1", "en": "“Mendicants, these five hindrances are destroyers of sight, vision, and knowledge. They block wisdom, they’re on the side of distress, and they don’t lead to extinguishment.", "pi": "“Pañcime, bhikkhave, nīvaraṇā andhakaraṇā acakkhukaraṇā aññāṇakaraṇā paññānirodhikā vighātapakkhiyā anibbānasaṁvattanikā.", "url": "https://suttacentral.net/sn46.40/en/sujato#sn46.40:1.1", "contested": null, "sense": null}, "p-sn46.40-1.3": {"segment": "sn46.40:1.3", "en": "Sensual desire, ill will, dullness and drowsiness, restlessness and remorse, and doubt.", "pi": "Kāmacchandanīvaraṇaṁ, bhikkhave, andhakaraṇaṁ acakkhukaraṇaṁ aññāṇakaraṇaṁ paññānirodhikaṁ vighātapakkhiyaṁ anibbānasaṁvattanikaṁ.", "url": "https://suttacentral.net/sn46.40/en/sujato#sn46.40:1.3", "contested": null, "sense": null}, "p-sn46.40-1.8": {"segment": "sn46.40:1.8", "en": "These five hindrances are destroyers of sight, vision, and knowledge. They block wisdom, they’re on the side of distress, and they don’t lead to extinguishment.", "pi": "Ime kho, bhikkhave, pañca nīvaraṇā andhakaraṇā acakkhukaraṇā aññāṇakaraṇā paññānirodhikā vighātapakkhiyā anibbānasaṁvattanikā.", "url": "https://suttacentral.net/sn46.40/en/sujato#sn46.40:1.8", "contested": null, "sense": null}, "p-sn46.40-2.1": {"segment": "sn46.40:2.1", "en": "These seven awakening factors are creators of vision and knowledge. They grow wisdom, they’re on the side of solace, and they lead to extinguishment.", "pi": "Sattime, bhikkhave, bojjhaṅgā cakkhukaraṇā ñāṇakaraṇā paññābuddhiyā avighātapakkhiyā nibbānasaṁvattanikā.", "url": "https://suttacentral.net/sn46.40/en/sujato#sn46.40:2.1", "contested": null, "sense": null}, "p-sn46.40-2.3": {"segment": "sn46.40:2.3", "en": "The awakening factors of mindfulness, investigation of principles, energy, rapture, tranquility, immersion, and equanimity.", "pi": "Satisambojjhaṅgo, bhikkhave, cakkhukaraṇo ñāṇakaraṇo paññābuddhiyo avighātapakkhiyo nibbānasaṁvattaniko …pe… upekkhāsambojjhaṅgo, bhikkhave, cakkhukaraṇo ñāṇakaraṇo paññābuddhiyo avighātapakkhiyo nibbānasaṁvattaniko.", "url": "https://suttacentral.net/sn46.40/en/sujato#sn46.40:2.3", "contested": null, "sense": null}, "p-sn46.40-2.4": {"segment": "sn46.40:2.4", "en": "These seven awakening factors are creators of vision and knowledge. They grow wisdom, they’re on the side of solace, and they lead to extinguishment.”", "pi": "Ime kho, bhikkhave, satta bojjhaṅgā cakkhukaraṇā ñāṇakaraṇā paññābuddhiyā avighātapakkhiyā nibbānasaṁvattanikā”ti.", "url": "https://suttacentral.net/sn46.40/en/sujato#sn46.40:2.4", "contested": null, "sense": null}, "p-sn46.41-1.2": {"segment": "sn46.41:1.2", "en": "“Mendicants, all the ascetics and brahmins in the past who have given up the three discriminations have done so by developing and cultivating the seven awakening factors.", "pi": "“Ye hi keci, bhikkhave, atītamaddhānaṁ samaṇā vā brāhmaṇā vā tisso vidhā pajahiṁsu, sabbe te sattannaṁ bojjhaṅgānaṁ bhāvitattā bahulīkatattā.", "url": "https://suttacentral.net/sn46.41/en/sujato#sn46.41:1.2", "contested": null, "sense": null}, "p-sn46.41-1.3": {"segment": "sn46.41:1.3", "en": "All the ascetics and brahmins in the future who will give up the three discriminations will do so by developing and cultivating the seven awakening factors.", "pi": "Ye hi keci, bhikkhave, anāgatamaddhānaṁ samaṇā vā brāhmaṇā vā tisso vidhā pajahissanti, sabbe te sattannaṁ bojjhaṅgānaṁ bhāvitattā bahulīkatattā.", "url": "https://suttacentral.net/sn46.41/en/sujato#sn46.41:1.3", "contested": null, "sense": null}, "p-sn46.41-1.4": {"segment": "sn46.41:1.4", "en": "All the ascetics and brahmins in the present who are giving up the three discriminations do so by developing and cultivating the seven awakening factors.", "pi": "Ye hi keci, bhikkhave, etarahi samaṇā vā brāhmaṇā vā tisso vidhā pajahanti, sabbe te sattannaṁ bojjhaṅgānaṁ bhāvitattā bahulīkatattā.", "url": "https://suttacentral.net/sn46.41/en/sujato#sn46.41:1.4", "contested": null, "sense": null}, "p-sn46.41-1.6": {"segment": "sn46.41:1.6", "en": "The awakening factors of mindfulness, investigation of principles, energy, rapture, tranquility, immersion, and equanimity.", "pi": "Satisambojjhaṅgassa …pe… upekkhāsambojjhaṅgassa.", "url": "https://suttacentral.net/sn46.41/en/sujato#sn46.41:1.6", "contested": null, "sense": null}, "p-sn46.41-1.9": {"segment": "sn46.41:1.9", "en": "and present who give up the three discriminations do so by developing and cultivating the seven awakening factors.”", "pi": "pajahanti, sabbe te imesaṁyeva sattannaṁ bojjhaṅgānaṁ bhāvitattā bahulīkatattā”ti.", "url": "https://suttacentral.net/sn46.41/en/sujato#sn46.41:1.9", "contested": null, "sense": null}, "p-sn46.43-1.1": {"segment": "sn46.43:1.1", "en": "“Mendicants, I will teach you a path for crushing Māra’s army.", "pi": "“Mārasenappamaddanaṁ vo, bhikkhave, maggaṁ desessāmi;", "url": "https://suttacentral.net/sn46.43/en/sujato#sn46.43:1.1", "contested": null, "sense": null}, "p-sn46.43-1.5": {"segment": "sn46.43:1.5", "en": "It is the seven awakening factors.", "pi": "satta bojjhaṅgā.", "url": "https://suttacentral.net/sn46.43/en/sujato#sn46.43:1.5", "contested": null, "sense": null}, "p-sn46.43-1.7": {"segment": "sn46.43:1.7", "en": "The awakening factors of mindfulness, investigation of principles, energy, rapture, tranquility, immersion, and equanimity.", "pi": "Satisambojjhaṅgo …pe… upekkhāsambojjhaṅgo—", "url": "https://suttacentral.net/sn46.43/en/sujato#sn46.43:1.7", "contested": null, "sense": null}, "p-sn46.43-1.8": {"segment": "sn46.43:1.8", "en": "This is the path for crushing Māra’s army.”", "pi": "ayaṁ kho, bhikkhave, mārasenappamaddano maggo”ti.", "url": "https://suttacentral.net/sn46.43/en/sujato#sn46.43:1.8", "contested": null, "sense": null}, "p-sn46.48-1.2": {"segment": "sn46.48:1.2", "en": "In the same way, for a mendicant good friendship is the forerunner and harbinger of the arising of the seven awakening factors.", "pi": "Evameva kho, bhikkhave, bhikkhuno sattannaṁ bojjhaṅgānaṁ uppādāya etaṁ pubbaṅgamaṁ etaṁ pubbanimittaṁ, yadidaṁ—kalyāṇamittatā.", "url": "https://suttacentral.net/sn46.48/en/sujato#sn46.48:1.2", "contested": null, "sense": null}, "p-sn46.48-1.3": {"segment": "sn46.48:1.3", "en": "A mendicant with good friends can expect to develop and cultivate the seven awakening factors.", "pi": "Kalyāṇamittassetaṁ, bhikkhave, bhikkhuno pāṭikaṅkhaṁ—satta bojjhaṅge bhāvessati, satta bojjhaṅge bahulīkarissati.", "url": "https://suttacentral.net/sn46.48/en/sujato#sn46.48:1.3", "contested": null, "sense": null}, "p-sn46.48-1.6": {"segment": "sn46.48:1.6", "en": "and equanimity, which rely on seclusion, fading away, and cessation, and ripen as letting go.", "pi": "upekkhāsambojjhaṅgaṁ bhāveti vivekanissitaṁ virāganissitaṁ nirodhanissitaṁ vossaggapariṇāmiṁ.", "url": "https://suttacentral.net/sn46.48/en/sujato#sn46.48:1.6", "contested": null, "sense": null}, "p-sn46.49-1.1": {"segment": "sn46.49:1.1", "en": "“Taking into account interior factors, mendicants, I do not see a single one that gives rise to the seven awakening factors like rational application of mind. …”", "pi": "“Ajjhattikaṁ, bhikkhave, aṅganti karitvā nāññaṁ ekaṅgampi samanupassāmi sattannaṁ bojjhaṅgānaṁ uppādāya, yathayidaṁ—bhikkhave, yonisomanasikāro.", "url": "https://suttacentral.net/sn46.49/en/sujato#sn46.49:1.1", "contested": null, "sense": null}, "p-sn46.5-1.11": {"segment": "sn46.5:1.11", "en": "They’re called awakening factors because they lead to awakening.”", "pi": "Bodhāya saṁvattantīti, bhikkhu, tasmā ‘bojjhaṅgā’ti vuccantī”ti.", "url": "https://suttacentral.net/sn46.5/en/sujato#sn46.5:1.11", "contested": null, "sense": null}, "p-sn46.5-1.5": {"segment": "sn46.5:1.5", "en": "“Mendicant, they’re called awakening factors because they lead to awakening.", "pi": "“Bodhāya saṁvattantīti kho, bhikkhu, tasmā ‘bojjhaṅgā’ti vuccanti.", "url": "https://suttacentral.net/sn46.5/en/sujato#sn46.5:1.5", "contested": null, "sense": null}, "p-sn46.5-1.6": {"segment": "sn46.5:1.6", "en": "A mendicant develops the awakening factors of mindfulness, investigation of principles, energy, rapture, tranquility, immersion,", "pi": "Idha, bhikkhu, satisambojjhaṅgaṁ bhāveti vivekanissitaṁ virāganissitaṁ nirodhanissitaṁ vossaggapariṇāmiṁ …pe…", "url": "https://suttacentral.net/sn46.5/en/sujato#sn46.5:1.6", "contested": null, "sense": null}, "p-sn46.5-1.7": {"segment": "sn46.5:1.7", "en": "and equanimity, which rely on seclusion, fading away, and cessation, and ripen as letting go.", "pi": "upekkhāsambojjhaṅgaṁ bhāveti vivekanissitaṁ virāganissitaṁ nirodhanissitaṁ vossaggapariṇāmiṁ.", "url": "https://suttacentral.net/sn46.5/en/sujato#sn46.5:1.7", "contested": null, "sense": null}, "p-sn46.50-1.1": {"segment": "sn46.50:1.1", "en": "“Taking into account exterior factors, mendicants, I do not see a single one that gives rise to the seven awakening factors like good friendship. …”", "pi": "“Bāhiraṁ, bhikkhave, aṅganti karitvā nāññaṁ ekaṅgampi samanupassāmi sattannaṁ bojjhaṅgānaṁ uppādāya, yathayidaṁ—bhikkhave, kalyāṇamittatā.", "url": "https://suttacentral.net/sn46.50/en/sujato#sn46.50:1.1", "contested": null, "sense": null}, "p-sn46.51-1.2": {"segment": "sn46.51:1.2", "en": "“Mendicants, I will teach you what fuels and what starves the five hindrances and the seven awakening factors.", "pi": "“Pañcannañca, bhikkhave, nīvaraṇānaṁ sattannañca bojjhaṅgānaṁ āhārañca anāhārañca desessāmi;", "url": "https://suttacentral.net/sn46.51/en/sujato#sn46.51:1.2", "contested": null, "sense": null}, "p-sn46.51-1.5": {"segment": "sn46.51:1.5", "en": "There is the feature of beauty.", "pi": "Atthi, bhikkhave, subhanimittaṁ.", "url": "https://suttacentral.net/sn46.51/en/sujato#sn46.51:1.5", "contested": null, "sense": null}, "p-sn46.51-1.6": {"segment": "sn46.51:1.6", "en": "Frequent irrational application of mind to that", "pi": "Tattha ayonisomanasikārabahulīkāro—", "url": "https://suttacentral.net/sn46.51/en/sujato#sn46.51:1.6", "contested": null, "sense": null}, "p-sn46.51-10.2": {"segment": "sn46.51:10.2", "en": "There is tranquility of the body and of the mind.", "pi": "Atthi, bhikkhave, kāyappassaddhi cittappassaddhi.", "url": "https://suttacentral.net/sn46.51/en/sujato#sn46.51:10.2", "contested": null, "sense": null}, "p-sn46.51-10.3": {"segment": "sn46.51:10.3", "en": "Frequent rational application of mind to that", "pi": "Tattha yonisomanasikārabahulīkāro—", "url": "https://suttacentral.net/sn46.51/en/sujato#sn46.51:10.3", "contested": null, "sense": null}, "p-sn46.51-11.2": {"segment": "sn46.51:11.2", "en": "There are things that are the basis of serenity and freedom from distraction.", "pi": "Atthi, bhikkhave, samathanimittaṁ abyagganimittaṁ.", "url": "https://suttacentral.net/sn46.51/en/sujato#sn46.51:11.2", "contested": null, "sense": null}, "p-sn46.51-11.3": {"segment": "sn46.51:11.3", "en": "Frequent rational application of mind to them", "pi": "Tattha yonisomanasikārabahulīkāro—", "url": "https://suttacentral.net/sn46.51/en/sujato#sn46.51:11.3", "contested": null, "sense": null}, "p-sn46.51-12.2": {"segment": "sn46.51:12.2", "en": "There are things that are grounds for the awakening factor of equanimity.", "pi": "Atthi, bhikkhave, upekkhāsambojjhaṅgaṭṭhānīyā dhammā.", "url": "https://suttacentral.net/sn46.51/en/sujato#sn46.51:12.2", "contested": null, "sense": null}, "p-sn46.51-12.3": {"segment": "sn46.51:12.3", "en": "Frequent rational application of mind to them", "pi": "Tattha yonisomanasikārabahulīkāro—", "url": "https://suttacentral.net/sn46.51/en/sujato#sn46.51:12.3", "contested": null, "sense": null}, "p-sn46.51-13.2": {"segment": "sn46.51:13.2", "en": "There is the feature of ugliness.", "pi": "Atthi, bhikkhave, asubhanimittaṁ.", "url": "https://suttacentral.net/sn46.51/en/sujato#sn46.51:13.2", "contested": null, "sense": null}, "p-sn46.51-13.3": {"segment": "sn46.51:13.3", "en": "Frequent rational application of mind to that", "pi": "Tattha yonisomanasikārabahulīkāro—", "url": "https://suttacentral.net/sn46.51/en/sujato#sn46.51:13.3", "contested": null, "sense": null}, "p-sn46.51-14.2": {"segment": "sn46.51:14.2", "en": "There is the heart’s release by love.", "pi": "Atthi, bhikkhave, mettācetovimutti.", "url": "https://suttacentral.net/sn46.51/en/sujato#sn46.51:14.2", "contested": null, "sense": null}, "p-sn46.51-14.3": {"segment": "sn46.51:14.3", "en": "Frequent rational application of mind to that", "pi": "Tattha yonisomanasikārabahulīkāro—", "url": "https://suttacentral.net/sn46.51/en/sujato#sn46.51:14.3", "contested": null, "sense": null}, "p-sn46.51-15.2": {"segment": "sn46.51:15.2", "en": "There are the elements of initiative, persistence, and exertion.", "pi": "Atthi, bhikkhave, ārambhadhātu nikkamadhātu parakkamadhātu.", "url": "https://suttacentral.net/sn46.51/en/sujato#sn46.5
