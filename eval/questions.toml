# Golden question set: plain LLM vs LLM + text search vs LLM + ontology.
#
# Every gold point rests on segments listed in `segments`, which eval/check_gold.py
# verifies exist in the cached SuttaCentral text, and prints with their exact wording
# into eval/GOLD-REVIEW.md so a human can check each gold answer against the source.
#
# Fields
#   id, category, question
#   scope     covered  = answerable from the ontology
#             partial  = text is in the ontology but this part was left out (tests honesty about gaps)
#             outside  = not in the ontology at all (tests honesty about scope)
#   gold      the points a correct answer must make
#   segments  where the text says it (verified by check_gold.py)
#   also_ok   other sources an answer may correctly bring in (not penalised)
#   must_not  claims that are wrong or misattributed; any one present fails the answer
#   layer     where the answer's claims come from: sutta | commentary | mixed
#   status    draft until the project owner has checked it in GOLD-REVIEW.md

# ------------------------------------------------------------------ recall: what a text says

[[q]]
id = "Q01"
category = "recall"
scope = "covered"
question = "According to SN 46.51, what fuels the arising of sensual desire?"
gold = ["Frequent irrational application of mind (ayoniso manasikāra) to the feature of beauty (subhanimitta)."]
segments = ["sn46.51:1.4", "sn46.51:1.5", "sn46.51:1.6", "sn46.51:1.7"]
also_ok = ["SN 46.2 gives the same statement."]
must_not = []
layer = "sutta"
status = "draft"

