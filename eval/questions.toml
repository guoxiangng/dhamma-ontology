  "The fetter is restlessness alone; the hindrance is the compound restlessness and remorse (uddhaccakukkucca). Remorse is not among the higher fetters.",
]
segments = ["sn46.130:1.2", "sn46.130:1.4", "sn46.51:4.1"]
also_ok = []
must_not = ["Remorse (kukkucca) is one of the five higher fetters.", "The higher fetter of restlessness is the same as the hindrance of restlessness and remorse."]
layer = "sutta"
status = "draft"
note = "Added with SN 46 batch 2."

[[q]]
id = "Q40"
category = "partial"
scope = "partial"
question = "According to SN 46.26, what follows when craving is given up?"
gold = ["Deeds are given up; and when deeds are given up, suffering is given up. So when craving ends, deeds end, and when deeds end, suffering ends."]
segments = ["sn46.26:2.2", "sn46.26:2.3", "sn46.26:2.4", "sn46.26:2.9"]
also_ok = []
must_not = []
layer = "sutta"
status = "draft"
note = "This chain is left out of the ontology until a pattern for chains is agreed (see COVERAGE.md). A system using the ontology should say so, not invent an answer."

[[q]]
id = "Q41"
category = "recall"
scope = "covered"
question = "According to SN 46.57, what results can one expect from developing the perception of a skeleton (aṭṭhikasaññā)?"
gold = [
  "One of two results: enlightenment in this very life (aññā) or, if there is residue left behind, non-return (anāgāmitā).",
  "It is developed together with the seven awakening factors, and is very fruitful and beneficial; it also leads to great benefit, great sanctuary from the yoke, great inspiration and dwelling in great ease.",
]
segments = ["sn46.57:1.2", "sn46.57:1.4", "sn46.57:2.1", "sn46.57:3.1", "sn46.57:4.1", "sn46.57:5.1", "sn46.57:6.1"]
also_ok = []
must_not = ["Arahantship is guaranteed. (The text says one of two results: enlightenment in this life or non-return.)"]
layer = "sutta"
status = "draft"
note = "Added with the perception series (D15)."

[[q]]
id = "Q42"
category = "partial"
scope = "partial"
question = "Does SN 46.71 itself say that the perception of impermanence leads to non-return?"
gold = [
  "Not in so many words. SN 46.71 is abbreviated in the Pali (…pe…); the visible line says only that the perception of impermanence, developed and cultivated, is very fruitful and beneficial.",
  "The fuller statement of results is given for SN 46.57 and 46.76, which the abbreviated suttas are understood to repeat.",
]
segments = ["sn46.71:1.1", "sn46.57:2.1", "sn46.76:2.1"]
also_ok = ["Explaining that the abbreviation is meant to be expanded from SN 46.57."]
must_not = ["SN 46.71 explicitly states that the perception of impermanence leads to non-return."]
layer = "sutta"
status = "draft"
note = "Tests honesty about abbreviated texts (D14)."

[[q]]
id = "Q43"
category = "recall"
scope = "covered"
question = "According to SN 46.3, what gives rise to rapture, and what does rapture in turn lead to?"
gold = [
  "Energy: when they're energetic, rapture not of the flesh (pīti nirāmisā) arises.",
  "When the mind is full of rapture, the body and mind become tranquil, which initiates the awakening factor of tranquility.",
]
segments = ["sn46.3:4.2", "sn46.3:5.1", "sn46.3:5.2", "sn46.3:6.1"]
also_ok = ["Giving the whole sequence, from recollecting the teaching through to equanimity."]
must_not = []
layer = "sutta"
status = "draft"
note = "Added with SN 46.3 (D16)."

[[q]]
id = "Q44"
category = "trap"
scope = "covered"
question = "In SN 46.56, who says that 'overcome by even a single hindrance you wouldn't truly know or see, let alone all five'?"
gold = [
  "Prince Abhaya, responding with approval after the Buddha's explanation. The Buddha's own statement is that the hindrances are a cause and reason for not knowing and not seeing.",
]
segments = ["sn46.56:4.3", "sn46.56:4.5", "sn46.56:2.4"]
also_ok = []
must_not = ["The Buddha says it.", "SN 46.56 teaches, in the Buddha's words, that a single hindrance is enough to prevent knowing and seeing."]
layer = "sutta"
status = "draft"
note = "Tests attribution to the right speaker (D17). The ontology leaves Abhaya's lines out."

[[q]]
id = "Q45"
category = "recall"
scope = "covered"
question = "According to SN 46.52, in what way do the five hindrances become ten?"
gold = [
  "Each becomes twofold. Sensual desire, ill will and doubt are each internal and external (ajjhattaṁ, bahiddhā).",
  "Dullness and drowsiness splits into dullness (thinaṁ) and drowsiness (middhaṁ); restlessness and remorse into restlessness (uddhaccaṁ) and remorse (kukkuccaṁ).",
]
segments = ["sn46.52:9.2", "sn46.52:9.4", "sn46.52:9.6", "sn46.52:9.8", "sn46.52:9.10", "sn46.52:9.12"]
also_ok = ["Noting that the Buddha poses this as a question the wanderers of other religions could not answer."]
must_not = []
layer = "sutta"
status = "draft"
note = "Added with SN 46.52 (D18)."

[[q]]
id = "Q46"
category = "trap"
scope = "covered"
question = "In SN 46.52, energy and tranquility each become twofold as internal and external, like mindfulness. True?"
gold = [
  "No. Energy is physical and mental (kāyikaṁ vīriyaṁ, cetasikaṁ vīriyaṁ), and so is tranquility (kāyappassaddhi, cittappassaddhi). Internal and external is the division for mindfulness, investigation and equanimity.",
  "Rapture and immersion are divided differently again: with and without placing the mind and keeping it connected (savitakka, avitakka).",
]
segments = ["sn46.52:12.1", "sn46.52:14.1", "sn46.52:10.2", "sn46.52:13.1", "sn46.52:15.1"]
also_ok = []
must_not = ["Yes, all seven are divided into internal and external."]
layer = "sutta"
status = "draft"
note = "Tests the four different bases of division (D18)."

[[q]]
id = "Q47"
category = "trap"
scope = "covered"
question = "Does SN 46.52 say the five hindrances are 'corruptions of the heart that weaken wisdom'?"
gold = [
  "The phrase appears, but in the mouths of the wanderers of other religions, quoting what they say the ascetic Gotama teaches (cetaso upakkilese paññāya dubbalīkaraṇe). The Buddha's own teaching in SN 46.52 is how the hindrances become ten and the awakening factors fourteen.",
]
segments = ["sn46.52:3.1", "sn46.52:3.2", "sn46.52:9.1"]
also_ok = ["Noting that similar wording is the Buddha's own in other suttas, without asserting which."]
must_not = ["Yes, the Buddha teaches this in SN 46.52."]
layer = "sutta"
status = "draft"
note = "Speaker attribution (D17). The ontology leaves the wanderers' lines out."

[[q]]
id = "Q48"
category = "trap"
scope = "covered"
question = "In SN 46.57, what is developed: the perception of a skeleton together with the awakening factors, or the awakening factors accompanied by that perception?"
gold = [
  "In the Pali, the awakening factors are what is developed, each accompanied by the perception of a skeleton (aṭṭhikasaññāsahagataṁ satisambojjhaṅgaṁ bhāveti), relying on seclusion, fading away and cessation. Sujato's English reads 'develops the perception of a skeleton together with the awakening factors', which turns the grammar round.",
]
segments = ["sn46.57:1.4", "sn46.57:1.5"]
also_ok = ["Noting that both readings link the perception and the factors, and the Pali's grammatical object is the factor."]
must_not = ["The perception is what is developed, and the awakening factors are added to it."]
layer = "sutta"
status = "draft"
note = "Added after the 2026-11-15 audit found the ontology had followed the English (D15 correction, D19)."

[[q]]
id = "Q49"
category = "recall"
scope = "covered"
question = "In SN 46.6, what fulfils the seven awakening factors, and what do the awakening factors fulfil?"
gold = [
  "The four kinds of mindfulness meditation (cattāro satipaṭṭhānā), developed and cultivated, fulfil the seven awakening factors; the seven awakening factors fulfil knowledge and freedom (vijjāvimuttiṁ).",
  "The ladder starts lower: sense restraint fulfils the three kinds of good conduct, which fulfil the four kinds of mindfulness meditation.",
]
segments = ["sn46.6:2.2", "sn46.6:2.4", "sn46.6:2.6", "sn46.6:2.8", "sn46.6:7.6", "sn46.6:8.4"]
also_ok = []
must_not = []
layer = "sutta"
status = "draft"
note = "Added with SN 46.6 (D20)."

[[q]]
id = "Q50"
category = "trap"
scope = "covered"
question = "Does SN 46.14 teach that reciting or hearing the awakening factors cures illness?"
gold = [
  "No. The Buddha tells the sick Mahākassapa that the seven awakening factors, developed and cultivated, lead to direct knowledge, awakening and extinguishment (abhiññāya sambodhāya nibbānāya). The text then narrates that Mahākassapa recovered; it does not teach that the factors heal.",
]
segments = ["sn46.14:3.1", "sn46.14:4.3"]
also_ok = ["Mentioning that later tradition uses these suttas as protective chants (paritta), as long as this is not attributed to the text."]
must_not = ["Yes, the sutta teaches that the awakening factors cure illness."]
layer = "sutta"
status = "draft"
note = "Narrated vs taught (D20)."

[[q]]
id = "Q51"
category = "trap"
scope = "covered"
question = "In SN 46.8, who explains how a mendicant can know the awakening factors are properly implemented so that they lead to living at ease?"
gold = [
  "Venerable Upavāṇa, answering Venerable Sāriputta's question; the Buddha does not appear. The factors, properly implemented by rational application of mind (yonisomanasikārā), lead to living at ease (phāsuvihārāya).",
]
segments = ["sn46.8:2.1", "sn46.8:2.2", "sn46.8:3.3"]
also_ok = []
must_not = ["The Buddha explains it.", "Sāriputta explains it to Upavāṇa."]
layer = "sutta"
status = "draft"
note = "Speaker attribution (D17)."

[[q]]
id = "Q52"
category = "recall"
scope = "covered"
question = "According to SN 46.54, what is the apex of the heart's release by compassion, and of the heart's release by equanimity?"
gold = [
  "Compassion: the dimension of infinite space (ākāsānañcāyatana). Equanimity: the dimension of nothingness (ākiñcaññāyatana). Each 'for a wise mendicant here who has not penetrated to a higher freedom'.",
  "The other two: love has the beautiful (subha) as its apex, rejoicing the dimension of infinite consciousness.",
]
segments = ["sn46.54:13.7", "sn46.54:15.10", "sn46.54:12.9", "sn46.54:14.7"]
also_ok = []
must_not = ["The apex of the heart's release by love is the dimension of infinite space."]
layer = "sutta"
status = "draft"
note = "Added with SN 46.54 (D21)."

[[q]]
id = "Q53"
category = "trap"
scope = "covered"
question = "In SN 46.54, does the Buddha answer the wanderers by teaching how to spread a heart full of love to every direction?"
gold = [
  "No. The spreading of love, compassion, rejoicing and equanimity to every direction is in the wanderers' account of what both they and the Buddha teach. The Buddha's answer says how each heart's release is developed: each awakening factor developed accompanied by love (mettāsahagataṁ satisambojjhaṅgaṁ bhāveti) and so on, and gives each release's apex.",
]
segments = ["sn46.54:3.2", "sn46.54:12.2", "sn46.54:12.9"]
also_ok = ["Noting that the spreading formula is the Buddha's own teaching in other suttas, without asserting which."]
must_not = ["Yes, the Buddha's reply in SN 46.54 is the instruction to spread love in all directions."]
layer = "sutta"
status = "draft"
note = "Speaker attribution (D17) and the Pali's direction (D21)."
