name: pages

# Builds the three viewers from the ontology and publishes them, with the downloads, to
# https://guoxiangng.github.io/dhamma-ontology/ (ask page at the root).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build passages, viewers and downloads
        run: |
          python scripts/build_passages.py
          python scripts/dho.py check
          python scripts/export_graph.py
          python scripts/export_review.py
          python scripts/export_ask.py
          python scripts/release.py
      - name: Assemble the site
        run: |
          mkdir -p site/dist
          cp viz/ask.html site/index.html
          cp viz/graph.html viz/review.html site/
          cp dist/* site/dist/
          cp dist/dhamma-ontology.ttl site/ns.ttl
          touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
