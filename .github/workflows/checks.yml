name: checks

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Passages regenerate from cached sources
        run: python scripts/build_passages.py
      - name: Reason, apply rules, validate (SHACL)
        run: python scripts/dho.py check
      - name: Tests (clean data passes, broken fixtures caught)
        run: python -m pytest -q tests
      - name: Gold answers match the text
        run: python eval/check_gold.py
